name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ports published by docker-compose.local.yaml (defaults). The API CORS origin is http://localhost:5173.
  E2E_BASE_URL: http://localhost:5173
  E2E_API_URL: http://localhost:8080/api/v1
  # Must match ui/package.json @playwright/test (1.65.1).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble

jobs:
  secret-check:
    name: secret check
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check that the E2E password secret exists
        id: check
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "${E2E_USER_PASSWORD}" ]; then
            echo "::notice title=e2e skipped::Add the E2E_USER_PASSWORD repository secret to enable the e2e workflow."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

  e2e:
    name: e2e
    needs: secret-check
    if: needs.secret-check.outputs.available == 'true'
    # TEMPORARY: non-blocking while the suite stabilises. Remove this line (and the comment) and make the
    # job blocking once the suite has been green for 3 consecutive runs.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the local stack
        run: docker compose -f docker-compose.local.yaml up -d --build

      - name: Wait for API and UI, check migrations
        run: |
          set -euo pipefail
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:5173/ > /dev/null
          migrate_id="$(docker compose -f docker-compose.local.yaml ps -a -q migrate)"
          if [ -z "${migrate_id}" ]; then
            echo "The migrate container was not created"
            exit 1
          fi
          code="$(docker inspect -f '{{.State.ExitCode}}' "${migrate_id}")"
          if [ "${code}" != "0" ]; then
            echo "The migrate service exited with code ${code}"
            docker compose -f docker-compose.local.yaml logs migrate
            exit 1
          fi
          echo "API healthy, UI reachable, migrations applied."

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Seed the e2e scenario
        env:
          SEED_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: go run ./cmd/seed --scenario e2e --force-reset

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run functional and layout e2e tests
        working-directory: ui
        run: npm run e2e

      - name: Run visual e2e tests in the Playwright container
        # Non-blocking: visual baselines are Linux-only and still being stabilised.
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/ui:/work" \
            -w /work \
            -e CI=1 \
            -e E2E_VISUAL=1 \
            -e E2E_BASE_URL \
            -e E2E_API_URL \
            -e E2E_USER_PASSWORD \
            "${PLAYWRIGHT_IMAGE}" \
            npm run e2e:visual

      - name: Show stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yaml logs --no-color --tail 300

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore
