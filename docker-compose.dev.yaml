# Override de desarrollo: uso con docker-compose.local.yaml.
#   docker compose -f docker-compose.local.yaml -f docker-compose.dev.yaml up -d
# Solo cambia el servicio ui: el codigo de ui/ se monta como volumen y Vite recarga
# el navegador al guardar. db, migrate y api siguen como en el archivo base.
# Los datos de PostgreSQL y los adjuntos viven en volumenes con nombre y no se pierden al bajar el stack.

services:
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${CORELOG_LOCAL_API_PORT:-8080}/api/v1
      # Docker Desktop en Windows no propaga los eventos de archivos: el sondeo asegura la recarga.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./ui:/app
      # Evita que node_modules del host (binarios de Windows) sustituya a los del contenedor.
      - ui_dev_node_modules:/app/node_modules
    ports: !override
      - "${CORELOG_LOCAL_UI_PORT:-5173}:5173"
    healthcheck: !override
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  ui_dev_node_modules:
