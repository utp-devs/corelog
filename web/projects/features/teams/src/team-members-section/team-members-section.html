<app-section
  title="Miembros"
  [description]="canManage() ? 'Agrega personas de la organización y define su rol.' : readOnlyText"
>
  @if (canManage()) {
    <div class="team-members-section__add" role="group" aria-label="Agregar miembro">
      <div class="team-members-section__picker">
        <app-user-picker
          [users]="pickable()"
          [(value)]="pickedId"
          (search)="handleSearch($event)"
          [loading]="searching()"
          placeholder="Buscar una persona de la organización"
        />
      </div>
      <app-select-field
        class="team-members-section__new-role"
        ariaLabel="Rol del nuevo miembro"
        filter="off"
        [options]="roleOptions"
        [ngModel]="newRole()"
        (ngModelChange)="setNewRole($event)"
      />
      <p-button
        label="Agregar miembro"
        [disabled]="!pickedId()"
        [loading]="adding()"
        (onClick)="handleAdd()"
      />
    </div>
  }

  <app-data-table
    tableKey="team-members"
    [columns]="columns"
    [data]="members()"
    rowKey="userId"
    [loading]="status() === 'loading'"
    [error]="errorMessage()"
    [emptyState]="emptyTemplate"
    [mobileRender]="mobileTemplate"
    (retry)="retry.emit()"
  >
    <ng-template appDataTableCell="person" let-member>
      <app-user-chip
        [user]="{ id: member.userId, name: member.name, role: member.email || null }"
      />
    </ng-template>
    <ng-template appDataTableCell="role" let-member>
      <ng-container *ngTemplateOutlet="roleControl; context: { $implicit: member }" />
    </ng-template>
    <ng-template appDataTableCell="actions" let-member>
      <ng-container *ngTemplateOutlet="removeButton; context: { $implicit: member }" />
    </ng-template>
  </app-data-table>
</app-section>

<ng-template #roleControl let-member>
  @if (canManage()) {
    <app-select-field
      class="team-members-section__role"
      size="compact"
      filter="off"
      [ariaLabel]="'Rol de ' + member.name"
      [options]="roleOptions"
      [ngModel]="member.role"
      (ngModelChange)="changeRole(member, $event)"
    />
  } @else {
    <app-lozenge [tone]="member.role === 'maintainer' ? 'info' : 'neutral'">{{
      roleLabel(member.role)
    }}</app-lozenge>
  }
</ng-template>

<ng-template #removeButton let-member>
  @if (canManage()) {
    <p-button
      severity="danger"
      size="small"
      [text]="true"
      icon="pi pi-user-minus"
      label="Quitar"
      [ariaLabel]="'Quitar a ' + member.name + ' del equipo'"
      (onClick)="askRemove(member)"
    />
  }
</ng-template>

<ng-template #emptyTemplate>
  <app-empty-state
    title="Este equipo aún no tiene miembros"
    [description]="canManage() ? 'Agrega personas con el formulario de arriba.' : undefined"
  />
</ng-template>

<ng-template #mobileTemplate let-member>
  <div class="team-members-section__card">
    <app-user-chip [user]="{ id: member.userId, name: member.name, role: member.email || null }" />
    <div class="team-members-section__card-actions">
      <ng-container *ngTemplateOutlet="roleControl; context: { $implicit: member }" />
      <ng-container *ngTemplateOutlet="removeButton; context: { $implicit: member }" />
    </div>
  </div>
</ng-template>

<app-confirm-modal
  [open]="removing() !== null"
  title="¿Quitar del equipo?"
  [description]="removing() ? removing()!.name + ' dejará de pertenecer a este equipo.' : undefined"
  confirmText="Quitar"
  [danger]="true"
  [loading]="removingBusy()"
  (confirmed)="confirmRemove()"
  (cancelled)="removing.set(null)"
/>
