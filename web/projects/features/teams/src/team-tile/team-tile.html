<span
  class="team-tile"
  aria-hidden="true"
  [class.team-tile--md]="size() === 'md'"
  [class.team-tile--lg]="size() === 'lg'"
  [attr.data-custom]="customColor() ? 'true' : null"
  [attr.data-palette]="customColor() ? null : palette()"
  [style.--cl-team-color]="customColor()"
  >{{ initials() }}</span
>
