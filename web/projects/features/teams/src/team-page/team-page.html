@if (teamReady() && team(); as current) {
  <app-page-container variant="wide" [ready]="true" pageName="team">
    <div class="team-page">
      <header class="team-page__header">
        <app-team-tile
          [id]="current.id"
          [name]="current.name"
          [color]="current.avatarColor"
          size="lg"
        />
        <div class="team-page__identity">
          <h1 class="team-page__title">{{ current.name }}</h1>
          <p class="team-page__description">{{ current.description || 'Sin descripción' }}</p>
          <ul class="team-page__meta" aria-label="Datos del equipo">
            <li class="team-page__meta-item">
              <i class="pi pi-users" aria-hidden="true"></i>
              {{ membersSummary() }}
            </li>
            <li class="team-page__meta-item">
              <i class="pi pi-user" aria-hidden="true"></i>
              Creado por {{ creatorName() }}
            </li>
            <li class="team-page__meta-item">
              <i class="pi pi-calendar" aria-hidden="true"></i>
              <time [attr.datetime]="current.createdAt">{{ formatDate(current.createdAt) }}</time>
            </li>
          </ul>
        </div>
        @if (canManage()) {
          <div class="team-page__actions">
            <p-button
              label="Editar equipo"
              icon="pi pi-pencil"
              severity="secondary"
              [outlined]="true"
              (onClick)="editOpen.set(true)"
            />
            <p-button
              label="Eliminar equipo"
              icon="pi pi-trash"
              severity="danger"
              [outlined]="true"
              (onClick)="deleteOpen.set(true)"
            />
          </div>
        }
      </header>

      <app-team-members-section
        [teamId]="current.id"
        [members]="members()"
        [status]="membersStatus()"
        [error]="membersError()"
        [canManage]="canManage()"
        (retry)="reloadMembers()"
      />
    </div>

    <app-team-form-modal
      [open]="editOpen()"
      title="Editar equipo"
      [initial]="initialValues()"
      [onSubmit]="saveEdit"
      (cancelled)="editOpen.set(false)"
      [(dirty)]="formDirty"
    />

    <app-confirm-danger-modal
      [open]="deleteOpen()"
      title="Eliminar equipo"
      [description]="deleteDescription"
      [confirmation]="current.name"
      confirmText="Eliminar equipo"
      [loading]="deleting()"
      (confirmed)="confirmDelete()"
      (cancelled)="deleteOpen.set(false)"
    />
  </app-page-container>
} @else {
  <app-page-container variant="wide" [ready]="false" pageName="team">
    @if (teamStatus() === 'error') {
      <app-error-state [message]="notFoundMessage()" [canRetry]="true" (retry)="reloadTeam()" />
    } @else {
      <app-loading-skeleton variant="detail" />
    }
  </app-page-container>
}
