<app-dialog
  size="md"
  [heading]="title()"
  subtitle="Los equipos agrupan a las personas que trabajan juntas."
  [open]="open()"
  (closeRequested)="requestCancel()"
>
  <div class="team-form-modal__form" [formGroup]="form">
    @if (serverError(); as message) {
      <div class="team-form-modal__alert" role="alert">{{ message }}</div>
    }

    <div class="team-form-modal__field">
      <label class="team-form-modal__label" for="team-name">Nombre del equipo</label>
      <input
        data-autofocus
        pInputText
        id="team-name"
        type="text"
        class="team-form-modal__control"
        formControlName="name"
        aria-required="true"
        [attr.aria-invalid]="nameError() ? 'true' : null"
        aria-describedby="team-name-help"
      />
      <p
        id="team-name-help"
        class="team-form-modal__help"
        [class.team-form-modal__help--error]="nameError() !== null"
      >
        {{ nameError() ?? nameHelp }}
      </p>
    </div>

    <div class="team-form-modal__field">
      <label class="team-form-modal__label" for="team-description">Descripción</label>
      <textarea
        pTextarea
        id="team-description"
        class="team-form-modal__control"
        rows="3"
        formControlName="description"
        [attr.aria-invalid]="descriptionError() ? 'true' : null"
        [attr.aria-describedby]="descriptionError() ? 'team-description-help' : null"
      ></textarea>
      @if (descriptionError(); as message) {
        <p id="team-description-help" class="team-form-modal__help team-form-modal__help--error">
          {{ message }}
        </p>
      }
    </div>

    <div class="team-form-modal__field">
      <span class="team-form-modal__label">Color del equipo</span>
      <app-color-picker label="Color del equipo" formControlName="color" data-testid="team-color" />
    </div>
  </div>

  <p-button dialogFooter label="Cancelar" severity="secondary" (onClick)="requestCancel()" />
  <p-button dialogFooter label="Guardar" [loading]="submitting()" (onClick)="submit()" />
</app-dialog>

<app-confirm-modal
  [open]="discardOpen()"
  [title]="unsavedTitle"
  [description]="unsavedDescription"
  [confirmText]="unsavedConfirm"
  [cancelText]="unsavedCancel"
  (confirmed)="discard()"
  (cancelled)="discardOpen.set(false)"
/>
