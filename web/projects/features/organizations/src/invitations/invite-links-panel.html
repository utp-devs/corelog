<app-section
  title="Enlaces de invitación"
  description="Este enlace solo se muestra una vez. Cópialo y compártelo ahora. Si lo pierdes, reenvía la invitación para generar uno nuevo; el anterior dejará de funcionar."
  ariaLabel="Enlaces de invitación"
>
  <div appSectionActions>
    <p-button
      label="Ocultar"
      [text]="true"
      type="button"
      class="touch-target"
      (onClick)="dismissed.emit()"
    />
  </div>
  <ul class="link-list">
    @for (invitation of invitations(); track invitation.id) {
      <li class="link-item">
        <div class="link-meta">
          <strong>{{ invitation.email }}</strong>
          <span class="muted">{{ roleLabel(invitation.role) }}</span>
        </div>
        <code class="link-url" [attr.aria-label]="'Enlace de ' + invitation.email">{{
          invitation.acceptUrl
        }}</code>
        <p-button
          size="small"
          severity="secondary"
          [outlined]="true"
          type="button"
          class="touch-target"
          [label]="'Copiar enlace de ' + invitation.email"
          (onClick)="copy(invitation.acceptUrl)"
        />
      </li>
    }
  </ul>
</app-section>
