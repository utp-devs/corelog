<app-section
  title="Enlaces de invitación"
  description="Este enlace solo se muestra una vez. Cópialo y compártelo ahora. Si lo pierdes, reenvía la invitación para generar uno nuevo; el anterior dejará de funcionar."
  ariaLabel="Enlaces de invitación"
  class="invite-links-panel"
>
  <p-button
    appSectionActions
    label="Ocultar"
    [text]="true"
    type="button"
    (onClick)="dismissed.emit()"
  />
  <ul class="invite-links-panel__list">
    @for (invitation of invitations(); track invitation.id) {
      <li class="invite-links-panel__item">
        <div class="invite-links-panel__meta">
          <strong class="invite-links-panel__email">{{ invitation.email }}</strong>
          <app-lozenge tone="neutral">{{ roleLabel(invitation.role) }}</app-lozenge>
        </div>
        <code class="invite-links-panel__url" [attr.aria-label]="'Enlace de ' + invitation.email">{{
          invitation.acceptUrl
        }}</code>
        <p-button
          appTooltip="Copiar el enlace al portapapeles"
          icon="pi pi-copy"
          label="Copiar"
          severity="secondary"
          [outlined]="true"
          type="button"
          [ariaLabel]="'Copiar enlace de ' + invitation.email"
          (onClick)="copy(invitation.acceptUrl)"
        />
      </li>
    }
  </ul>
</app-section>
