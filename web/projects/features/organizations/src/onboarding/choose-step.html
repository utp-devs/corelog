<div class="choose-step">
  <section class="choose-step__choice" aria-labelledby="onboarding-create-title">
    <span class="choose-step__icon" aria-hidden="true"><i class="pi pi-building"></i></span>
    <h2 id="onboarding-create-title" class="choose-step__title">Crear organización</h2>
    <p class="choose-step__text">
      Crea un espacio nuevo para tus proyectos, equipos e incidencias. Serás su propietario.
    </p>
    <div class="choose-step__actions">
      <p-button
        label="Crear organización"
        size="large"
        type="button"
        [fluid]="true"
        (onClick)="create.emit()"
      />
    </div>
  </section>

  <section class="choose-step__choice" aria-labelledby="onboarding-join-title">
    <span class="choose-step__icon" aria-hidden="true"><i class="pi pi-link"></i></span>
    <h2 id="onboarding-join-title" class="choose-step__title">Unirme con invitación</h2>
    <p class="choose-step__text">
      Pega el enlace que te han enviado para unirte a una organización existente.
    </p>
    <form class="choose-step__form" novalidate (submit)="$event.preventDefault(); join()">
      <app-field-row label="Enlace de invitación" [error]="error() ?? undefined">
        <input
          pInputText
          appFieldControl
          pSize="large"
          type="text"
          placeholder="https://.../invite/..."
          aria-label="Enlace o código de invitación"
          [fluid]="true"
          [ngModel]="link()"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onLinkInput($event)"
        />
      </app-field-row>
      <p-button
        label="Continuar"
        type="submit"
        size="large"
        severity="secondary"
        [outlined]="true"
        [fluid]="true"
      />
    </form>
  </section>
</div>
