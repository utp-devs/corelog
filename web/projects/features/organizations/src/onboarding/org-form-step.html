<form
  class="org-form-step"
  aria-label="Datos de la organización"
  novalidate
  (submit)="$event.preventDefault(); submit()"
>
  <app-field-row
    label="Nombre de la organización"
    [required]="true"
    [error]="errorOf(form.controls.name)"
  >
    <input
      pInputText
      appFieldControl
      pSize="large"
      type="text"
      autocomplete="organization"
      aria-label="Nombre de la organización"
      [fluid]="true"
      [formControl]="form.controls.name"
    />
  </app-field-row>

  <app-field-row
    label="Identificador (slug)"
    [required]="true"
    [error]="errorOf(form.controls.slug)"
    [helper]="slugRule"
  >
    <input
      pInputText
      appFieldControl
      pSize="large"
      type="text"
      autocapitalize="none"
      spellcheck="false"
      aria-label="Identificador de la organización"
      [fluid]="true"
      [formControl]="form.controls.slug"
    />
    @if (slug()) {
      <p class="org-form-step__preview">
        Tu organización se identificará como <code class="org-form-step__slug">{{ slug() }}</code>
      </p>
    }
  </app-field-row>

  @if (formError(); as message) {
    <div role="alert">
      <p-message severity="error" [closable]="false">{{ message }}</p-message>
    </div>
  }

  <div class="org-form-step__actions">
    <p-button
      label="Atrás"
      severity="secondary"
      [outlined]="true"
      size="large"
      type="button"
      (onClick)="back.emit()"
      [fluid]="true"
    />
    <p-button
      label="Crear organización"
      size="large"
      type="submit"
      [loading]="submitting()"
      [fluid]="true"
    />
  </div>
</form>
