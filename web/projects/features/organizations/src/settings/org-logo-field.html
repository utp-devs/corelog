<div class="org-logo-field">
  <div class="org-logo-field__preview" [attr.aria-hidden]="logoUrl() ? null : 'true'">
    @if (logoUrl(); as url) {
      <img class="org-logo-field__image" [src]="url" [alt]="'Logo de ' + organizationName()" />
    } @else {
      <span class="org-logo-field__empty">Sin logo</span>
    }
  </div>
  <div class="org-logo-field__actions">
    <span class="org-logo-field__hint">PNG, JPEG o WebP de hasta 2 MB.</span>
    <div class="org-logo-field__buttons">
      <p-button
        label="Subir logo"
        icon="pi pi-upload"
        severity="secondary"
        [outlined]="true"
        type="button"
        [disabled]="!canEdit() || busy()"
        [loading]="busy()"
        [attr.title]="
          canEdit() ? null : 'Solo propietarios y administradores pueden cambiar el logo.'
        "
        (onClick)="chooseFile()"
      />
      @if (logoUrl()) {
        <p-button
          label="Quitar logo"
          severity="danger"
          [text]="true"
          type="button"
          [disabled]="!canEdit() || busy()"
          (onClick)="removeLogo()"
        />
      }
    </div>
    <input
      #fileInput
      type="file"
      class="org-logo-field__file"
      [attr.accept]="accept"
      aria-label="Elegir archivo de logo"
      [disabled]="!canEdit()"
      (change)="onFileChosen($event)"
    />
    @if (clientError(); as message) {
      <p class="org-logo-field__error" role="alert">{{ message }}</p>
    }
  </div>
</div>
