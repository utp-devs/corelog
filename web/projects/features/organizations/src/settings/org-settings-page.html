@if (org(); as current) {
  <app-page-container variant="reading" pageName="org-settings" [ready]="true">
    <app-page-header
      banner="settings"
      title="Configuración de la organización"
      [subtitle]="current.name"
    />

    <div class="org-settings-page">
      @if (!canEdit()) {
        <p-message severity="info" [closable]="false">
          <span class="org-settings-page__alert">
            <strong>Solo lectura</strong>
            <span
              >Solo los propietarios y administradores pueden cambiar la configuración. Puedes ver
              los valores actuales.</span
            >
          </span>
        </p-message>
      }

      <form
        class="org-settings-page__form"
        aria-label="Configuración de la organización"
        novalidate
        [formGroup]="form"
        (ngSubmit)="save()"
      >
        <app-section
          title="Identidad"
          description="Cómo se muestra la organización a sus miembros."
          ariaLabel="Identidad"
        >
          <div class="org-settings-page__fields">
            <app-field-row label="Nombre" [required]="true" [error]="errorOf(form.controls.name)">
              <input pInputText appFieldControl formControlName="name" maxlength="120" />
            </app-field-row>
            <app-field-row label="Identificador" helper="Se usa en las URL y no puede cambiarse.">
              <input
                pInputText
                appFieldControl
                class="org-settings-page__slug"
                readonly
                [value]="current.slug"
              />
            </app-field-row>
            <app-field-row label="Descripción" [error]="errorOf(form.controls.description)">
              <textarea
                pTextarea
                appFieldControl
                formControlName="description"
                rows="3"
                maxlength="500"
              ></textarea>
            </app-field-row>
          </div>
        </app-section>

        <app-section
          title="Logo"
          description="Se muestra junto al nombre de la organización."
          ariaLabel="Logo"
        >
          <app-org-logo-field
            [organizationId]="current.id"
            [organizationName]="current.name"
            [canEdit]="canEdit()"
          />
        </app-section>

        <app-section
          title="Políticas"
          description="Quién puede crear proyectos y equipos, y la visibilidad por defecto."
          ariaLabel="Políticas"
        >
          <div class="org-settings-page__fields">
            <div class="org-settings-page__policy" role="group" aria-labelledby="policy-projects">
              <h3 class="org-settings-page__policy-title" id="policy-projects">
                Quién puede crear proyectos
              </h3>
              <app-policy-choice
                label="Quién puede crear proyectos"
                [options]="whoOptions"
                formControlName="whoCanCreateProjects"
              />
            </div>
            <div class="org-settings-page__policy" role="group" aria-labelledby="policy-teams">
              <h3 class="org-settings-page__policy-title" id="policy-teams">
                Quién puede crear equipos
              </h3>
              <app-policy-choice
                label="Quién puede crear equipos"
                [options]="whoOptions"
                formControlName="whoCanCreateTeams"
              />
            </div>
            <app-field-row
              #visibilityRow
              label="Visibilidad por defecto de los proyectos"
              [error]="errorOf(form.controls.defaultProjectVisibility)"
            >
              <app-select-field
                formControlName="defaultProjectVisibility"
                filter="off"
                [inputId]="visibilityRow.controlId"
                [ariaLabelledBy]="visibilityRow.labelId"
                [options]="visibilityOptions"
              />
            </app-field-row>
          </div>
        </app-section>

        <app-section
          title="Tiempo"
          description="Jornada de referencia para estimaciones y calendario."
          ariaLabel="Tiempo"
        >
          <div class="org-settings-page__fields">
            <div class="org-settings-page__pair">
              <app-field-row
                label="Horas por día"
                [required]="true"
                [error]="errorOf(form.controls.hoursPerDay)"
              >
                <input
                  pInputText
                  appFieldControl
                  type="number"
                  inputmode="numeric"
                  min="1"
                  max="24"
                  formControlName="hoursPerDay"
                />
              </app-field-row>
              <app-field-row
                label="Días por semana"
                [required]="true"
                [error]="errorOf(form.controls.daysPerWeek)"
              >
                <input
                  pInputText
                  appFieldControl
                  type="number"
                  inputmode="numeric"
                  min="1"
                  max="7"
                  step="1"
                  formControlName="daysPerWeek"
                />
              </app-field-row>
            </div>
            <app-field-row
              #zoneRow
              label="Zona horaria"
              [required]="true"
              [error]="errorOf(form.controls.timezone)"
            >
              <app-select-field
                formControlName="timezone"
                filter="on"
                [inputId]="zoneRow.controlId"
                [ariaLabelledBy]="zoneRow.labelId"
                [options]="timezones()"
              />
            </app-field-row>
          </div>
        </app-section>

        <div class="org-settings-page__actions">
          <p-button
            label="Descartar cambios"
            severity="secondary"
            [outlined]="true"
            type="button"
            [disabled]="!dirtyAndEditable() || saving()"
            (onClick)="discard()"
          />
          <p-button
            label="Guardar cambios"
            type="submit"
            [loading]="saving()"
            [disabled]="!dirtyAndEditable()"
          />
        </div>
      </form>

      <app-org-danger-zone [org]="current" [role]="role()" [members]="members()" />
    </div>
  </app-page-container>
} @else {
  <app-page-container variant="reading" pageName="org-settings" [ready]="true">
    <app-empty-state
      title="Elige una organización"
      description="La configuración corresponde a la organización activa."
    />
  </app-page-container>
}
