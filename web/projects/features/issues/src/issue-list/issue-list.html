<app-data-table
  tableKey="issues"
  rowKey="id"
  [fill]="fill()"
  [columns]="columns()"
  [data]="issues()"
  [loading]="loading()"
  [error]="error()"
  [emptyState]="emptyState()"
  [pagination]="pagination()"
  [rowOpenable]="true"
  [rowActions]="rowActions()"
  [mobileRender]="mobileTpl"
  (rowOpen)="open.emit($event)"
  (retry)="retry.emit()"
  (pageChange)="pageChange.emit($event)"
>
  <ng-template appDataTableCell="key" let-row>
    <app-issue-key
      [issueKey]="keyOf(row)"
      [displayKey]="shortKeyOf(row)"
      [type]="row.issueType"
      [resolved]="isResolved(row)"
      [focusable]="false"
    />
  </ng-template>

  <ng-template appDataTableCell="summary" let-row>
    <a
      class="issue-list__title"
      [class.issue-list__title--resolved]="isResolved(row)"
      [routerLink]="pathOf(row)"
      tabindex="-1"
      >{{ row.summary }}</a
    >
  </ng-template>

  <ng-template appDataTableCell="status" let-row>
    <app-lozenge [category]="statusCategory(row)">{{ statusLabel(row) }}</app-lozenge>
  </ng-template>

  <ng-template appDataTableCell="priority" let-row>
    <span class="issue-list__muted-wrap" [class.issue-list__muted-wrap--resolved]="isResolved(row)">
      <app-priority-tag [priority]="row.priority" />
    </span>
  </ng-template>

  <ng-template appDataTableCell="assignee" let-row>
    <ng-container *ngTemplateOutlet="assigneeTpl; context: { $implicit: row }" />
  </ng-template>

  <ng-template appDataTableCell="updated" let-row>
    <time
      class="issue-list__time"
      [attr.datetime]="row.updatedAt"
      [appTooltip]="(row.updatedAt | date: 'dd/MM/yyyy HH:mm') ?? ''"
      >{{ updatedText(row) }}</time
    >
  </ng-template>
</app-data-table>

<ng-template #assigneeTpl let-row>
  @if (row.assigneeId && row.assigneeName) {
    <app-user-chip [user]="{ id: row.assigneeId, name: row.assigneeName }" />
  } @else {
    <span class="issue-list__unassigned">Sin asignar</span>
  }
</ng-template>

<ng-template #mobileTpl let-row>
  <div class="issue-list__card">
    <app-issue-key
      [issueKey]="keyOf(row)"
      [displayKey]="shortKeyOf(row)"
      [type]="row.issueType"
      [resolved]="isResolved(row)"
      [focusable]="false"
    />
    <a
      class="issue-list__title issue-list__title--wrap"
      [class.issue-list__title--resolved]="isResolved(row)"
      [routerLink]="pathOf(row)"
      tabindex="-1"
      >{{ row.summary }}</a
    >
    <div class="issue-list__card-meta">
      <app-lozenge [category]="statusCategory(row)">{{ statusLabel(row) }}</app-lozenge>
      <app-priority-tag [priority]="row.priority" />
      <ng-container *ngTemplateOutlet="assigneeTpl; context: { $implicit: row }" />
    </div>
  </div>
</ng-template>
