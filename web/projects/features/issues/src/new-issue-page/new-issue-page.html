<app-page-container variant="reading" pageName="issue-new" [ready]="true" [fill]="true">
  <app-page-header
    title="Nueva incidencia"
    subtitle="Registra un problema o una tarea para tu equipo."
  />

  <app-issue-form
    [form]="form"
    [isSubmitting]="isSubmitting()"
    [projectOptions]="projectOptions()"
    [projectsLoading]="projectsLoading()"
    [typeOptions]="typeOptions()"
    [priorityOptions]="priorityOptions()"
    [assigneeUsers]="assigneeUsers()"
    [searchUsers]="searchUsers"
    (submitted)="submit()"
    (cancelled)="cancel()"
  />
</app-page-container>
