<div class="general-section">
  <app-section
    title="Foto de perfil"
    description="Así te ven tus compañeros en incidencias y menciones."
  >
    <app-profile-avatar-uploader [user]="user()" (userChange)="userChange.emit($event)">
      <div class="general-section__identity" aria-label="Resumen de la cuenta" role="group">
        <span class="general-section__name">{{ shownName() }}</span>
        <span class="general-section__email">{{ user().email }}</span>
        <div class="general-section__tags">
          <app-tone-tag [label]="roleLabel()" tone="blue" />
          @if (memberSince(); as since) {
            <app-tone-tag [label]="'Miembro desde ' + since" tone="neutral" />
          }
        </div>
      </div>
    </app-profile-avatar-uploader>
  </app-section>

  <app-section
    title="Datos personales"
    description="Tu nombre y tu cargo son los que ven tus compañeros."
  >
    <app-profile-form
      [user]="user()"
      [timezones]="timezones()"
      [isSubmitting]="isSaving()"
      [save]="save"
      [(dirty)]="dirty"
    />
  </app-section>
</div>
