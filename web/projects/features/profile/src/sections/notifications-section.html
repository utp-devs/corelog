<app-section title="Avisos" description="Los avisos aparecen en la campana de la barra superior.">
  <div class="notifications-section__row">
    <div class="notifications-section__text">
      <span class="notifications-section__title" id="notifications-in-app-label">
        Avisos en la aplicación
      </span>
      <p class="notifications-section__hint">
        Recibe un aviso cuando te asignen una incidencia o te mencionen.
      </p>
    </div>
    <div class="notifications-section__control">
      @if (loading()) {
        <span class="notifications-section__loading" role="status">
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          Cargando preferencias...
        </span>
      }
      <p-toggleswitch
        ariaLabel="Avisos en la aplicación"
        [ngModel]="inAppEnabled() ?? false"
        [disabled]="loading() || inAppEnabled() === null"
        (onChange)="toggleInApp($event.checked)"
      />
    </div>
  </div>

  @if (status(); as message) {
    <p class="notifications-section__status" role="status">{{ message }}</p>
  }
  @if (error(); as message) {
    <p class="notifications-section__error" role="alert">{{ message }}</p>
  }
</app-section>
