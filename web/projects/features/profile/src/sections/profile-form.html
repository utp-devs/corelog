<form
  class="profile-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  aria-label="Datos personales"
>
  <app-field-row label="Nombres" [required]="true" [error]="errorOf('firstName')">
    <input
      pInputText
      appFieldControl
      type="text"
      formControlName="firstName"
      maxlength="80"
      autocomplete="given-name"
    />
  </app-field-row>

  <app-field-row label="Apellidos" [required]="true" [error]="errorOf('lastName')">
    <input
      pInputText
      appFieldControl
      type="text"
      formControlName="lastName"
      maxlength="120"
      autocomplete="family-name"
    />
  </app-field-row>

  <app-field-row
    #phoneRow
    class="profile-form__phone"
    label="Teléfono"
    [optional]="true"
    [error]="errorOf('phone')"
  >
    <app-phone-input
      [inputId]="phoneRow.controlId"
      [invalid]="!!errorOf('phone')"
      [describedBy]="phoneRow.describedBy()"
      formControlName="phone"
    />
    @if (savedPhone(); as saved) {
      @if (!form.controls.phone.dirty) {
        <div class="profile-form__phone-state">
          @if (saved.verified) {
            <app-tone-tag label="Verificado" tone="green" />
          } @else {
            <app-tone-tag label="Sin verificar" tone="neutral" />
            <p-button
              label="Verificar teléfono"
              severity="secondary"
              size="small"
              [outlined]="true"
              (onClick)="verifyOpen.set(true)"
            />
          }
        </div>
      }
    }
  </app-field-row>

  <app-field-row
    label="Nombre para mostrar"
    helper="Así aparecerás en listas y menciones. Si lo dejas vacío se usa tu nombre."
    [error]="errorOf('displayName')"
  >
    <input pInputText appFieldControl type="text" formControlName="displayName" maxlength="120" />
  </app-field-row>

  <app-field-row label="Cargo" [optional]="true" [error]="errorOf('jobTitle')">
    <input pInputText appFieldControl type="text" formControlName="jobTitle" maxlength="120" />
  </app-field-row>

  <app-field-row label="Departamento" [optional]="true" [error]="errorOf('department')">
    <input pInputText appFieldControl type="text" formControlName="department" maxlength="120" />
  </app-field-row>

  <app-field-row #timezoneRow label="Zona horaria" [required]="true" [error]="errorOf('timezone')">
    <app-select-field
      [inputId]="timezoneRow.controlId"
      [ariaLabelledBy]="timezoneRow.labelId"
      ariaLabel="Zona horaria"
      filter="on"
      placeholder="Elige una zona horaria"
      emptyMessage="Sin resultados"
      [options]="timezoneOptions()"
      [invalid]="!!errorOf('timezone')"
      formControlName="timezone"
    />
  </app-field-row>

  <app-field-row
    label="Correo electrónico"
    disabledReason="Tu correo de acceso no se puede cambiar desde aquí."
  >
    <input pInputText appFieldControl type="email" [value]="user().email" disabled readonly />
  </app-field-row>

  <div class="profile-form__actions">
    <p-button
      type="submit"
      label="Guardar cambios"
      [loading]="isSubmitting()"
      [disabled]="!dirty() || isSubmitting()"
    />
  </div>
</form>

<app-phone-verify-dialog
  [open]="verifyOpen()"
  (closed)="verifyOpen.set(false)"
  (verified)="verified.emit($event)"
/>
