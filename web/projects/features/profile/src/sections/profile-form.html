<form
  class="profile-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  aria-label="Datos personales"
>
  <app-field-row label="Nombre" [required]="true" [error]="errorOf('name')">
    <input pInputText appFieldControl type="text" formControlName="name" maxlength="120" />
  </app-field-row>

  <app-field-row
    label="Nombre para mostrar"
    helper="Así aparecerás en listas y menciones. Si lo dejas vacío se usa tu nombre."
    [error]="errorOf('displayName')"
  >
    <input pInputText appFieldControl type="text" formControlName="displayName" maxlength="120" />
  </app-field-row>

  <app-field-row label="Cargo" [optional]="true" [error]="errorOf('jobTitle')">
    <input pInputText appFieldControl type="text" formControlName="jobTitle" maxlength="120" />
  </app-field-row>

  <app-field-row label="Departamento" [optional]="true" [error]="errorOf('department')">
    <input pInputText appFieldControl type="text" formControlName="department" maxlength="120" />
  </app-field-row>

  <app-field-row #timezoneRow label="Zona horaria" [required]="true" [error]="errorOf('timezone')">
    <app-select-field
      [inputId]="timezoneRow.controlId"
      [ariaLabelledBy]="timezoneRow.labelId"
      ariaLabel="Zona horaria"
      filter="on"
      placeholder="Elige una zona horaria"
      emptyMessage="Sin resultados"
      [options]="timezoneOptions()"
      [invalid]="!!errorOf('timezone')"
      formControlName="timezone"
    />
  </app-field-row>

  <app-field-row
    label="Correo electrónico"
    disabledReason="Tu correo de acceso no se puede cambiar desde aquí."
  >
    <input pInputText appFieldControl type="email" [value]="user().email" disabled readonly />
  </app-field-row>

  <div class="profile-form__actions">
    <p-button
      type="submit"
      label="Guardar cambios"
      [loading]="isSubmitting()"
      [disabled]="!dirty() || isSubmitting()"
    />
  </div>
</form>
