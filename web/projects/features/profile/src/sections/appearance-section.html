<div class="appearance-section">
  <app-section
    title="Tema"
    description="El tema se guarda en este navegador y se aplica al abrir la aplicación."
  >
    <div class="appearance-section__choices" role="radiogroup" aria-label="Tema de la aplicación">
      @for (option of themeOptions; track option.value) {
        <label
          class="appearance-section__choice"
          [class.appearance-section__choice--selected]="theme.mode() === option.value"
        >
          <input
            type="radio"
            class="appearance-section__choice-input"
            name="profile-theme"
            [value]="option.value"
            [checked]="theme.mode() === option.value"
            (change)="theme.setMode(option.value)"
          />
          <span
            class="appearance-section__choice-preview"
            [attr.data-preview]="option.value"
            aria-hidden="true"
          >
            <span class="appearance-section__choice-half appearance-section__choice-half--light">
              <span
                class="appearance-section__choice-bar appearance-section__choice-bar--accent"
              ></span>
              <span class="appearance-section__choice-bar"></span>
              <span
                class="appearance-section__choice-bar appearance-section__choice-bar--short"
              ></span>
            </span>
            <span class="appearance-section__choice-half appearance-section__choice-half--dark">
              <span
                class="appearance-section__choice-bar appearance-section__choice-bar--accent"
              ></span>
              <span class="appearance-section__choice-bar"></span>
              <span
                class="appearance-section__choice-bar appearance-section__choice-bar--short"
              ></span>
            </span>
          </span>
          <span class="appearance-section__choice-text">
            <span class="appearance-section__choice-label">{{ option.label }}</span>
            <span class="appearance-section__choice-hint">{{ option.hint }}</span>
          </span>
          <i class="pi pi-check-circle appearance-section__choice-check" aria-hidden="true"></i>
        </label>
      }
    </div>
  </app-section>

  <app-section title="Densidad" description="Controla el espacio de las filas en tablas y listas.">
    <div class="appearance-section__choices" role="radiogroup" aria-label="Densidad de las tablas">
      @for (option of densityOptions; track option.value) {
        <label
          class="appearance-section__choice appearance-section__choice--plain"
          [class.appearance-section__choice--selected]="preferences.density() === option.value"
        >
          <input
            type="radio"
            class="appearance-section__choice-input"
            name="profile-density"
            [value]="option.value"
            [checked]="preferences.density() === option.value"
            (change)="preferences.setDensity(option.value)"
          />
          <span class="appearance-section__choice-text">
            <span class="appearance-section__choice-label">{{ option.label }}</span>
            <span class="appearance-section__choice-hint">{{ option.hint }}</span>
          </span>
          <i class="pi pi-check-circle appearance-section__choice-check" aria-hidden="true"></i>
        </label>
      }
    </div>
  </app-section>
</div>
