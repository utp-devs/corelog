<div class="appearance-section">
  <app-section
    title="Tema"
    description="El tema se guarda en este navegador y se aplica al abrir la aplicación."
  >
    <div class="appearance-section__choices" role="radiogroup" aria-label="Tema de la aplicación">
      @for (option of themeOptions; track option.value) {
        <label class="choice" [class.choice--selected]="theme.mode() === option.value">
          <input
            type="radio"
            class="choice__input"
            name="profile-theme"
            [value]="option.value"
            [checked]="theme.mode() === option.value"
            (change)="theme.setMode(option.value)"
          />
          <span class="choice__preview" [attr.data-preview]="option.value" aria-hidden="true">
            <span class="choice__half choice__half--light">
              <span class="choice__bar choice__bar--accent"></span>
              <span class="choice__bar"></span>
              <span class="choice__bar choice__bar--short"></span>
            </span>
            <span class="choice__half choice__half--dark">
              <span class="choice__bar choice__bar--accent"></span>
              <span class="choice__bar"></span>
              <span class="choice__bar choice__bar--short"></span>
            </span>
          </span>
          <span class="choice__text">
            <span class="choice__label">{{ option.label }}</span>
            <span class="choice__hint">{{ option.hint }}</span>
          </span>
          <i class="pi pi-check-circle choice__check" aria-hidden="true"></i>
        </label>
      }
    </div>
  </app-section>

  <app-section title="Densidad" description="Controla el espacio de las filas en tablas y listas.">
    <div class="appearance-section__choices" role="radiogroup" aria-label="Densidad de las tablas">
      @for (option of densityOptions; track option.value) {
        <label
          class="choice choice--plain"
          [class.choice--selected]="preferences.density() === option.value"
        >
          <input
            type="radio"
            class="choice__input"
            name="profile-density"
            [value]="option.value"
            [checked]="preferences.density() === option.value"
            (change)="preferences.setDensity(option.value)"
          />
          <span class="choice__text">
            <span class="choice__label">{{ option.label }}</span>
            <span class="choice__hint">{{ option.hint }}</span>
          </span>
          <i class="pi pi-check-circle choice__check" aria-hidden="true"></i>
        </label>
      }
    </div>
  </app-section>
</div>
