<form
  class="password-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  aria-label="Cambiar contraseña"
>
  <app-field-row
    #currentRow
    label="Contraseña actual"
    [required]="true"
    [control]="form.controls.currentPassword"
    [messages]="{ invalid: 'La contraseña actual es obligatoria' }"
    [submitted]="submitted()"
  >
    <app-password-input
      [inputId]="currentRow.controlId"
      autocomplete="current-password"
      [invalid]="currentRow.invalid()"
      [describedBy]="currentRow.describedBy()"
      formControlName="currentPassword"
    />
  </app-field-row>

  <app-field-row
    #newRow
    label="Nueva contraseña"
    [required]="true"
    helper="Usa al menos 8 caracteres."
    [control]="form.controls.newPassword"
    [messages]="{ invalid: 'La nueva contraseña debe tener al menos 8 caracteres' }"
    [submitted]="submitted()"
  >
    <app-password-input
      [inputId]="newRow.controlId"
      autocomplete="new-password"
      [invalid]="newRow.invalid()"
      [describedBy]="newRow.describedBy()"
      formControlName="newPassword"
    />
    <app-password-strength [password]="form.controls.newPassword.value" />
  </app-field-row>

  <app-field-row
    #confirmRow
    label="Confirmar nueva contraseña"
    [required]="true"
    [control]="form.controls.newPasswordConfirmation"
    [messages]="confirmationMessages"
    [submitted]="submitted()"
  >
    <app-password-input
      [inputId]="confirmRow.controlId"
      autocomplete="new-password"
      [invalid]="confirmRow.invalid()"
      [describedBy]="confirmRow.describedBy()"
      formControlName="newPasswordConfirmation"
    />
  </app-field-row>

  <div class="password-form__actions">
    <p-button type="submit" label="Cambiar contraseña" [loading]="isSubmitting()" />
  </div>
</form>
