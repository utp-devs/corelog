<form
  class="form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  aria-label="Cambiar contraseña"
>
  <app-field-row #currentRow label="Contraseña actual" [error]="errorOf('currentPassword')">
    <app-password-input
      [inputId]="currentRow.controlId"
      autocomplete="current-password"
      [invalid]="!!errorOf('currentPassword')"
      [describedBy]="currentRow.describedBy()"
      formControlName="currentPassword"
    />
  </app-field-row>

  <app-field-row #newRow label="Nueva contraseña" [error]="errorOf('newPassword')">
    <app-password-input
      [inputId]="newRow.controlId"
      autocomplete="new-password"
      [invalid]="!!errorOf('newPassword')"
      [describedBy]="newRow.describedBy()"
      formControlName="newPassword"
    />
  </app-field-row>

  <div class="actions">
    <p-button
      type="submit"
      label="Cambiar contraseña"
      class="touch-target"
      [loading]="isSubmitting()"
    />
  </div>
</form>
