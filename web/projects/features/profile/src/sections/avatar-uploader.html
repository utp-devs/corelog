<div class="avatar-uploader">
  <div class="avatar-uploader__figure">
    @if (preview(); as current) {
      <app-avatar
        [id]="user().id"
        [name]="user().name"
        [src]="current.url"
        [size]="64"
        data-testid="avatar-preview"
      />
      <span class="avatar-uploader__caption">Vista previa</span>
    } @else {
      <app-user-avatar
        [id]="user().id"
        [name]="user().name"
        [avatarKey]="user().avatarKey"
        [size]="64"
        data-testid="avatar-current"
      />
    }
  </div>

  <div class="avatar-uploader__controls">
    <ng-content />

    <input
      #fileInput
      type="file"
      class="avatar-uploader__file"
      tabindex="-1"
      accept="image/png,image/jpeg,image/webp"
      aria-label="Elegir foto de perfil"
      (change)="onPick($event)"
    />

    <div class="avatar-uploader__buttons">
      @if (preview()) {
        <p-button label="Guardar foto" [loading]="busy() === 'upload'" (onClick)="upload()" />
        <p-button
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          [disabled]="busy() !== null"
          (onClick)="cancelPreview()"
        />
      } @else {
        <p-button
          label="Subir foto"
          icon="pi pi-upload"
          severity="secondary"
          [outlined]="true"
          [disabled]="busy() !== null"
          (onClick)="chooseFile()"
        />
        @if (user().avatarKey) {
          <p-button
            label="Quitar foto"
            severity="danger"
            [text]="true"
            [loading]="busy() === 'remove'"
            (onClick)="remove()"
          />
        }
      }
    </div>

    <p class="avatar-uploader__hint">PNG, JPEG o WebP de hasta {{ sizeLimitMb }} MB.</p>

    @if (error(); as message) {
      <div class="avatar-uploader__alert" role="alert">{{ message }}</div>
    }
  </div>
</div>
