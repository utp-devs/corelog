@if (user(); as user) {
  <app-page-container variant="reading" pageName="profile" [ready]="true" [fill]="true">
    <div class="profile-page">
      <app-page-header banner="profile" [title]="meta().title" [subtitle]="meta().description" />

      <div
        class="profile-page__content"
        [class.profile-page__content--wide]="
          section() === 'general' ||
          section() === 'privacy' ||
          section() === 'tokens' ||
          section() === 'notifications'
        "
      >
        @switch (section()) {
          @case ('general') {
            <app-profile-general-section
              [user]="user"
              (userChange)="onUserChange($event)"
              [(dirty)]="generalDirty"
            />
          }
          @case ('security') {
            <app-profile-security-section />
          }
          @case ('notifications') {
            <app-profile-notifications-section />
          }
          @case ('appearance') {
            <app-profile-appearance-section />
          }
          @case ('tokens') {
            <app-api-tokens-section />
          }
          @case ('privacy') {
            <app-profile-privacy-section />
          }
        }
      </div>
    </div>
  </app-page-container>
}
