<app-page-container variant="wide" pageName="people" [ready]="ready()" [fill]="true">
  <app-page-header banner="teams" title="Personas" [subtitle]="subtitle()" />

  <app-toolbar>
    <div appToolbarLeft class="people-page__search">
      <app-search-input
        [(value)]="query"
        [placeholder]="'Buscar por nombre o correo'"
        [ariaLabel]="'Buscar personas'"
      />
    </div>
  </app-toolbar>

  <app-data-table
    tableKey="people-directory"
    [fill]="true"
    [columns]="columns()"
    [data]="pageRows()"
    rowKey="userId"
    [loading]="loading()"
    [error]="errorMessage()"
    [pagination]="pagination()"
    [pageSizes]="pageSizes"
    (retry)="reload()"
    (pageChange)="changePage($event)"
    [emptyState]="emptyTpl"
    [rowOpenable]="true"
    (rowOpen)="openPerson($event)"
    [mobileRender]="mobileTpl"
  >
    <ng-template appDataTableCell="name" let-member>
      <ng-container *ngTemplateOutlet="personTpl; context: { $implicit: member }" />
    </ng-template>

    <ng-template appDataTableCell="jobTitle" let-member>
      <span class="people-page__text" [attr.title]="member.jobTitle || null">{{
        member.jobTitle || '-'
      }}</span>
    </ng-template>

    <ng-template appDataTableCell="role" let-member>
      <app-lozenge [tone]="toneOf(member.role)">{{ labelOf(member.role) }}</app-lozenge>
    </ng-template>
  </app-data-table>

  <ng-template #personTpl let-member>
    <span class="people-page__person">
      <app-user-avatar
        [id]="member.userId"
        [name]="member.name"
        [hasAvatar]="member.hasAvatar"
        [size]="32"
      />
      <span class="people-page__identity">
        <span class="people-page__name" [attr.title]="member.name">{{ member.name }}</span>
        <span class="people-page__email" [attr.title]="member.email">{{ member.email }}</span>
      </span>
    </span>
  </ng-template>

  <ng-template #emptyTpl>
    <app-empty-state [title]="emptyTitle()" [description]="emptyDescription()" />
  </ng-template>

  <ng-template #mobileTpl let-member>
    <div class="people-page__card">
      <ng-container *ngTemplateOutlet="personTpl; context: { $implicit: member }" />
      <div class="people-page__card-meta">
        <app-lozenge [tone]="toneOf(member.role)">{{ labelOf(member.role) }}</app-lozenge>
        @if (member.jobTitle) {
          <span class="people-page__text">{{ member.jobTitle }}</span>
        }
      </div>
    </div>
  </ng-template>
</app-page-container>
