<a class="auth-layout__skip" href="#auth-main">Saltar al formulario</a>

<main class="auth-layout__main" [attr.id]="mainId" tabindex="-1">
  <div class="auth-layout__page" data-page="auth">
    <div class="auth-layout__brand">
      <div class="auth-layout__brand-inner">
        <img
          class="auth-layout__logo"
          src="/brand/corelog-banner-480.png"
          srcset="/brand/corelog-banner-480.png 480w, /brand/corelog-banner-960.png 960w"
          sizes="180px"
          alt="CoreLog"
          width="180"
          height="48"
        />
        <div class="auth-layout__pitch">
          <p class="auth-layout__headline">Todo el trabajo de tu equipo, claro y a tiempo.</p>
          <ul class="auth-layout__points">
            @for (point of points; track point.text) {
              <li class="auth-layout__point">
                <i [class]="'pi auth-layout__point-icon ' + point.icon" aria-hidden="true"></i>
                <span>{{ point.text }}</span>
              </li>
            }
          </ul>
        </div>
      </div>
      <span class="auth-layout__shape auth-layout__shape--one" aria-hidden="true"></span>
      <span class="auth-layout__shape auth-layout__shape--two" aria-hidden="true"></span>
    </div>

    <section class="auth-layout__panel" [attr.aria-labelledby]="titleId">
      <div class="auth-layout__card">
        <h1 class="auth-layout__title" [attr.id]="titleId">{{ title() }}</h1>
        @if (subtitle(); as text) {
          <p class="auth-layout__subtitle">{{ text }}</p>
        }
        <ng-content />
        @if (switchPath(); as path) {
          <p class="auth-layout__switch">
            {{ switchText() }}
            <a class="auth-layout__switch-link" [routerLink]="path" [queryParams]="switchQuery()">
              {{ switchLabel() }}
            </a>
          </p>
        }
      </div>
    </section>
  </div>
</main>
