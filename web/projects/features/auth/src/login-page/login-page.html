<app-auth-layout
  title="Iniciar sesión"
  subtitle="Accede con tu cuenta para continuar con tu trabajo."
  switchText="¿No tienes cuenta?"
  switchLabel="Crear una"
  switchPath="/register"
  [switchQuery]="registerQuery"
>
  <form
    class="login-page__form"
    novalidate
    [formGroup]="form"
    [attr.aria-busy]="submitting()"
    (ngSubmit)="onSubmit()"
  >
    @if (formError(); as message) {
      <app-auth-alert tone="error">{{ message }}</app-auth-alert>
    }

    <app-field-row
      #emailRow
      label="Correo electrónico"
      [required]="true"
      [control]="form.controls.email"
      [messages]="emailMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.email)"
    >
      <input
        pInputText
        appFieldControl
        pSize="large"
        formControlName="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        [fluid]="true"
      />
    </app-field-row>

    <app-field-row
      #passwordRow
      label="Contraseña"
      [required]="true"
      [control]="form.controls.password"
      [messages]="passwordMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.password)"
    >
      <app-password-input
        size="lg"
        formControlName="password"
        autocomplete="current-password"
        [inputId]="passwordRow.controlId"
        [required]="true"
        [invalid]="passwordRow.invalid()"
        [describedBy]="passwordRow.describedBy()"
      />
    </app-field-row>

    <p-button
      type="submit"
      label="Iniciar sesión"
      size="large"
      [fluid]="true"
      [loading]="submitting()"
    />
  </form>
</app-auth-layout>
