<app-auth-layout
  title="Iniciar sesión"
  subtitle="Accede con tu cuenta corporativa para continuar con tu trabajo."
>
  <form
    class="form"
    novalidate
    [formGroup]="form"
    [attr.aria-busy]="submitting()"
    (ngSubmit)="onSubmit()"
  >
    @if (formError(); as message) {
      <div class="alert error" role="alert">{{ message }}</div>
    }
    <fieldset class="fieldset" [disabled]="submitting()">
      <app-auth-field
        label="Correo electrónico"
        inputId="login-email"
        [message]="emailError()"
        tone="error"
      >
        <input
          id="login-email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          aria-required="true"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'login-email-message' : null"
        />
      </app-auth-field>

      <app-auth-field
        label="Contraseña"
        inputId="login-password"
        [message]="passwordError()"
        tone="error"
      >
        <app-password-input
          inputId="login-password"
          formControlName="password"
          autocomplete="current-password"
          [required]="true"
          [invalid]="!!passwordError()"
          [describedBy]="passwordError() ? 'login-password-message' : null"
        />
      </app-auth-field>

      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Iniciar sesión
      </button>
    </fieldset>
  </form>

  <span authFooter>
    ¿No tienes cuenta?
    <a routerLink="/register" [queryParams]="registerQuery">Crear una</a>
  </span>
</app-auth-layout>
