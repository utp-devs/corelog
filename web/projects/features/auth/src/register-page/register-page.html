<app-auth-layout
  variant="register"
  title="Crear cuenta"
  subtitle="Regístrate para empezar a trabajar en CoreLog."
  switchText="¿Ya tienes cuenta?"
  switchLabel="Iniciar sesión"
  switchPath="/login"
  [switchQuery]="loginQuery"
>
  <form
    class="register-page__form"
    novalidate
    [formGroup]="form"
    [attr.aria-busy]="submitting()"
    (ngSubmit)="onSubmit()"
  >
    @if (formError(); as message) {
      <app-auth-alert tone="error">{{ message }}</app-auth-alert>
    }

    <div class="register-page__names">
      <app-auth-field
        label="Nombres"
        icon="pi-user"
        [required]="true"
        [control]="form.controls.firstName"
        [messages]="firstNameMessages"
        [submitted]="submitted()"
        [error]="serverError(form.controls.firstName)"
      >
        <input
          appAuthControl
          class="register-page__input"
          formControlName="firstName"
          type="text"
          autocomplete="given-name"
        />
      </app-auth-field>

      <app-auth-field
        label="Apellidos"
        [required]="true"
        [control]="form.controls.lastName"
        [messages]="lastNameMessages"
        [submitted]="submitted()"
        [error]="serverError(form.controls.lastName)"
      >
        <input
          appAuthControl
          class="register-page__input"
          formControlName="lastName"
          type="text"
          autocomplete="family-name"
        />
      </app-auth-field>
    </div>

    <app-auth-field
      #phoneRow
      label="Teléfono"
      [inset]="true"
      [required]="true"
      [control]="form.controls.phone"
      [messages]="phoneMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.phone)"
    >
      <app-phone-input
        class="register-page__phone"
        size="lg"
        formControlName="phone"
        [inputId]="phoneRow.controlId"
        [required]="true"
        [invalid]="phoneRow.invalid()"
        [describedBy]="phoneRow.describedBy()"
      />
    </app-auth-field>

    <app-auth-field
      label="Correo electrónico"
      icon="pi-envelope"
      [required]="true"
      [control]="form.controls.email"
      [messages]="emailMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.email)"
    >
      <input
        appAuthControl
        class="register-page__input"
        formControlName="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
      />
    </app-auth-field>

    <app-auth-field
      #passwordRow
      label="Contraseña"
      [required]="true"
      [helper]="passwordHelper"
      [control]="form.controls.password"
      [messages]="passwordMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.password)"
    >
      <app-password-input
        size="lg"
        formControlName="password"
        autocomplete="new-password"
        [inputId]="passwordRow.controlId"
        [required]="true"
        [invalid]="passwordRow.invalid()"
        [describedBy]="passwordRow.describedBy()"
      />
      <app-password-strength [password]="password()" />
    </app-auth-field>

    <app-auth-field
      #confirmationRow
      label="Confirmar contraseña"
      [required]="true"
      [control]="form.controls.passwordConfirmation"
      [messages]="confirmationMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.passwordConfirmation)"
    >
      <app-password-input
        size="lg"
        formControlName="passwordConfirmation"
        autocomplete="new-password"
        [inputId]="confirmationRow.controlId"
        [required]="true"
        [invalid]="confirmationRow.invalid()"
        [describedBy]="confirmationRow.describedBy()"
      />
    </app-auth-field>

    <app-legal-consent-group
      formControlName="consents"
      [showErrors]="submitted()"
      [serverMissing]="missingConsents()"
    />

    <p-button
      class="register-page__submit"
      type="submit"
      label="Crear cuenta"
      [fluid]="true"
      [loading]="submitting()"
      [disabled]="form.invalid"
    />
  </form>
</app-auth-layout>
