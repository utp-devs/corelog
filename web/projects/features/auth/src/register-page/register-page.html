<app-auth-layout
  title="Crear cuenta"
  subtitle="Regístrate para empezar a trabajar en CoreLog."
  switchText="¿Ya tienes cuenta?"
  switchLabel="Iniciar sesión"
  switchPath="/login"
  [switchQuery]="loginQuery"
>
  <form
    class="register-page__form"
    novalidate
    [formGroup]="form"
    [attr.aria-busy]="submitting()"
    (ngSubmit)="onSubmit()"
  >
    @if (formError(); as message) {
      <app-auth-alert tone="error">{{ message }}</app-auth-alert>
    }

    <app-field-row
      label="Nombre"
      [required]="true"
      [control]="form.controls.name"
      [messages]="nameMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.name)"
    >
      <input
        pInputText
        appFieldControl
        pSize="large"
        formControlName="name"
        type="text"
        autocomplete="name"
        [fluid]="true"
      />
    </app-field-row>

    <app-field-row
      label="Correo electrónico"
      [required]="true"
      [control]="form.controls.email"
      [messages]="emailMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.email)"
    >
      <input
        pInputText
        appFieldControl
        pSize="large"
        formControlName="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        [fluid]="true"
      />
    </app-field-row>

    <app-field-row
      #passwordRow
      label="Contraseña"
      [required]="true"
      [helper]="passwordHelper"
      [control]="form.controls.password"
      [messages]="passwordMessages"
      [submitted]="submitted()"
      [error]="serverError(form.controls.password)"
    >
      <app-password-input
        size="lg"
        formControlName="password"
        autocomplete="new-password"
        [inputId]="passwordRow.controlId"
        [required]="true"
        [invalid]="passwordRow.invalid()"
        [describedBy]="passwordRow.describedBy()"
      />
      <app-password-strength [password]="password()" />
    </app-field-row>

    <p class="register-page__terms">
      Al crear tu cuenta aceptas las condiciones de uso y la política de privacidad de CoreLog.
    </p>

    <p-button
      type="submit"
      label="Crear cuenta"
      size="large"
      [fluid]="true"
      [loading]="submitting()"
    />
  </form>
</app-auth-layout>
