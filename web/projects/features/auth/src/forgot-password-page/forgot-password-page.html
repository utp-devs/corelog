<app-auth-layout
  variant="security"
  title="Recupera tu contraseña"
  subtitle="Te enviaremos un enlace para elegir una contraseña nueva."
  switchText="¿Ya la recordaste?"
  switchLabel="Iniciar sesión"
  switchPath="/login"
>
  @if (sent()) {
    <div class="forgot-password-page__done" data-testid="forgot-sent">
      <app-auth-alert tone="info">
        Si el correo está registrado, recibirás un mensaje con las instrucciones. Revisa también la
        carpeta de correo no deseado.
      </app-auth-alert>
      <p-button
        class="forgot-password-page__submit"
        type="button"
        data-testid="forgot-resend"
        [label]="remaining() > 0 ? 'Reenviar en ' + remaining() + ' s' : 'Reenviar el correo'"
        [fluid]="true"
        [outlined]="true"
        severity="secondary"
        [disabled]="!canResend()"
        [loading]="submitting()"
        (onClick)="onSubmit()"
      />
      <button type="button" class="forgot-password-page__link" (click)="useAnotherEmail()">
        Usar otro correo
      </button>
      <a class="forgot-password-page__link" routerLink="/login">Volver al inicio de sesión</a>
    </div>
  } @else {
    <form
      class="forgot-password-page__form"
      novalidate
      [formGroup]="form"
      [attr.aria-busy]="submitting()"
      (ngSubmit)="onSubmit()"
    >
      @if (formError(); as message) {
        <app-auth-alert tone="error">{{ message }}</app-auth-alert>
      }

      <app-auth-field
        label="Correo electrónico"
        icon="pi-envelope"
        [required]="true"
        [control]="form.controls.email"
        [messages]="emailMessages"
        [submitted]="submitted()"
      >
        <input
          appAuthControl
          class="forgot-password-page__input"
          formControlName="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
        />
      </app-auth-field>

      <p-button
        class="forgot-password-page__submit"
        type="submit"
        data-testid="forgot-submit"
        [label]="remaining() > 0 ? 'Espera ' + remaining() + ' s' : 'Enviar el enlace'"
        [fluid]="true"
        [loading]="submitting()"
        [disabled]="remaining() > 0"
      />
    </form>
  }
</app-auth-layout>
