<app-page-container variant="fluid" pageName="calendar" [ready]="true" [fill]="grid()">
  <div class="project-calendar" [class.project-calendar--grid]="grid()">
    <app-page-header
      title="Calendario"
      subtitle="Eventos del equipo y fechas de incidencias, sprints y versiones de este proyecto."
    />
    @if (projectId(); as id) {
      <app-calendar-view [projectId]="id" />
    }
  </div>
</app-page-container>
