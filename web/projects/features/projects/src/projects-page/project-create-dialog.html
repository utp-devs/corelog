<app-dialog
  size="md"
  heading="Nuevo proyecto"
  subtitle="Organiza el trabajo de un equipo en un tablero propio."
  [open]="open()"
  (closeRequested)="cancel()"
>
  <form class="project-create-dialog__form" [formGroup]="form" novalidate>
    <app-field-row
      #nameRow
      label="Nombre"
      [required]="true"
      [error]="nameError() ?? serverError(form.controls.name)"
    >
      <input
        pInputText
        appFieldControl
        data-autofocus
        formControlName="name"
        placeholder="Nombre del proyecto"
        autocomplete="off"
      />
    </app-field-row>

    <app-field-row
      #keyRow
      label="Clave"
      [required]="true"
      helper="Prefijo de las incidencias, por ejemplo CORE-12. Se sugiere a partir del nombre."
      [error]="keyError() ?? serverError(form.controls.key)"
    >
      <input
        pInputText
        appFieldControl
        #keyField
        formControlName="key"
        placeholder="CORE"
        autocomplete="off"
        [attr.maxlength]="keyMaxLength"
        (input)="onKeyInput(keyField.value)"
      />
    </app-field-row>

    <app-field-row
      #descriptionRow
      label="Descripción"
      [error]="serverError(form.controls.description)"
    >
      <textarea pTextarea appFieldControl formControlName="description" rows="3"></textarea>
    </app-field-row>

    <fieldset class="project-create-dialog__choices">
      <legend class="project-create-dialog__legend">Tipo de proyecto</legend>
      <div class="project-create-dialog__cards">
        @for (option of typeOptions; track option.value) {
          <label class="project-create-dialog__card" [attr.for]="radioId('type', option.value)">
            <input
              type="radio"
              class="project-create-dialog__radio"
              formControlName="type"
              [id]="radioId('type', option.value)"
              [value]="option.value"
            />
            <span class="project-create-dialog__card-title">{{ option.label }}</span>
            <span class="project-create-dialog__card-text">{{ option.description }}</span>
          </label>
        }
      </div>
      @if (serverError(form.controls.type); as message) {
        <p class="project-create-dialog__error" role="alert">{{ message }}</p>
      }
    </fieldset>

    <fieldset class="project-create-dialog__choices">
      <legend class="project-create-dialog__legend">Visibilidad</legend>
      <div class="project-create-dialog__cards">
        @for (option of visibilityOptions; track option.value) {
          <label
            class="project-create-dialog__card"
            [attr.for]="radioId('visibility', option.value)"
          >
            <input
              type="radio"
              class="project-create-dialog__radio"
              formControlName="visibility"
              [id]="radioId('visibility', option.value)"
              [value]="option.value"
            />
            <span class="project-create-dialog__card-title">{{ option.label }}</span>
            <span class="project-create-dialog__card-text">{{ option.description }}</span>
          </label>
        }
      </div>
      @if (serverError(form.controls.visibility); as message) {
        <p class="project-create-dialog__error" role="alert">{{ message }}</p>
      }
    </fieldset>

    <app-field-row #leadRow label="Responsable" helper="Si lo dejas vacío, serás tú.">
      <app-user-picker
        ariaLabel="Responsable del proyecto"
        placeholder="Yo (quien crea el proyecto)"
        [users]="leadCandidates()"
        [value]="form.controls.leadId.value"
        (valueChange)="form.controls.leadId.setValue($event)"
      />
    </app-field-row>
  </form>

  <p-button dialogFooter label="Cancelar" severity="secondary" (onClick)="cancel()" />
  <p-button dialogFooter label="Crear" [loading]="submitting()" (onClick)="submit()" />
</app-dialog>
