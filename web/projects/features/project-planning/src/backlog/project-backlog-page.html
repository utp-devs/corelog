@if (accessVariant(); as variant) {
  <app-page-container variant="wide" pageName="backlog" [fill]="true">
    <app-error-page [variant]="variant" />
  </app-page-container>
} @else {
  <app-page-container variant="wide" pageName="backlog" [ready]="ready()" [fill]="true">
    <app-page-header
      title="Backlog"
      subtitle="Las incidencias de arriba se trabajan primero. Usa las flechas para reordenarlas."
    />

    @if (store.moveError(); as message) {
      <div class="alert" role="alert">
        <p-message severity="warn" [closable]="true" (onClose)="store.clearMoveError()">{{
          message
        }}</p-message>
      </div>
    }

    <app-section [flush]="true" [fill]="true">
      <app-data-table
        tableKey="project-backlog"
        [columns]="columns"
        [data]="items()"
        [fill]="true"
        rowKey="id"
        [loading]="loading()"
        [error]="tableError()"
        [emptyState]="emptyTpl"
        [mobileRender]="mobileTpl"
        (retry)="retry()"
      >
        <ng-template appDataTableCell="position" let-row>
          <span class="position">{{ positionOf(row) }}</span>
        </ng-template>
        <ng-template appDataTableCell="summary" let-row>
          <div class="main">
            <a class="summary" [routerLink]="['/issues', row.id]" [title]="row.summary">{{
              row.summary
            }}</a>
            <span class="secondary">{{ row.type }}</span>
          </div>
        </ng-template>
        <ng-template appDataTableCell="priority" let-row>
          <app-priority-tag [priority]="row.priority" />
        </ng-template>
        <ng-template appDataTableCell="status" let-row>
          <app-lozenge [category]="statusCategory(row.status)">{{
            statusLabel(row.status)
          }}</app-lozenge>
        </ng-template>
        <ng-template appDataTableCell="points" let-row>
          {{ row.storyPoints ?? '-' }}
        </ng-template>
        <ng-template appDataTableCell="order" let-row>
          <ng-container *ngTemplateOutlet="moveTpl; context: { $implicit: row }" />
        </ng-template>
      </app-data-table>

      <ng-template #emptyTpl>
        <app-empty-state
          title="El backlog está vacío"
          description="Crea incidencias o impórtalas para empezar a planificar."
        />
      </ng-template>

      <ng-template #mobileTpl let-row>
        <div class="mobile-card">
          <a class="summary" [routerLink]="['/issues', row.id]" [title]="row.summary">{{
            row.summary
          }}</a>
          <div class="mobile-meta">
            <app-priority-tag [priority]="row.priority" />
            <app-lozenge [category]="statusCategory(row.status)">{{
              statusLabel(row.status)
            }}</app-lozenge>
          </div>
          <ng-container *ngTemplateOutlet="moveTpl; context: { $implicit: row }" />
        </div>
      </ng-template>

      <ng-template #moveTpl let-row>
        <div class="move-buttons">
          <p-button
            size="small"
            icon="pi pi-arrow-up"
            [ariaLabel]="'Subir ' + row.summary"
            [disabled]="!canMoveUp(row)"
            (onClick)="moveUp(row)"
          />
          <p-button
            size="small"
            icon="pi pi-arrow-down"
            [ariaLabel]="'Bajar ' + row.summary"
            [disabled]="!canMoveDown(row)"
            (onClick)="moveDown(row)"
          />
        </div>
      </ng-template>
    </app-section>
  </app-page-container>
}
