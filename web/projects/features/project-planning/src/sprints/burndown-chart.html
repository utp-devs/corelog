<app-chart-card
  title="Burndown"
  description="Trabajo restante (línea continua) frente a la línea ideal (discontinua)."
  chartType="line"
  [labels]="labels()"
  [series]="series()"
  [table]="table()"
  [marker]="marker()"
  [isEmpty]="points().length === 0"
  emptyText="Aún no hay datos de burndown"
  emptyDescription="El burndown necesita fechas de inicio y fin del sprint."
/>
