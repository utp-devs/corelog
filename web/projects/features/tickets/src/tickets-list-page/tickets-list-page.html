<app-page-container variant="wide" pageName="issues" [ready]="!loading()" [fill]="true">
  <app-page-header
    title="Incidencias"
    subtitle="Consulta y administra los incidentes registrados."
  />

  <app-toolbar>
    <div appToolbarLeft class="filters">
      <app-filter-bar
        searchPlaceholder="Buscar incidencia por título o descripción"
        [searchValue]="search()"
        (searchValueChange)="onSearch($event)"
        [filters]="filterDefinitions()"
        (clear)="clearFilters()"
      />
    </div>

    <div appToolbarRight>
      <p-button label="Nueva incidencia" icon="pi pi-plus" (onClick)="openNew()" />
    </div>

    <div appToolbarSecondary>
      <p-button
        label="{{ advancedVisible() ? 'Ocultar filtros avanzados' : 'Filtros avanzados' }}"
        severity="secondary"
        [outlined]="true"
        [attr.aria-expanded]="advancedVisible()"
        (onClick)="toggleAdvanced()"
      />
    </div>
  </app-toolbar>

  @if (advancedVisible()) {
    <div class="saved-row">
      <p-select
        class="filter-select"
        [options]="savedFilterOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Cargar filtro guardado"
        ariaLabel="Cargar filtro guardado"
        [showClear]="true"
        [ngModel]="selectedSavedFilter() ?? null"
        (ngModelChange)="applySavedFilter($event)"
      />
      <p-button
        label="Guardar filtro actual"
        severity="secondary"
        [outlined]="true"
        (onClick)="openSaveDialog()"
      />
      <p-button
        label="Eliminar filtro"
        severity="danger"
        [outlined]="true"
        [disabled]="!selectedSavedFilter()"
        (onClick)="deleteSelectedFilter()"
      />
      <p-datepicker
        placeholder="Fecha desde"
        ariaLabel="Fecha desde"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [ngModel]="dueFromDate()"
        (ngModelChange)="onDueFrom($event)"
      />
      <p-datepicker
        placeholder="Fecha hasta"
        ariaLabel="Fecha hasta"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [ngModel]="dueToDate()"
        (ngModelChange)="onDueTo($event)"
      />
    </div>
  }

  @if (savedFilterError(); as message) {
    <div role="alert" class="alert">
      <p-message severity="error" [closable]="true" (onClose)="dismissSavedFilterError()">{{
        message
      }}</p-message>
    </div>
  }

  <app-section flush [fill]="true" ariaLabel="Lista de incidencias">
    <app-ticket-list
      [fill]="true"
      [tickets]="tickets()"
      [loading]="loading()"
      [error]="error()"
      [pagination]="pagination()"
      [emptyState]="emptyTpl"
      [rowActions]="rowActions"
      (open)="openIssue($event)"
      (retry)="retry()"
      (pageChange)="changePage($event)"
    />
  </app-section>

  <p-dialog
    header="Guardar filtro"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [visible]="saveDialogOpen()"
    (visibleChange)="saveDialogOpen.set($event)"
    [style]="{ width: 'min(420px, 92vw)' }"
  >
    <input
      pInputText
      class="name-input"
      autofocus
      maxlength="80"
      aria-label="Nombre del filtro"
      placeholder="Nombre del filtro"
      [ngModel]="savedFilterName()"
      (ngModelChange)="onSavedFilterName($event)"
      (keydown.enter)="saveCurrentFilter()"
    />
    <ng-template #footer>
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="closeSaveDialog()"
      />
      <p-button label="Guardar" [disabled]="!canSaveName()" (onClick)="saveCurrentFilter()" />
    </ng-template>
  </p-dialog>
</app-page-container>

<ng-template #emptyTpl>
  @if (hasActiveFilters()) {
    <app-empty-state
      title="Ninguna incidencia coincide con los filtros"
      description="Cambia o limpia los filtros para ver más resultados."
    >
      <p-button action label="Limpiar filtros" severity="secondary" (onClick)="clearFilters()" />
    </app-empty-state>
  } @else {
    <app-empty-state title="Aún no hay incidencias" description="Crea la primera para empezar.">
      <p-button action label="Nueva incidencia" icon="pi pi-plus" (onClick)="openNew()" />
    </app-empty-state>
  }
</ng-template>
