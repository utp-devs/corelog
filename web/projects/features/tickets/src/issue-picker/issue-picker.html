<p-autocomplete
  class="picker"
  [suggestions]="options()"
  optionLabel="label"
  [ngModel]="selectedOption()"
  (ngModelChange)="onPick($event)"
  (completeMethod)="search($event.query)"
  [dropdown]="true"
  [showClear]="true"
  [forceSelection]="true"
  placeholder="Buscar incidencia por título"
  ariaLabel="Incidencia a vincular"
  [emptyMessage]="loading() ? 'Buscando…' : 'Sin resultados'"
/>
