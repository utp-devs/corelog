<app-section title="Descripción">
  <div appSectionActions>
    @if (!editing()) {
      <p-button
        label="Editar"
        icon="pi pi-pencil"
        severity="secondary"
        [outlined]="true"
        class="touch-target"
        (onClick)="startEdit()"
      />
    }
  </div>

  @if (editing()) {
    <form
      class="ticket-description-section__form"
      aria-label="Editar descripción y datos"
      novalidate
      [formGroup]="form"
      (ngSubmit)="save()"
    >
      <app-rich-text-editor
        ariaLabel="Descripción"
        formControlName="description"
        [minRows]="6"
        [searchUsers]="searchUsers()"
      />

      <div class="ticket-description-section__fields">
        <app-field-row #typeRow label="Tipo">
          <app-select-field
            formControlName="issueType"
            [inputId]="typeRow.controlId"
            [ariaLabelledBy]="typeRow.labelId"
            [options]="issueTypeOptions"
          />
        </app-field-row>
        <app-field-row #dueRow label="Fecha límite" [optional]="true">
          <app-date-field
            formControlName="dueDate"
            [inputId]="dueRow.controlId"
            [ariaLabelledBy]="dueRow.labelId"
          />
        </app-field-row>
        <app-field-row #storyRow label="Puntos de historia" [optional]="true">
          <p-inputnumber
            formControlName="storyPoints"
            class="ticket-description-section__control"
            [inputId]="storyRow.controlId"
            [ariaLabelledBy]="storyRow.labelId"
            [min]="0"
            [max]="999"
          />
        </app-field-row>
        <app-field-row
          label="Incidencia padre"
          [optional]="true"
          helper="Identificador de la incidencia padre, si la hay."
        >
          <input
            pInputText
            appFieldControl
            type="text"
            formControlName="parentId"
            class="ticket-description-section__control"
          />
        </app-field-row>
      </div>

      <div class="ticket-description-section__actions">
        <p-button
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          class="touch-target"
          [disabled]="saving()"
          (onClick)="cancelEdit()"
        />
        <p-button label="Guardar" type="submit" class="touch-target" [loading]="saving()" />
      </div>
    </form>
  } @else if (ticket().description.trim()) {
    <app-rich-text-view [value]="ticket().description" />
  } @else {
    <p class="ticket-description-section__empty">
      Sin descripción. Añade una para dar contexto a la incidencia.
    </p>
  }
</app-section>
