<app-dialog
  size="sm"
  [stacked]="true"
  [open]="open()"
  [heading]="title()"
  (closeRequested)="onCancel()"
>
  @if (description()) {
    <p class="confirm-modal__text">{{ description() }}</p>
  }
  <p-button dialogFooter [label]="cancelText()" severity="secondary" (onClick)="onCancel()" />
  <p-button
    dialogFooter
    [label]="confirmText()"
    [severity]="danger() ? 'danger' : 'primary'"
    [loading]="loading()"
    (onClick)="onConfirm()"
  />
</app-dialog>
