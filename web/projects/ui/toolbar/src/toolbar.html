<ng-template #secondaryActions>
  <ng-content select="[appToolbarSecondary]" />
</ng-template>

<div
  class="toolbar"
  role="toolbar"
  [class.toolbar--sticky]="sticky()"
  [attr.aria-label]="label()"
  [attr.data-sticky]="sticky() ? 'true' : 'false'"
>
  @if (hasLeft()) {
    <div class="toolbar__left">
      <ng-content select="[appToolbarLeft]" />
    </div>
  }
  @if (hasRight() || hasSecondary()) {
    <div class="toolbar__right">
      <ng-content select="[appToolbarRight]" />
      @if (hasSecondary() && !moveToMenu()) {
        <div class="toolbar__secondary">
          <ng-container *ngTemplateOutlet="secondaryActions" />
        </div>
      }
      @if (moveToMenu()) {
        <div class="toolbar__more">
          <button
            #trigger
            cdkOverlayOrigin
            #origin="cdkOverlayOrigin"
            type="button"
            class="toolbar__more-button"
            aria-haspopup="true"
            [attr.aria-controls]="menuOpen() ? menuId : null"
            [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu()"
          >
            <i class="pi pi-ellipsis-h toolbar__more-icon" aria-hidden="true"></i>
            <span>Más</span>
          </button>
          <ng-template
            cdkConnectedOverlay
            [cdkConnectedOverlayOrigin]="origin"
            [cdkConnectedOverlayOpen]="menuOpen()"
            [cdkConnectedOverlayPositions]="positions"
            [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
            [cdkConnectedOverlayPush]="true"
            [cdkConnectedOverlayViewportMargin]="8"
            (overlayOutsideClick)="onOutsideClick($event)"
            (detach)="closeMenu(false)"
          >
            <div class="toolbar__menu" [id]="menuId">
              <ng-container *ngTemplateOutlet="secondaryActions" />
            </div>
          </ng-template>
        </div>
      }
    </div>
  }
</div>
