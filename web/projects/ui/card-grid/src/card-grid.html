<ng-template #grid>
  <div
    class="grid"
    data-card-grid=""
    [attr.role]="ariaLabel() && !fill() ? 'group' : null"
    [attr.aria-label]="ariaLabel() && !fill() ? ariaLabel() : null"
    [style.--cl-card-min]="minCardWidth() + 'px'"
  >
    <ng-content />
  </div>
</ng-template>

@if (fill()) {
  <div
    class="panel"
    data-fill="true"
    [attr.role]="ariaLabel() ? 'group' : null"
    [attr.aria-label]="ariaLabel() ?? null"
  >
    <ng-container *ngTemplateOutlet="grid" />
  </div>
} @else {
  <ng-container *ngTemplateOutlet="grid" />
}
