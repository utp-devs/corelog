<div class="progress-bar" [attr.data-testid]="testId() || null">
  <div class="progress-bar__header">
    <span>{{ label() }}</span>
    <span>{{ percent() }}%</span>
  </div>
  <div
    class="progress-bar__track"
    role="progressbar"
    [attr.aria-label]="label()"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="percent()"
  >
    <div
      class="progress-bar__fill"
      [class]="'progress-bar__fill--' + tone()"
      [style.--cl-progress]="percent() + '%'"
    ></div>
  </div>
</div>
