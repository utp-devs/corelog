<ng-template #content>
  <span aria-hidden="true" class="tile" [attr.data-palette]="palette()">{{ initials() }}</span>
  <span class="text">
    <span class="name" [attr.title]="name()">{{ name() }}</span>
    @if (memberText(); as text) {
      <span class="meta" [attr.title]="text">{{ text }}</span>
    }
  </span>
</ng-template>

@if (href(); as link) {
  @if (isAppPath()) {
    <a class="chip" [routerLink]="link" [attr.data-testid]="dataTestId()">
      <ng-container *ngTemplateOutlet="content" />
    </a>
  } @else {
    <a class="chip" [attr.href]="link" [attr.data-testid]="dataTestId()">
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }
} @else {
  <span class="chip" [attr.data-testid]="dataTestId()">
    <ng-container *ngTemplateOutlet="content" />
  </span>
}
