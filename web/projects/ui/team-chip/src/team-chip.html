<ng-template #content>
  <span aria-hidden="true" class="team-chip__tile" [attr.data-palette]="palette()">{{
    initials()
  }}</span>
  <span class="team-chip__text">
    <span class="team-chip__name" [attr.title]="name()">{{ name() }}</span>
    @if (memberText(); as text) {
      <span class="team-chip__meta" [attr.title]="text">{{ text }}</span>
    }
  </span>
</ng-template>

@if (href(); as link) {
  @if (isAppPath()) {
    <a class="team-chip team-chip--link" [routerLink]="link" [attr.data-testid]="dataTestId()">
      <ng-container *ngTemplateOutlet="content" />
    </a>
  } @else {
    <a class="team-chip team-chip--link" [attr.href]="link" [attr.data-testid]="dataTestId()">
      <ng-container *ngTemplateOutlet="content" />
    </a>
  }
} @else {
  <span class="team-chip" [attr.data-testid]="dataTestId()">
    <ng-container *ngTemplateOutlet="content" />
  </span>
}
