<div class="container" role="status" data-empty-state="true">
  <div class="icon" aria-hidden="true"><ng-content select="[icon]" /></div>
  <p class="title">{{ title() }}</p>
  @if (description()) {
    <p class="description">{{ description() }}</p>
  }
  <div class="action"><ng-content select="[action]" /></div>
</div>
