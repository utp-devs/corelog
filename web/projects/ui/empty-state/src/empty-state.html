<div class="empty-state" role="status" data-empty-state="true">
  <div class="empty-state__icon" aria-hidden="true"><ng-content select="[icon]" /></div>
  <p class="empty-state__title">{{ title() }}</p>
  @if (description()) {
    <p class="empty-state__description">{{ description() }}</p>
  }
  <div class="empty-state__action"><ng-content select="[action]" /></div>
</div>
