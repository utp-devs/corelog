<ng-template #content>
  <app-avatar [id]="user().id" [name]="user().name" [src]="user().avatarUrl" [size]="size()" />
  <span class="user-chip__text">
    <span class="user-chip__name" [attr.title]="user().name">{{ user().name }}</span>
    @if (user().role; as role) {
      <span class="user-chip__role" [attr.title]="role">{{ role }}</span>
    }
  </span>
</ng-template>

@if (href()) {
  <a class="user-chip user-chip--link" [attr.href]="href()" [attr.data-testid]="dataTestId()">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <span class="user-chip" [attr.data-testid]="dataTestId()">
    <ng-container *ngTemplateOutlet="content" />
  </span>
}
