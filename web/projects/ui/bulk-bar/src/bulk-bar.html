@if (count() > 0) {
  <div role="region" aria-label="Acciones masivas" class="bulk-bar">
    <span class="bulk-bar__count" aria-live="polite">{{ countText() }}</span>
    <div class="bulk-bar__actions">
      @for (action of actions(); track action.key) {
        <p-button
          size="small"
          [label]="action.label"
          [icon]="action.icon"
          [severity]="action.danger ? 'danger' : 'secondary'"
          (onClick)="action.onClick()"
        />
      }
      <p-button size="small" [text]="true" label="Limpiar selección" (onClick)="clear.emit()" />
    </div>
  </div>
}
