@if (items().length > 0) {
  <nav class="breadcrumbs" aria-label="Ruta de navegación">
    <ol class="breadcrumbs__list">
      @for (item of items(); track $index; let last = $last) {
        <li class="breadcrumbs__item" [class.breadcrumbs__item--middle]="isMiddle($index)">
          @if (last) {
            <span class="breadcrumbs__current" aria-current="page" [attr.title]="item.label">{{
              item.label
            }}</span>
          } @else if (item.to !== undefined) {
            <a class="breadcrumbs__link" [routerLink]="item.to" [attr.title]="item.label">{{
              item.label
            }}</a>
          } @else {
            <span class="breadcrumbs__plain">{{ item.label }}</span>
          }
        </li>
      }
    </ol>
  </nav>
}
