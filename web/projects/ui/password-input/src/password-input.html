<div class="password-input" [class.password-input--lg]="size() === 'lg'">
  <input
    class="password-input__field"
    spellcheck="false"
    [attr.id]="inputId()"
    [attr.type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="blur()"
  />
  <button
    type="button"
    class="password-input__toggle"
    aria-label="Mostrar contraseña"
    title="Mostrar contraseña"
    [attr.aria-pressed]="visible() ? 'true' : 'false'"
    [attr.aria-controls]="inputId()"
    [disabled]="disabled()"
    (click)="toggleVisibility()"
  >
    <i
      class="pi password-input__icon"
      [class.pi-eye]="!visible()"
      [class.pi-eye-slash]="visible()"
      aria-hidden="true"
    ></i>
  </button>
</div>
