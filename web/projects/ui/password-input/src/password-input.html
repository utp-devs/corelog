<div class="wrapper">
  <input
    class="input"
    spellcheck="false"
    [attr.id]="inputId()"
    [attr.type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="blur()"
  />
  <button
    type="button"
    class="toggle"
    aria-label="Mostrar contraseña"
    [attr.aria-pressed]="visible() ? 'true' : 'false'"
    [attr.aria-controls]="inputId()"
    [disabled]="disabled()"
    (click)="toggleVisibility()"
  >
    @if (visible()) {
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 3l18 18" />
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
        <path
          d="M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 8.5 4.5 9.5 7a11 11 0 0 1-2.4 3.5M6.6 6.6A11 11 0 0 0 2.5 12c1 2.5 4.5 7 9.5 7a9.6 9.6 0 0 0 4.1-.9"
        />
      </svg>
    } @else {
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2.5 12C3.5 9.5 7 5 12 5s8.5 4.5 9.5 7c-1 2.5-4.5 7-9.5 7s-8.5-4.5-9.5-7z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
