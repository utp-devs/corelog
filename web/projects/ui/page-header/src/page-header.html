<header class="page-header">
  <div class="page-header__heading">
    <h1 class="page-header__title">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
  @if (hasActions()) {
    <div class="page-header__actions">
      <ng-content select="[appPageHeaderActions]" />
    </div>
  }
</header>
