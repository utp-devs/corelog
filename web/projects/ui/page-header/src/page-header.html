<header class="page-header">
  <div class="heading">
    <h1 class="page-title">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-subtitle">{{ subtitle() }}</p>
    }
  </div>
  @if (hasActions()) {
    <div class="page-actions">
      <ng-content select="[appPageHeaderActions]" />
    </div>
  }
</header>
