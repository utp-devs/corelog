<p-select
  class="select-field"
  [class.select-field--compact]="size() === 'compact'"
  appendTo="body"
  optionLabel="label"
  optionValue="value"
  optionDisabled="disabled"
  scrollHeight="calc(var(--cl-menu-item-h) * 7.5)"
  filterBy="label"
  filterPlaceholder="Buscar"
  emptyFilterMessage="Sin resultados"
  [size]="size() === 'compact' ? 'small' : undefined"
  [options]="items()"
  [placeholder]="placeholder()"
  [inputId]="inputId()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="ariaLabelledBy()"
  [filter]="hasFilter()"
  [showClear]="showClear()"
  [loading]="loading()"
  [invalid]="invalid()"
  [emptyMessage]="emptyMessage()"
  [disabled]="isDisabled()"
  [attr.title]="reason()"
  [ngModel]="value()"
  (ngModelChange)="onValueChange($event)"
  (onBlur)="onBlur()"
/>
