@if (visible()) {
  <section class="secret-reveal" role="alert" data-testid="secret-reveal">
    <p class="secret-reveal__warning">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span
        ><strong>{{ label() }} creado.</strong> {{ warning() }}</span
      >
    </p>
    <div class="secret-reveal__row">
      <input
        #field
        class="secret-reveal__value"
        type="text"
        readonly
        spellcheck="false"
        autocomplete="off"
        [attr.aria-label]="label()"
        [value]="secret()"
        data-testid="secret-reveal-value"
        (focus)="selectAll($event)"
      />
      <p-button
        class="secret-reveal__copy"
        [label]="copied() ? 'Copiado' : 'Copiar'"
        [icon]="copied() ? 'pi pi-check' : 'pi pi-copy'"
        severity="secondary"
        [outlined]="true"
        data-testid="secret-reveal-copy"
        (onClick)="copy()"
      />
    </div>
    <label class="secret-reveal__confirm">
      <input
        type="checkbox"
        class="secret-reveal__check"
        [checked]="acknowledged()"
        data-testid="secret-reveal-ack"
        (change)="toggle($event)"
      />
      <span>{{ confirmText() }}</span>
    </label>
    <div class="secret-reveal__actions">
      <p-button
        label="Cerrar"
        [disabled]="!acknowledged()"
        data-testid="secret-reveal-close"
        (onClick)="dismiss()"
      />
    </div>
  </section>
}
