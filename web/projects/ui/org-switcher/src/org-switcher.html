@if (org(); as current) {
  <app-dropdown-menu label="Organizaciones">
    <button
      appMenuTrigger
      type="button"
      class="org-switcher__trigger"
      [attr.aria-label]="'Organización actual: ' + current.name"
      appTooltip="Cambiar de organización"
    >
      <app-org-logo
        [orgId]="current.id"
        [name]="current.name"
        [hasLogo]="current.hasLogo"
        [revision]="logoRevision()"
      />
      <span class="org-switcher__name">{{ current.name }}</span>
      <app-shell-icon class="org-switcher__caret" name="caret" />
    </button>

    <p class="org-switcher__heading">Tus organizaciones</p>
    @for (item of orgs(); track item.id) {
      <button
        type="button"
        class="org-switcher__item"
        role="menuitemradio"
        [attr.aria-checked]="item.id === current.id"
        (click)="switchTo(item.id)"
      >
        <app-org-logo
          [orgId]="item.id"
          [name]="item.name"
          [hasLogo]="item.hasLogo"
          [revision]="revisionOf(item.id)"
        />
        <span class="org-switcher__label">{{ item.name }}</span>
        @if (item.id === current.id) {
          <app-shell-icon class="org-switcher__check" name="check" />
        }
      </button>
    }

    <div class="org-switcher__separator" role="separator"></div>

    <button type="button" class="org-switcher__item" role="menuitem" (click)="createOrganization()">
      <app-shell-icon class="org-switcher__icon" name="plus" />
      <span class="org-switcher__label">Crear organización</span>
    </button>
    @if (canManage()) {
      <button type="button" class="org-switcher__item" role="menuitem" (click)="openSettings()">
        <app-shell-icon class="org-switcher__icon" name="settings" />
        <span class="org-switcher__label">Configuración de la organización</span>
      </button>
    }
  </app-dropdown-menu>
}
