<div class="password-strength__meter" [attr.data-level]="level()" aria-hidden="true">
  @for (segment of segments; track segment) {
    <span
      class="password-strength__segment"
      [class.password-strength__segment--on]="segment <= level()"
    ></span>
  }
</div>
<p
  class="password-strength__message"
  [class.password-strength__message--weak]="level() === 1"
  [class.password-strength__message--fair]="level() === 2"
  [class.password-strength__message--good]="level() === 3"
  [class.password-strength__message--strong]="level() === 4"
  aria-live="polite"
>
  {{ message() }}
</p>
