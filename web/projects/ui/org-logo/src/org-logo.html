@if (src(); as url) {
  <img
    class="org-logo__image"
    [class.org-logo__image--sm]="size() === 24"
    [class.org-logo__image--md]="size() === 32"
    [src]="url"
    alt=""
    data-testid="org-logo"
  />
} @else {
  <span
    aria-hidden="true"
    class="org-logo__tile"
    [class.org-logo__tile--sm]="size() === 24"
    [class.org-logo__tile--md]="size() === 32"
    [attr.data-palette]="palette()"
    [attr.data-initials]="initials()"
    data-testid="org-logo-fallback"
  ></span>
}
