<p-overlaybadge [value]="badgeValue()" [badgeDisabled]="count() === 0" severity="danger">
  <button
    type="button"
    class="notifications-bell__button"
    [attr.aria-label]="label()"
    aria-haspopup="dialog"
    appTooltip="Notificaciones"
    (click)="panel.toggle($event)"
  >
    <app-shell-icon name="bell" />
  </button>
</p-overlaybadge>

<p-popover #panel (onShow)="onShow()">
  <div class="notifications-bell__panel">
    <div class="notifications-bell__header">
      <span class="notifications-bell__heading">Notificaciones</span>
      <button
        type="button"
        class="notifications-bell__link"
        [disabled]="count() === 0"
        (click)="markAll()"
      >
        Marcar todas
      </button>
    </div>
    @if (items().length === 0) {
      <p class="notifications-bell__empty">Sin notificaciones</p>
    } @else {
      <ul class="notifications-bell__list">
        @for (item of items(); track item.id) {
          <li [attr.data-testid]="isSecurity(item) ? 'notification-security' : null">
            <button
              type="button"
              class="notifications-bell__item"
              [class.notifications-bell__item--unread]="!item.read"
              (click)="open(item, panel)"
            >
              @if (isSecurity(item)) {
                <i class="pi pi-shield notifications-bell__icon" aria-hidden="true"></i>
              }
              {{ item.message }}
            </button>
            @if (isSecurity(item)) {
              <div class="notifications-bell__actions">
                @for (action of actionsOf(item); track action.label) {
                  <button
                    type="button"
                    class="notifications-bell__action"
                    [class.notifications-bell__action--danger]="isNotMe(action)"
                    [attr.data-testid]="
                      isNotMe(action) ? 'notification-not-me' : 'notification-view'
                    "
                    (click)="runAction(item, action, panel)"
                  >
                    {{ action.label }}
                  </button>
                }
              </div>
            }
          </li>
        }
      </ul>
    }
  </div>
</p-popover>
