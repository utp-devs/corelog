<div class="app-shell">
  <a href="#main-content" class="app-shell__skip" (click)="skipToContent($event)">
    Saltar al contenido
  </a>

  <app-top-bar
    [menus]="topMenus()"
    [canCreate]="canCreate()"
    [orgName]="orgName()"
    [orgSwitcher]="orgSwitcher()"
    [createSlot]="createSlot()"
    [brand]="brand()"
    [showMenuButton]="collapsedNav()"
    [currentPath]="pathname()"
    [docsUrl]="docsUrl()"
    [whatsNewUrl]="whatsNewUrl()"
    [supportUrl]="supportUrl()"
    (openMenu)="openDrawer()"
    (openShortcuts)="helpOpen.set(true)"
  />

  <div class="app-shell__body">
    @if (showSidebar()) {
      <app-context-sidebar
        [title]="sidebarTitle()"
        [items]="items()"
        [currentPath]="activePath()"
        [project]="sidebarProject()"
        [loading]="sidebarLoading()"
      />
    }

    <main id="main-content" #main tabindex="-1" class="app-shell__main">
      <router-outlet />
    </main>
  </div>

  @if (collapsedNav()) {
    <app-nav-drawer
      [(open)]="drawerOpen"
      [menus]="topMenus()"
      [sidebarTitle]="sidebarTitle()"
      [items]="items()"
      [currentPath]="activePath()"
      [showOrgSwitcher]="isMobile()"
      [orgSwitcher]="orgSwitcher()"
    />
  }

  <p class="app-shell__announcer" role="status" aria-live="polite">{{ announcement() }}</p>

  <app-shortcuts-dialog [(open)]="helpOpen" [hotkeys]="hotkeys.registered()" />

  <ng-template #orgSwitcherTpl><ng-content select="[appShellOrgSwitcher]" /></ng-template>
  <ng-template #createTpl><ng-content select="[appShellCreate]" /></ng-template>
</div>
