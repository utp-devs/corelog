<aside
  class="context-sidebar"
  [class.context-sidebar--collapsed]="collapsed()"
  [attr.aria-label]="title()"
  [attr.data-collapsed]="collapsed() ? 'true' : 'false'"
>
  <div class="context-sidebar__header">
    @if (!collapsed()) {
      <span class="context-sidebar__title">{{ title() }}</span>
    }
  </div>

  <nav class="context-sidebar__nav" [attr.aria-label]="'Navegación: ' + title()">
    <ul class="context-sidebar__list">
      @for (item of items(); track item.key) {
        <li>
          @if (item.external) {
            <a
              class="context-sidebar__link"
              [class.context-sidebar__link--active]="isActive(item)"
              [href]="item.path"
              [attr.aria-label]="item.label"
              [attr.aria-current]="isActive(item) ? 'page' : null"
              [appTooltip]="collapsed() ? item.label : ''"
              appTooltipPosition="right"
            >
              <app-shell-icon [name]="item.icon" />
              @if (!collapsed()) {
                <span class="context-sidebar__label">{{ item.label }}</span>
              }
            </a>
          } @else {
            <a
              class="context-sidebar__link"
              [class.context-sidebar__link--active]="isActive(item)"
              [routerLink]="item.path"
              [attr.aria-label]="item.label"
              [attr.aria-current]="isActive(item) ? 'page' : null"
              [appTooltip]="collapsed() ? item.label : ''"
              appTooltipPosition="right"
            >
              <app-shell-icon [name]="item.icon" />
              @if (!collapsed()) {
                <span class="context-sidebar__label">{{ item.label }}</span>
              }
            </a>
          }
        </li>
      }
    </ul>
  </nav>

  <div class="context-sidebar__footer">
    <button
      type="button"
      class="context-sidebar__toggle"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      [appTooltip]="collapsed() ? 'Expandir menú lateral' : ''"
      appTooltipPosition="right"
      (click)="toggle()"
    >
      <app-shell-icon [name]="collapsed() ? 'unfold' : 'fold'" />
      @if (!collapsed()) {
        <span>Contraer menú</span>
      }
    </button>
  </div>
</aside>
