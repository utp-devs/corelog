@if (compact()) {
  <button
    type="button"
    class="global-search__icon-button"
    aria-label="Buscar"
    appTooltip="Buscar ({{ shortcutHint }})"
    (click)="openPalette()"
  >
    <app-shell-icon name="search" />
  </button>
} @else {
  <div class="global-search__field">
    <app-shell-icon class="global-search__icon" name="search" />
    <input
      type="search"
      class="global-search__input"
      placeholder="Buscar…"
      aria-label="Buscar proyectos e incidencias"
      autocomplete="off"
      [value]="query()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
    />
    <kbd class="global-search__hint" aria-hidden="true">{{ shortcutHint }}</kbd>

    @if (panelOpen()) {
      <div class="global-search__panel">
        <div class="global-search__results" role="region" aria-label="Resultados de búsqueda">
          @if (message(); as text) {
            <p class="global-search__message" role="status">{{ text }}</p>
          }
          @for (section of sections(); track section.name) {
            <div class="global-search__section" role="group" [attr.aria-label]="section.name">
              <div class="global-search__section-title" aria-hidden="true">{{ section.name }}</div>
              <ul class="global-search__list">
                @for (hit of section.items; track hit.kind + hit.id) {
                  <li>
                    <button type="button" class="global-search__result" (click)="choose(hit)">
                      <span class="global-search__result-title"
                        ><app-mark-text [highlighted]="hit.highlight" [fallback]="hit.title"
                      /></span>
                      <span class="global-search__result-subtitle">{{
                        hit.key ?? hit.subtitle
                      }}</span>
                    </button>
                  </li>
                }
              </ul>
            </div>
          }
        </div>
        <div class="global-search__footer">
          <button
            type="button"
            class="global-search__palette-link"
            data-testid="search-all"
            (click)="openAllResults()"
          >
            <app-shell-icon name="search" />
            <span>Ver todos los resultados</span>
          </button>
          <button type="button" class="global-search__palette-link" (click)="openFullPalette()">
            <app-shell-icon name="search" />
            <span>Abrir paleta de comandos</span>
          </button>
          <span class="global-search__shortcut">{{ shortcutHint }}</span>
        </div>
      </div>
    }
  </div>
}

<app-command-palette
  [(open)]="paletteOpen"
  [seed]="paletteSeed()"
  [search]="searchPalette"
  (openHit)="onPaletteHit($event)"
  (openAll)="openAllResults($event)"
/>
