@if (showImage()) {
  <img
    class="avatar"
    [class]="sizeClass()"
    [src]="src() ?? ''"
    [alt]="name()"
    [attr.data-testid]="dataTestId()"
    (error)="onImageError()"
  />
} @else {
  <span
    class="avatar"
    role="img"
    [class]="sizeClass() + ' ' + toneClass()"
    [attr.aria-label]="name()"
    [attr.data-initials]="initials()"
    [attr.data-testid]="dataTestId()"
  ></span>
}
