@if (open()) {
  <div class="side-panel" (mousedown)="onBackdropMouseDown($event)">
    <div
      #panel
      class="side-panel__panel"
      [class.side-panel__panel--lg]="size() === 'lg'"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      (keydown)="onKeydown($event)"
    >
      <div class="side-panel__header">
        <div class="side-panel__heading">
          <h2 class="side-panel__title" [id]="titleId">{{ heading() }}</h2>
          @if (subtitle(); as text) {
            <p class="side-panel__subtitle">{{ text }}</p>
          }
        </div>
        <button
          type="button"
          class="side-panel__close"
          aria-label="Cerrar"
          (click)="requestClose()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <div class="side-panel__body">
        <ng-content />
      </div>

      <div class="side-panel__footer">
        <ng-content select="[panelFooter]" />
      </div>
    </div>
  </div>
}
