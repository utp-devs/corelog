<p-datepicker
  class="date-field"
  dateFormat="dd/mm/yy"
  appendTo="body"
  [showIcon]="true"
  [showClear]="showClear()"
  [autofocus]="autofocus()"
  [fluid]="true"
  [inputId]="inputId()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="ariaLabelledBy()"
  [placeholder]="placeholder()"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [invalid]="invalid()"
  [disabled]="isDisabled()"
  [ngModel]="date()"
  (ngModelChange)="onDateChange($event)"
  (onBlur)="onBlur()"
  (onClose)="closed.emit()"
/>
