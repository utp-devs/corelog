<span class="issue-type-icon" [attr.title]="type().name">
  <app-catalog-icon class="issue-type-icon__glyph" [icon]="type().icon" [color]="type().color" />
  @if (showLabel()) {
    <span>{{ type().name }}</span>
  } @else {
    <span class="issue-type-icon__hidden-label">{{ type().name }}</span>
  }
</span>
