<div class="error-state" role="alert">
  <span class="error-state__icon" aria-hidden="true"><i [class]="icon()"></i></span>
  <p class="error-state__title">{{ heading() }}</p>
  <p class="error-state__message">{{ helper() }}</p>
  @if (canRetry()) {
    <p-button label="Reintentar" severity="secondary" [outlined]="true" (onClick)="retry.emit()" />
  }
</div>
