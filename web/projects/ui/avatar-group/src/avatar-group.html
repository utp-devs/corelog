<div class="avatar-group">
  @for (item of items(); track item.id) {
    <span class="avatar-group__item" [attr.title]="item.name">
      <app-avatar [id]="item.id" [name]="item.name" [size]="24" />
    </span>
  }
  @if (hidden() > 0) {
    <span class="avatar-group__item avatar-group__more">+{{ hidden() }}</span>
  }
</div>
