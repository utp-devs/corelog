<span
  class="wrapper"
  [attr.data-resolved]="resolved() ? 'true' : null"
  [attr.data-testid]="dataTestId()"
>
  @if (type(); as kind) {
    <app-issue-type-icon [type]="kind" />
  }
  <a
    class="link"
    [class.resolved]="resolved()"
    [attr.href]="href()"
    [pTooltip]="summary()"
    tooltipPosition="top"
    >{{ issueKey() }}</a
  >
  <span class="copy-wrap">
    <button type="button" class="copy-button" aria-label="Copiar clave" (click)="copy()">
      <i class="pi pi-copy" aria-hidden="true"></i>
    </button>
  </span>
</span>
