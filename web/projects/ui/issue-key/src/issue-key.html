<span
  class="issue-key"
  [attr.data-resolved]="resolved() ? 'true' : null"
  [attr.data-testid]="dataTestId()"
>
  @if (type(); as kind) {
    <app-issue-type-icon [type]="kind" />
  }
  @if (href(); as link) {
    @if (isAppPath()) {
      <a
        class="issue-key__text issue-key__text--link"
        [class.issue-key__text--resolved]="resolved()"
        [routerLink]="link"
        [attr.tabindex]="tabIndex()"
        [pTooltip]="summary()"
        tooltipPosition="top"
        >{{ text() }}</a
      >
    } @else {
      <a
        class="issue-key__text issue-key__text--link"
        [class.issue-key__text--resolved]="resolved()"
        [attr.href]="link"
        [attr.tabindex]="tabIndex()"
        [pTooltip]="summary()"
        tooltipPosition="top"
        >{{ text() }}</a
      >
    }
  } @else {
    <span
      class="issue-key__text"
      [class.issue-key__text--resolved]="resolved()"
      [attr.title]="issueKey()"
      >{{ text() }}</span
    >
  }
  <span class="issue-key__copy">
    <button
      type="button"
      class="issue-key__copy-button"
      aria-label="Copiar clave"
      appTooltip="Copiar clave"
      [attr.tabindex]="tabIndex()"
      (click)="copy($event)"
    >
      <i class="pi pi-copy" aria-hidden="true"></i>
    </button>
  </span>
</span>
