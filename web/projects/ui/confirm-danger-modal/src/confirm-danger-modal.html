<app-dialog
  size="sm"
  [stacked]="true"
  [open]="open()"
  [heading]="title()"
  (closeRequested)="onCancel()"
>
  @if (description()) {
    <p class="confirm-danger-modal__text">{{ description() }}</p>
  }
  <div class="confirm-danger-modal__field">
    <label class="confirm-danger-modal__label" [attr.for]="fieldId">
      Escribe <strong>{{ confirmation() }}</strong> para confirmar
    </label>
    <input
      #field
      pInputText
      data-autofocus
      [id]="fieldId"
      type="text"
      autocomplete="off"
      class="confirm-danger-modal__input"
      [value]="typed()"
      (input)="onTyped(field.value)"
    />
  </div>
  <p-button dialogFooter label="Cancelar" severity="secondary" (onClick)="onCancel()" />
  <p-button
    dialogFooter
    [label]="confirmText()"
    severity="danger"
    [disabled]="!matches()"
    [loading]="loading()"
    (onClick)="onConfirm()"
  />
</app-dialog>
