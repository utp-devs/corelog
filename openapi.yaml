  /issues:
    post:
      tags: [tickets]
      summary: Create a ticket
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [tickets]
      summary: List tickets
      operationId: listTickets
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by ticket status. When absent, tickets of every status are returned.
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          required: false
          description: Filter by ticket priority. When absent, tickets of every priority are returned.
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: q
          in: query
          required: false
          description: Text search across title and description.
          schema:
            type: string
        - name: issue_type
          in: query
          required: false
          description: Filter by issue type.
          schema:
            $ref: '#/components/schemas/IssueType'
        - name: label_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: One-based page number. Defaults to 1 when absent or invalid.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Number of tickets per page. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tickets matching the given filters, with the total across all pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backlog:
