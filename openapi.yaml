  /issues/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    get:
      tags: [issues]
      summary: Listar los enlaces de una incidencia
      description: >-
        Devuelve los enlaces de la incidencia en ambos sentidos. Cada elemento indica el tipo de enlace, la direccion
        (outward si la incidencia es el origen, inward si es el destino), la etiqueta en espanol y la incidencia del otro extremo.
        Se omiten los enlaces cuyo otro extremo no es visible para quien consulta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enlaces de la incidencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueLinkEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [issues]
      summary: Crear un enlace entre incidencias
      description: >-
        Requiere edicion sobre la incidencia de origen y visibilidad sobre el destino. El destino puede indicarse
        por UUID o por clave. No se permiten enlaces a la propia incidencia, duplicados (tambien en sentido inverso)
        ni ciclos en los enlaces de bloqueo. El destino debe estar en la misma organizacion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueLinkRequest'
