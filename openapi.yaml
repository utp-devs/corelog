openapi: 3.0.3
info:
  title: CoreLog API
  description: Incident and issue management API for CoreLog.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: dashboards
    description: Paneles con gadgets, comparticion y datos por gadget
  - name: roadmap
    description: Hoja de ruta de epicas, versiones y sprints
  - name: calendar
    description: Eventos con recurrencia, calendario combinado y suscripcion ICS
  - name: releases
    description: Versiones de proyecto, publicacion y notas de version
  - name: auth
    description: Registration and authentication
  - name: users
    description: User identity, profile, and directory search
  - name: teams
    description: Team management and membership
  - name: organizations
    description: Organizations, members, roles and ownership
  - name: invitations
    description: Invitations to join an organization
  - name: favorites
    description: Starred elements and recently viewed elements
  - name: notes
    description: Notas personales privadas del usuario
  - name: issues
    description: Gestion de incidencias (issues) con clave legible por proyecto
  - name: boards
    description: Tableros por proyecto, columnas, carriles, filtros rapidos y movimiento de tarjetas
  - name: workflows
    description: Flujo de trabajo por proyecto, plantillas y catalogo de estados de la organizacion
  - name: worklogs
    description: Registro de tiempo, estimaciones de incidencias, hoja de tiempo personal y resumen de tiempo por proyecto
  - name: reports
    description: Informes de proyecto (burndown, velocidad, flujo, tiempo, carga y versiones) y su exportacion CSV
  - name: legal
    description: Documentos legales versionados y consentimiento de cada usuario
  - name: integrations
    description: Tokens de acceso personales y webhooks salientes
  - name: automation
    description: Reglas de automatizacion y su historial de ejecuciones
  - name: import-export
    description: Importacion de incidencias desde CSV y exportaciones de un proyecto
  - name: audit
    description: Registro de auditoria inmutable y recuperacion de contrasena
  - name: health
    description: Service liveness
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a user account
      description: The account gets the role user. The first account created on an empty installation becomes admin.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email address is already registered (code auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /meta/countries:
    get:
      tags: [users]
      summary: Paises admitidos para telefonos
      description: Publico y cacheable (Cache-Control public, 24 h). Ordenado por nombre.
      operationId: listPhoneCountries
      security: []
      responses:
        '200':
          description: Lista de paises con su prefijo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'
        '429':
          description: Demasiadas peticiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive an access token
      description: >-
        Limitado por IP y por cuenta: responde 429 con auth.rate_limited (demasiadas solicitudes) o auth.account_locked
        (5 fallos seguidos bloquean la cuenta 15 minutos, con espera creciente) y la cabecera Retry-After. Con
        REQUIRE_EMAIL_VERIFICATION activo y el correo sin verificar responde 403 auth.email_not_verified.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Credenciales correctas. Si la cuenta tiene autenticacion en dos pasos activa, la respuesta es un
            reto (two_factor_required=true) y no abre sesion; el cliente debe llamar a /auth/login/2fa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthSession'
                      - $ref: '#/components/schemas/TwoFactorChallenge'
        '401':
          description: The email or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login/2fa:
    post:
      tags: [auth]
      summary: Completar el inicio de sesion con el codigo de la aplicacion o un codigo de recuperacion
      operationId: loginSecondFactor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorLoginRequest'
      responses:
        '200':
          description: Codigo correcto; devuelve la sesion como el login normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          description: El reto ha caducado, ya se uso o agoto sus intentos (auth.challenge_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Codigo incorrecto (auth.two_factor_invalid) o falta el codigo (auth.two_factor_required), o datos
            invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa:
    get:
      tags: [auth]
      summary: Estado de la autenticacion en dos pasos del usuario actual
      operationId: getTwoFactorStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/2fa/enroll:
    post:
      tags: [auth]
      summary: Iniciar la configuracion de la autenticacion en dos pasos (devuelve el secreto una sola vez)
      operationId: enrollTwoFactor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Secreto pendiente de confirmar; la autenticacion aun no esta activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos ya esta activada (auth.two_factor_already_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/confirm:
    post:
      tags: [auth]
      summary: Confirmar la configuracion con un codigo y activar la autenticacion en dos pasos
      operationId: confirmTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Activada; devuelve los codigos de recuperacion una sola vez
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No hay configuracion pendiente (auth.two_factor_not_enrolled) o ya esta activada (auth.two_factor_already_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/disable:
    post:
      tags: [auth]
      summary: Desactivar la autenticacion en dos pasos (contrasena actual y codigo o codigo de recuperacion)
      operationId: disableTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
      responses:
        '204':
          description: Desactivada; se eliminan el secreto y los codigos de recuperacion
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos no esta activada (auth.two_factor_not_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid), falta el codigo (auth.two_factor_required) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/recovery-codes:
    post:
      tags: [auth]
      summary: Regenerar los codigos de recuperacion (invalida los anteriores)
      operationId: regenerateTwoFactorRecoveryCodes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Nuevos codigos de recuperacion, mostrados una sola vez
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos no esta activada (auth.two_factor_not_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [users]
      summary: Cerrar la sesion actual (revoca el token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: La sesion se cerro; el token deja de ser valido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [users]
      summary: Get the current authenticated user
      description: Incluye pending_consents (documentos legales obligatorios sin aceptar) junto a los campos del usuario.
      operationId: getCurrentUser
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      summary: Update the current user's profile
      description: >-
        Partial update: omitted fields keep their value. An invalid timezone answers 422 (code user.timezone_invalid).
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The email address is already registered to another account (code auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/password:
    post:
      tags: [users]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed successfully
        '401':
          description: Not authenticated, or the supplied current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/phone/verification:
    post:
      tags: [users]
      summary: Enviar un codigo SMS de 6 digitos al telefono del usuario
      description: El codigo vence en 10 minutos. Maximo 3 envios por hora (429 user.phone_send_limit). 409 user.phone_not_set si no hay telefono y user.phone_already_verified si ya esta verificado.
      operationId: requestPhoneVerification
      responses:
        '202':
          description: Codigo emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [destination, expires_at]
                    properties:
                      destination:
                        type: string
                        example: "+51******678"
                      expires_at:
                        type: string
                        format: date-time
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sin telefono o ya verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados envios (user.phone_send_limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/phone/verify:
    post:
      tags: [users]
      summary: Verificar el telefono con el codigo recibido por SMS
      description: Cada intento cuenta; tras 5 el codigo muere (429 user.phone_code_attempts). 422 user.phone_code_invalid o user.phone_code_expired. 409 user.phone_taken si otra cuenta ya verifico ese numero.
      operationId: verifyPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "123456"
      responses:
        '200':
          description: Telefono verificado; devuelve el usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sin telefono, ya verificado o numero en uso (user.phone_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Demasiados intentos (user.phone_code_attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/deactivate:
    post:
      tags: [users]
      summary: Desactivar la cuenta propia (borrado logico)
      description: >-
        Requiere la contrasena actual. La cuenta deja de poder iniciar sesion y todas sus sesiones
        quedan revocadas. Los datos se conservan para no romper el historial de incidencias. La cuenta
        se retira de las organizaciones, equipos y proyectos, y deja de aparecer en directorios y selectores.
        Si la cuenta es la unica propietaria de una organizacion (no eliminada), la operacion se rechaza
        con 409 (user.sole_owner) hasta que transfiera la propiedad o elimine la organizacion.
      operationId: deactivateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '204':
          description: La cuenta quedo desactivada
        '401':
          description: No autenticado, o la contrasena no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Eres el unico propietario de una organizacion (user.sole_owner). Transfiere la propiedad o eliminala antes de cerrar la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/sessions:
    get:
      tags: [users]
      summary: Listar las sesiones activas de la cuenta propia
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones activas; la marcada como current es la de la peticion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    user_agent: {type: string}
                    created_at: {type: string, format: date-time}
                    last_seen_at: {type: string, format: date-time}
                    current: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/sessions/revoke-others:
    post:
      tags: [users]
      summary: Cerrar todas las sesiones salvo la actual
      operationId: revokeOtherSessions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Las demas sesiones quedaron revocadas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/sessions/{id}:
    delete:
      tags: [users]
      summary: Cerrar una sesion de la cuenta propia
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: La sesion quedo revocada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La sesion no existe o pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/avatar:
    put:
      tags: [users]
      summary: Upload the caller's avatar
      description: >-
        Replaces the caller's avatar. The multipart field file must be a PNG, JPEG or WebP image of at most 2 MB. The
        image is converted to a 256x256 PNG before it is stored. The previous avatar file is removed.
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP image, at most 2 MB and 4096 px per side.
      responses:
        '200':
          description: Avatar stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      avatar_url:
                        type: string
                        description: Relative URL of the stored avatar (/users/{id}/avatar).
                        example: /users/3f2a1c9e-8b4d-4e7a-9c1f-2d6b5a7e8f90/avatar
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The file exceeds 2 MB (code user.avatar_too_large).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The multipart body is malformed, the file part is missing, or the file is not a valid PNG, JPEG or WebP image
            (code user.avatar_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [users]
      summary: Delete the caller's avatar
      description: Removes the caller's avatar. Idempotent, so it succeeds when the caller has no avatar.
      operationId: deleteAvatar
      responses:
        '204':
          description: Avatar removed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Get a user's avatar
      description: >-
        Returns the PNG avatar of any user. Any authenticated user may read it. The response carries an ETag and a private
        cache lifetime of one hour; send If-None-Match to receive 304 when the avatar has not changed.
      operationId: getUserAvatar
      responses:
        '200':
          description: The avatar image
          headers:
            ETag:
              description: Strong validator derived from the stored avatar version.
              schema: {type: string}
            Cache-Control:
              description: Always private, max-age=3600.
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              description: Always nosniff.
              schema: {type: string, example: nosniff}
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The client already holds the current avatar (If-None-Match matched the ETag).
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              schema: {type: string, example: nosniff}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user does not have an avatar, or the stored image is missing (code user.avatar_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The user id is not a UUID (code validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /users/search:
    get:
      tags: [users]
      summary: Search the members of an organization
      description: >-
        Pass organization_id. The caller must be a member of that organization, otherwise the answer is
        404 (code organization.not_found). Returns at most 20 users whose name or email matches q.
        Platform administrators may omit organization_id, which keeps the legacy search among their own team;
        every other caller who omits it gets 422 (code validation.failed).
      operationId: searchTeammates
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: organization_id
          in: query
          required: false
          description: Organization whose members are searched. Required for every caller except a platform administrator.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members matching the search query (at most 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or the caller is not a member of it (code organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: organization_id is missing for a non-administrator, or is not a UUID (code validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /users:
    get:
      tags: [users]
      summary: List or search all users
      description: Administrator only. Unlike /users/search, this is not restricted to the caller's own team.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: team_id
          in: query
          required: false
          description: Restrict results to members of this team. Omit to search across every team.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users matching the given filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}/team:
    patch:
      tags: [users]
      summary: Assign or clear a user's team
      description: Administrator only.
      operationId: setUserTeam
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams:
    get:
      tags: [teams]
      summary: List the teams of an organization
      description: Returns the teams of the given organization that the authenticated user can see.
      operationId: listTeams
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organization whose teams are listed.
          schema:
            type: string
            format: uuid
        - name: member_id
          in: query
          required: false
          description: Keeps only the teams of the organization that this user belongs to. Same visibility rules as the list without the filter.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Teams of the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or is not visible to the user (code team.organization_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: organization_id is missing or is not a UUID (code team.organization_required), or member_id is not a UUID (code team.member_id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [teams]
      summary: Create a team in an organization
      description: >-
        Whether the caller may create teams in the organization depends on the organization role and policy
        (code team.creation_not_allowed otherwise).
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The organization policy does not allow the caller to create teams (code team.creation_not_allowed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist (code team.organization_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: A team with this name already exists in the organization (code team.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.name_required, team.description_too_long,
            team.avatar_color_invalid, team.organization_required or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get a team by id
      operationId: getTeam
      responses:
        '200':
          description: The requested team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [teams]
      summary: Update a team
      description: Partial update. Omitted fields keep their current value. Replaces the former rename operation.
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: The updated team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to change this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: A team with this name already exists in the organization (code team.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.name_required, team.description_too_long,
            team.avatar_color_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [teams]
      summary: Delete a team
      description: Members of the deleted team are left without a team rather than being deleted themselves.
      operationId: deleteTeam
      responses:
        '204':
          description: The team was deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to delete this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: List the members of a team
      operationId: listTeamMembers
      responses:
        '200':
          description: Members of the team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to see the members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [teams]
      summary: Add a member to a team
      description: >-
        The user must already belong to the organization of the team (code team.user_not_in_org otherwise).
        When role is omitted the member is added with the role member.
      operationId: addTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamMemberRequest'
      responses:
        '201':
          description: Team member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The user is already a member of the team (code team.member_exists).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.user_not_in_org, team.role_invalid, team.user_id_invalid
            or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamUserId'
    patch:
      tags: [teams]
      summary: Change the role of a team member
      operationId: updateTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
      responses:
        '200':
          description: Team member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The user is not a member of the team (code team.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The role is not maintainer or member (code team.role_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [teams]
      summary: Remove a member from a team
      operationId: removeTeamMember
      responses:
        '204':
          description: Team member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The user is not a member of the team (code team.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects:
    get:
      tags: [projects]
      summary: Listar los proyectos de una organizacion
      description: >-
        Devuelve una pagina de los proyectos de la organizacion indicada que el usuario autenticado puede ver.
        Los filtros se combinan con AND. Sin archived, solo se listan los proyectos activos.
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organizacion cuyos proyectos se listan.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Texto que debe aparecer en el nombre o en la clave del proyecto (sin distinguir mayusculas).
          schema:
            type: string
            maxLength: 120
        - name: template
          in: query
          description: Solo proyectos creados con esta plantilla.
          schema:
            $ref: '#/components/schemas/ProjectTemplate'
        - name: type
          in: query
          description: >-
            Alias legado. Con scrum equivale a template=scrum. Con kanban no filtra por si solo, porque agrupa
            varias plantillas; usa template para esos casos.
          schema:
            type: string
            enum: [kanban, scrum]
        - name: lead_id
          in: query
          description: Solo proyectos cuyo lider es este usuario.
          schema:
            type: string
            format: uuid
        - name: starred
          in: query
          description: Si es true, solo los proyectos marcados como favoritos por el usuario.
          schema:
            type: boolean
        - name: archived
          in: query
          description: >-
            exclude (valor por defecto) oculta los archivados; include los muestra junto a los activos; only
            muestra solo los archivados.
          schema:
            $ref: '#/components/schemas/ArchiveFilter'
        - name: sort
          in: query
          description: Columna de orden. Por defecto name.
          schema:
            type: string
            enum: [name, key, created_at, updated_at]
        - name: desc
          in: query
          description: Si es true, orden descendente.
          schema:
            type: boolean
        - name: page
          in: query
          description: Pagina, desde 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Elementos por pagina. Se limita a 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Pagina de proyectos visibles para el usuario, con el total de coincidencias.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ProjectListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            Un parametro no es valido (codigos project.organization_required, project.invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [projects]
      summary: Crear un proyecto desde una plantilla
      description: >-
        El creador queda como lider. Cualquier miembro de la organizacion puede llamar a este endpoint, pero el
        rol de la organizacion y su politica deciden si el proyecto se crea (codigo project.creation_not_allowed
        en caso contrario). template es obligatoria salvo que se envie el campo legado type. visibility es
        opcional; si falta se aplica el valor por defecto de la organizacion.
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La politica de la organizacion no permite al usuario crear proyectos (codigo project.creation_not_allowed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Ya existe un proyecto activo con esta clave en la organizacion (codigo project.key_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            El cuerpo no es valido. Codigos: project.organization_required, project.invalid_key,
            project.invalid_template, project.invalid_assignee_policy, project.user_not_in_org,
            project.team_not_in_org, validation.failed.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/key-available:
    get:
      tags: [projects]
      summary: Comprobar si una clave de proyecto esta libre
      description: >-
        Normaliza la clave (espacios fuera, mayusculas) y responde si es valida y no la usa ningun proyecto
        activo de la organizacion. Los proyectos eliminados no cuentan.
      operationId: checkProjectKeyAvailability
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organizacion donde se comprueba la clave.
          schema:
            type: string
            format: uuid
        - name: key
          in: query
          required: true
          description: Clave a comprobar.
          schema:
            type: string
            minLength: 2
            maxLength: 10
            example: CORE
      responses:
        '200':
          description: Resultado de la comprobacion.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectKeyAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La organizacion o la clave no son validas (codigos project.organization_required, project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: >-
          Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario; se ignora cuando es un UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Obtener un proyecto
      description: >-
        Devuelve 404 (codigo project.not_found) cuando el proyecto no existe o no es visible para el usuario.
        Con una clave, si existe en varias organizaciones del usuario y no se indica organization_id, responde 409
        (codigo project.key_ambiguous).
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle del proyecto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [projects]
      summary: Actualizar un proyecto
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto esta archivado y no admite cambios (codigo project.archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            El cuerpo no es valido. Codigos: project.invalid_assignee_policy, project.user_not_in_org, validation.failed.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [projects]
      summary: Eliminar un proyecto
      description: >-
        Eliminacion logica. Pueden eliminarlo el lead del proyecto y los owner o admin de la organizacion. El cuerpo
        debe repetir el nombre exacto del proyecto en confirmation; si no coincide, responde 422 con codigo
        project.confirmation_mismatch y no se elimina nada.
      operationId: deleteProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
      responses:
        '204':
          description: Proyecto eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            Falta el cuerpo o confirmation no coincide con el nombre del proyecto (codigo project.confirmation_mismatch).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario.
        schema:
          type: string
          format: uuid
    post:
      tags: [projects]
      summary: Archivar un proyecto
      description: Un proyecto archivado es de solo lectura. Requiere permiso para editar el proyecto.
      operationId: archiveProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Proyecto archivado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto ya estaba archivado (codigo project.already_archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario.
        schema:
          type: string
          format: uuid
    post:
      tags: [projects]
      summary: Restaurar un proyecto archivado
      description: Devuelve el proyecto a estado activo. Requiere permiso para editar el proyecto.
      operationId: restoreProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Proyecto restaurado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto no estaba archivado (codigo project.not_archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/board:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Get the default board for a project
      description: Incluye can_manage_board, true si el actor puede editar el tablero y sus columnas (lead o administrador global).
      operationId: getProjectBoard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Board columns and their issue cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/cards/{issue_id}/move:
    post:
      tags: [issues]
      operationId: moveBoardCard
      summary: Mover una incidencia a otra columna del tablero
      description: La columna destino define el estado de la incidencia (ADR-004). Requiere permiso de edicion de incidencias y respeta el flujo del proyecto y el limite WIP de la columna.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column_id]
              properties:
                column_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para editar incidencias del proyecto
        '404':
          description: Columna o incidencia no encontrada en el proyecto
        '409':
          description: La columna destino alcanzo su limite WIP o el cambio de estado no esta permitido por el flujo
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/columns/{column_id}:
    patch:
      tags: [issues]
      operationId: updateBoardColumnWip
      summary: Fijar o quitar el limite WIP de una columna
      description: Solo el lider del proyecto o el administrador global. Enviar wip_limit null quita el limite.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: column_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wip_limit:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Solo lead o administrador global
        '404':
          description: Columna no encontrada en el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/boards:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: listProjectBoards
      summary: Listar los tableros de un proyecto
      description: El tablero principal va primero. Requiere poder ver el proyecto.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tableros del proyecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BoardSummary'}
              example:
                data:
                  - {id: 7f0c3c2e-6d55-4d44-9c3a-0e1b2c3d4e5f, project_id: 1a2b3c4d-0000-4000-8000-000000000001, name: Tablero principal, type: scrum, is_default: true, column_count: 3, swimlane_mode: none}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [boards]
      operationId: createProjectBoard
      summary: Crear un tablero
      description: Requiere manage_board (lead u org-admin). Sin columnas, crea Por hacer, En curso y Hecho con los estados del flujo agrupados por categoria. El nombre es unico por proyecto sin distinguir mayusculas y un proyecto admite hasta 20 tableros. Un proyecto archivado es de solo lectura (project.archived).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBoardRequest'}
            example:
              name: Sprint de bugs
              type: kanban
              swimlane_mode: assignee
              estimation: issue_count
              columns:
                - {name: Pendiente, status_ids: ['9b1a0000-0000-4000-8000-000000000001']}
                - {name: Hecho, color: green, max_issues: 10, status_ids: ['9b1a0000-0000-4000-8000-000000000004']}
      responses:
        '201':
          description: Tablero creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Nombre repetido (board.name_taken), limite de tableros (board.too_many) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Ajustes o columnas no validos (board.invalid_settings, board.invalid_columns, board.invalid)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: getBoard
      summary: Obtener un tablero con su configuracion
      description: Devuelve ajustes, columnas con sus estados, filtros rapidos, carriles, los estados del flujo y los estados sin columna (unmapped_status_ids, que se muestran en la columna implicita Sin asignar).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [boards]
      operationId: updateBoard
      summary: Editar los ajustes de un tablero
      description: Requiere manage_board. Los campos ausentes no cambian; done_retention_days null quita la retencion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBoardRequest'}
            example: {name: Tablero del equipo, swimlane_mode: epic, card_fields: [key, type, assignee, points], done_retention_days: 14}
      responses:
        '200':
          description: Tablero actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Nombre repetido (board.name_taken) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [boards]
      operationId: deleteBoard
      summary: Eliminar un tablero
      description: Requiere manage_board. El tablero principal del proyecto no se puede eliminar (board.default_not_deletable).
      security:
        - bearerAuth: []
      responses:
        '204': {description: Tablero eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Tablero principal (board.default_not_deletable) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/columns:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardColumns
      summary: Reemplazar las columnas de un tablero
      description: Reemplazo completo en una transaccion. Las columnas con id se conservan (y sus tarjetas), las demas se crean y las que faltan se eliminan. Reglas - al menos una columna (hasta 20), un estado del flujo del proyecto aparece como mucho en una columna, min_issues <= max_issues. Los estados sin columna se muestran en la columna implicita Sin asignar. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: array
                  items: {$ref: '#/components/schemas/BoardColumnInput'}
            example:
              columns:
                - {id: 5d0e0000-0000-4000-8000-000000000001, name: Por hacer, status_ids: ['9b1a0000-0000-4000-8000-000000000001']}
                - {name: En curso, color: blue, min_issues: 1, max_issues: 4, status_ids: ['9b1a0000-0000-4000-8000-000000000002', '9b1a0000-0000-4000-8000-000000000003']}
      responses:
        '200':
          description: Tablero con las columnas nuevas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Mapeo no valido (board.invalid_columns); details indica la columna y el campo
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/quick-filters:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardQuickFilters
      summary: Reemplazar los filtros rapidos de un tablero
      description: |
        Hasta 20 filtros. La consulta usa una gramatica minima que reemplazara la busqueda avanzada - clausulas unidas con AND:
        assignee = currentUser(), assignee = "nombre", assignee is EMPTY, labels = x, labels in (a, b), priority in (a, b), type = x, status = x, text ~ "texto", flagged = true. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quick_filters]
              properties:
                quick_filters:
                  type: array
                  items: {$ref: '#/components/schemas/BoardQueryInput'}
            example:
              quick_filters:
                - {name: Mis incidencias, query: 'assignee = currentUser()'}
                - {name: Prioridad alta, query: 'priority in (Alta, Crítica)'}
      responses:
        '200':
          description: Tablero con los filtros nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Consulta no valida (board.invalid_query)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/swimlanes:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardSwimlanes
      summary: Reemplazar los carriles por consulta de un tablero
      description: Solo se usan cuando swimlane_mode es query; cada tarjeta cae en el primer carril cuya consulta cumple y las demas en el carril implicito other. Misma gramatica que los filtros rapidos. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swimlanes]
              properties:
                swimlanes:
                  type: array
                  items: {$ref: '#/components/schemas/BoardQueryInput'}
            example:
              swimlanes:
                - {name: Errores, query: 'type = bug'}
                - {name: Urgente, query: 'labels = urgente'}
      responses:
        '200':
          description: Tablero con los carriles nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Consulta no valida (board.invalid_query)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/view:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: getBoardView
      summary: Vista del tablero con columnas, carriles y tarjetas
      description: Un numero constante de consultas SQL, sin importar cuantas tarjetas haya (hasta 5000). count son las tarjetas mostradas tras los filtros rapidos y total las de la columna sin filtrar; wip_state se evalua sobre total (ok, below_min, at_max, over_max). Las epicas no son tarjetas. Los tableros scrum muestran por defecto el sprint activo y los kanban todas las incidencias. Los estados sin columna aparecen en unmapped_column cuando show_unmapped_lane es true.
      security:
        - bearerAuth: []
      parameters:
        - name: quick_filters
          in: query
          description: Ids de filtros rapidos separados por coma; deben cumplirse todos.
          schema: {type: string}
        - name: sprint
          in: query
          description: active, all, none (sin sprint) o el id de un sprint.
          schema: {type: string}
        - name: swimlane
          in: query
          description: Id de carril; solo devuelve las tarjetas de ese carril.
          schema: {type: string}
      responses:
        '200':
          description: Vista del tablero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Parametros no validos (board.invalid_query, validacion)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/cards/{issue_id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: issue_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [boards]
      operationId: moveBoardViewCard
      summary: Mover una tarjeta a una columna
      description: |
        Requiere move_cards. Si la tarjeta ya esta en la columna solo cambia su posicion (before_issue_id o after_issue_id, uno de los dos). Si no, resuelve con el motor de flujo la transicion que lleva del estado actual a los estados de la columna:
        - ninguna transicion disponible - 409 issue.transition_unavailable;
        - varias - 409 board.ambiguous_transition, details lista las candidatas (field es el id de la transicion y message su nombre); reenviar con transition_id;
        - la transicion pide datos - 422 issue.required_field_missing, details[0] es {field: transition_id, message: <id>} y siguen los campos pedidos (fields.x, comment, resolution, assignee); reenviar con transition_id e input.
        El limite WIP es solo un aviso: la respuesta lleva wip.exceeded. Con carriles por responsable (o por epica) soltar la tarjeta en un carril cambia su responsable (o su epica) a traves del servicio de incidencias.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveBoardCardRequest'}
            example:
              column_id: 5d0e0000-0000-4000-8000-000000000002
              after_issue_id: 3c9d0000-0000-4000-8000-0000000000aa
              swimlane: unassigned
      responses:
        '200':
          description: Tarjeta movida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MoveBoardCardResult'}
              example:
                data:
                  issue_id: 3c9d0000-0000-4000-8000-0000000000bb
                  column_id: 5d0e0000-0000-4000-8000-000000000002
                  status: {id: 9b1a0000-0000-4000-8000-000000000002, name: En curso, category: in_progress}
                  transition_id: start
                  transitioned: true
                  rank: n
                  wip: {column_id: 5d0e0000-0000-4000-8000-000000000002, count: 5, min_issues: null, max_issues: 4, state: over_max, exceeded: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Tablero, columna o tarjeta no encontrados (board.not_found, board.column_not_found, board.card_not_found)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Sin transicion (issue.transition_unavailable), ambigua (board.ambiguous_transition), cambio de estado concurrente (issue.status_conflict), posicion no calculable (board.rank_conflict) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Falta informacion de la transicion (issue.required_field_missing) o peticion no valida (board.invalid_move, workflow.validation_failed)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
    get:
      tags: [projects]
      summary: List project members
      description: >-
        Direct members followed by the users reached through team grants (via_team true, with team_id and team_name).
        effective_role is the best role of the user across the direct membership and every team grant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [projects]
      summary: Add or update a project member
      description: >-
        The user must belong to the organization of the project (code project.user_not_in_org otherwise), and
        must exist (code project.user_not_found).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: Project member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user does not exist (code project.user_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The user does not belong to the organization of the project (code project.user_not_in_org).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/members/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [projects]
      summary: Change a project member role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberRequest'
      responses:
        '200':
          description: Project member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Remove a project member
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /issues:
    post:
      tags: [issues]
      summary: Create an issue
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Issue created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [issues]
      summary: List issues
      operationId: listIssues
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by issue status. When absent, issues of every status are returned.
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: priority
          in: query
          required: false
          description: Filter by issue priority. When absent, issues of every priority are returned.
          schema:
            $ref: '#/components/schemas/IssuePriority'
        - name: q
          in: query
          required: false
          description: Text search across summary and description.
          schema:
            type: string
        - name: issue_type
          in: query
          required: false
          description: Filter by issue type.
          schema:
            $ref: '#/components/schemas/IssueType'
        - name: label_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: assignee_id
          in: query
          required: false
          description: UUID de la persona asignada. El valor `none` devuelve las incidencias sin responsable. Cualquier otro valor responde 422.
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [none]
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: One-based page number. Defaults to 1 when absent or invalid.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Number of issues per page. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of issues matching the given filters, with the total across all pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backlog:
    get:
      tags: [issues]
      operationId: listBacklog
      summary: Backlog de un proyecto ordenado por rank
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incidencias en orden de backlog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para ver el proyecto
  /backlog/{issue_id}:
    put:
      tags: [issues]
      operationId: moveInBacklog
      summary: Colocar una incidencia en una posicion del backlog
      description: Requiere permiso de mover tarjetas (lead o contributor). Renumera el rank de las incidencias del proyecto con el orden resultante y devuelve el backlog.
      security:
        - bearerAuth: []
      parameters:
        - name: issue_id
          in: path
          required: true
          description: UUID o clave legible de la incidencia (CORE-12); ver el parametro IssueRef.
          schema:
            type: string
        - name: organization_id
          in: query
          required: false
          description: Opcional. Desambigua una clave que existe en varias organizaciones.
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Backlog actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para mover incidencias del proyecto
        '404':
          description: Incidencia no encontrada en el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
  /workflow-templates:
    get:
      tags: [workflows]
      summary: Listar plantillas de flujo de trabajo
      description: >-
        Devuelve las cuatro plantillas (scrum, kanban, task_tracking, bug_tracking) con nombre y descripcion en espanol
        y su definicion en el formato de edicion: los estados se nombran por ref y las transiciones usan esos refs.
        Cualquier usuario autenticado puede leerlas.
      operationId: listWorkflowTemplates
      responses:
        '200':
          description: Plantillas disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects/{id}/workflow:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del proyecto (UUID o clave). Los no visibles reciben 404.
        schema: {type: string}
    get:
      tags: [workflows]
      summary: Leer el flujo de trabajo del proyecto
      description: >-
        Devuelve los estados (con su numero de incidencias), el estado inicial, las transiciones y la version del flujo.
        Visible para cualquiera que pueda ver el proyecto. Un proyecto sin flujo recibe el de su plantilla.
      operationId: getProjectWorkflow
      responses:
        '200':
          description: Flujo de trabajo del proyecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorkflowView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [workflows]
      summary: Reemplazar el flujo de trabajo del proyecto
      description: >-
        Valida y guarda el flujo en una sola transaccion. Exige expected_version (la version que se edita). Los estados
        nuevos se crean en la organizacion cuando no existe otro con el mismo nombre. Si un estado que se elimina tiene
        incidencias, status_mapping debe indicar a que estado pasan; si falta, responde 422 workflow.status_mapping_required
        con la lista. Solo gestores del flujo (lead u org_admin); los proyectos archivados son de solo lectura.
        Errores: 409 workflow.version_conflict si la version no coincide, 422 workflow.invalid con un detalle por ruta.
      operationId: replaceProjectWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowDefinitionRequest'}
            example:
              expected_version: 3
              initial_ref: todo
              statuses:
                - {ref: todo, id: 7d2f7b8e-3f1a-4c1e-9a55-2d0e6b1f0a01}
                - {ref: blocked, name: Bloqueado, category: in_progress}
                - {ref: done, id: 9b1c4e2a-5d6f-4a7b-8c9d-0e1f2a3b4c5d}
              transitions:
                - {id: block, name: Bloquear, from: [todo], to: blocked, conditions: [], validators: [], post_functions: [], required_fields: []}
                - {id: complete, name: Completar, from: [todo, blocked], to: done, conditions: [], validators: [], post_functions: [{type: set_resolution, params: {resolution: done}}], required_fields: []}
              status_mapping: {}
      responses:
        '200':
          description: Flujo guardado con las advertencias del cambio
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorkflowSaveResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/workflow/validate:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del proyecto (UUID o clave). Los no visibles reciben 404.
        schema: {type: string}
    post:
      tags: [workflows]
      summary: Validar un flujo sin guardarlo
      description: >-
        Prueba dry run: no escribe nada. Responde 200 con valid, errores por ruta (errors), advertencias (warnings) y los
        estados que necesitan status_mapping (mapping_required) con sus incidencias.
      operationId: validateProjectWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowDefinitionRequest'}
      responses:
        '200':
          description: Resultado de la validacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorkflowValidation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/workflow/reset:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del proyecto (UUID o clave). Los no visibles reciben 404.
        schema: {type: string}
    post:
      tags: [workflows]
      summary: Aplicar la plantilla de un flujo de trabajo
      description: >-
        Sustituye el flujo del proyecto por la plantilla indicada, con las mismas reglas que el reemplazo (version,
        status_mapping y advertencias).
      operationId: resetProjectWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowResetRequest'}
            example: {template: kanban, expected_version: 3, status_mapping: {}}
      responses:
        '200':
          description: Flujo aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorkflowSaveResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/workflow/migrate-issues:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del proyecto (UUID o clave). Los no visibles reciben 404.
        schema: {type: string}
    post:
      tags: [workflows]
      summary: Mover incidencias entre estados
      description: >-
        Mueve las incidencias del proyecto de un estado a otro, por ejemplo antes de eliminar un estado. El destino debe
        estar en el flujo del proyecto. Cada incidencia movida recibe su fila de historial y su actividad.
      operationId: migrateProjectIssues
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowMigrationRequest'}
            example:
              status_mapping: {9b1c4e2a-5d6f-4a7b-8c9d-0e1f2a3b4c5d: 7d2f7b8e-3f1a-4c1e-9a55-2d0e6b1f0a01}
      responses:
        '200':
          description: Incidencias movidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorkflowMigrationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/statuses:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [workflows]
      summary: Listar el catalogo de estados de la organizacion
      description: Devuelve los estados en orden de posicion. Cualquier miembro puede leerlos.
      operationId: listOrganizationStatuses
      responses:
        '200':
          description: Catalogo de estados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [workflows]
      summary: Crear un estado
      description: Anade un estado al final del catalogo. Solo propietarios y administradores. El nombre es unico sin distinguir mayusculas.
      operationId: createOrganizationStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationStatusCreateRequest'}
      responses:
        '201':
          description: Estado creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/OrganizationStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/statuses/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [workflows]
      summary: Reordenar el catalogo de estados
      description: status_ids debe contener cada estado de la organizacion exactamente una vez. Solo administradores.
      operationId: reorderOrganizationStatuses
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationStatusReorderRequest'}
      responses:
        '200':
          description: Catalogo reordenado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/statuses/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: id
        in: path
        required: true
        description: Identificador del estado.
        schema: {type: string, format: uuid}
    patch:
      tags: [workflows]
      summary: Renombrar o cambiar la categoria de un estado
      description: >-
        Los cambios se aplican a los flujos que usan el estado. Un cambio de categoria que deje un flujo invalido se
        rechaza con 409 workflow.category_in_use. Solo administradores.
      operationId: updateOrganizationStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationStatusPatchRequest'}
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/OrganizationStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [workflows]
      summary: Eliminar un estado
      description: >-
        Sin reassign_to el estado debe estar sin uso (incidencias, historial ni flujos); si no, 409 workflow.status_in_use.
        Con reassign_to las incidencias, el historial y los flujos pasan a ese estado. Solo administradores.
      operationId: deleteOrganizationStatus
      parameters:
        - name: reassign_to
          in: query
          required: false
          description: Estado de la misma organizacion que recibe las incidencias.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Estado eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/OrganizationStatusDeleteResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints:
    get:
      tags: [issues]
      operationId: listSprints
      summary: Sprints de un proyecto
      description: Requiere poder ver el proyecto. Devuelve planificados, activo y cerrados.
      security:
        - bearerAuth: []
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sprints del proyecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [issues]
      operationId: createSprint
      summary: Planificar un sprint
      description: Requiere el permiso de gestionar sprints (lead o administrador). Puede haber varios sprints planificados a la vez. Las fechas son opcionales; si se dan, el fin no puede ser anterior al inicio.
      security:
        - bearerAuth: []
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 80}
                goal: {type: string, maxLength: 500}
                start_date: {type: string, format: date}
                end_date: {type: string, format: date}
            example: {name: Sprint 13, goal: Cerrar la API de reembolsos, start_date: '2026-11-30', end_date: '2026-12-11'}
      responses:
        '201':
          description: Sprint creado en estado planned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints/velocity:
    get:
      tags: [issues]
      operationId: getSprintVelocity
      summary: Velocidad del proyecto en sus ultimos sprints cerrados
      description: Usa los puntos completados fijados al cerrar cada sprint.
      security:
        - bearerAuth: []
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 5}}
      responses:
        '200':
          description: Puntos completados por sprint, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SprintVelocityPoint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints/{id}:
    get:
      tags: [issues]
      operationId: getSprint
      summary: Detalle de un sprint
      description: project_id es opcional; si falta se deduce del sprint. Un sprint de otro proyecto responde 404.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sprint
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [issues]
      operationId: updateSprint
      summary: Editar un sprint
      description: Cambia nombre, objetivo y fechas de un sprint planificado o activo (un sprint activo conserva siempre sus fechas). Un sprint cerrado responde 409 sprint.closed. Una fecha null la borra.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 80}
                goal: {type: string, maxLength: 500}
                start_date: {type: string, format: date, nullable: true}
                end_date: {type: string, format: date, nullable: true}
            example: {goal: Cerrar reembolsos y pagos, end_date: '2026-12-12'}
      responses:
        '200':
          description: Sprint actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [issues]
      operationId: deleteSprint
      summary: Borrar un sprint planificado
      description: Solo se borran sprints planificados (409 sprint.not_planned en otro caso). Sus incidencias vuelven al backlog.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Sprint borrado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sprints/{id}/start:
    post:
      tags: [issues]
      operationId: startSprint
      summary: Iniciar un sprint planificado
      description: |
        Confirma nombre, fechas y objetivo (el cuerpo es opcional; sin fechas empieza hoy y dura 14 dias), congela el alcance comprometido
        (evento added por incidencia y committed_points) y activa el sprint. Un proyecto solo puede tener un sprint activo: si ya hay otro
        responde 409 sprint.already_active, tambien ante dos inicios simultaneos. Un sprint sin incidencias responde 422 sprint.empty salvo con force=true.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 80}
                goal: {type: string, maxLength: 500}
                start_date: {type: string, format: date}
                end_date: {type: string, format: date}
                force: {type: boolean, description: Permite iniciar un sprint sin incidencias}
            example: {name: Sprint 13, goal: Cerrar la API de reembolsos, start_date: '2026-11-30', end_date: '2026-12-11'}
      responses:
        '200':
          description: Sprint activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints/{id}/complete:
    post:
      tags: [issues]
      operationId: completeSprint
      summary: Completar un sprint activo
      description: |
        Cierra el sprint en una sola transaccion. Las incidencias en categoria done quedan completadas en el sprint; el resto se mueve al destino:
        backlog, sprint:<uuid> (sprint planificado del mismo proyecto) o new (crea el siguiente sprint planificado, con new_sprint_name o el nombre
        incrementado). Registra un evento completed o incomplete por incidencia con sus puntos de ese momento y fija completed_points.
        Si algo falla no cambia nada.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                destination: {type: string, description: 'backlog, new o sprint:<uuid>', example: new}
                new_sprint_name: {type: string, maxLength: 80}
            example: {destination: new, new_sprint_name: Sprint 14}
      responses:
        '200':
          description: Sprint cerrado y resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SprintCompletion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints/{id}/close:
    post:
      tags: [issues]
      operationId: closeSprint
      summary: Cerrar un sprint activo (forma antigua de completar)
      description: Equivale a completar con la forma antigua del destino. unfinished=backlog las quita del sprint; unfinished=sprint las mueve a target_sprint_id (planificado, mismo proyecto). Tambien admite destination. Devuelve solo el sprint.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                destination: {type: string}
                new_sprint_name: {type: string}
                unfinished: {type: string, enum: [backlog, sprint]}
                target_sprint_id: {type: string, format: uuid, nullable: true}
            example: {unfinished: backlog}
      responses:
        '200':
          description: Sprint cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Sprint'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sprints/{id}/report:
    get:
      tags: [issues]
      operationId: getSprintReport
      summary: Informe del sprint
      description: |
        Compromiso frente a lo completado, calculado del historial de alcance. completed e incomplete son las incidencias en el alcance al final
        (o ahora, en un sprint activo) con los puntos de ese momento; removed son las que salieron del sprint; added_after_start es un subconjunto de
        las anteriores: las que no estaban en el compromiso inicial. burndown da, por dia, el alcance, lo restante y la linea ideal (null sin fecha de fin).
        velocity son los ultimos sprints cerrados del proyecto. Un sprint planificado devuelve todo en cero.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Informe
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SprintReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sprints/{id}/issues:
    get:
      tags: [issues]
      operationId: listSprintIssues
      summary: Incidencias de un sprint
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Incidencias del sprint}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sprints/{id}/issues/{issue_id}:
    put:
      tags: [issues]
      operationId: assignSprintIssue
      summary: Asignar una incidencia al sprint
      description: Requiere gestionar sprints. Un sprint cerrado no admite cambios. En un sprint activo queda registrada como anadida despues del inicio.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: issue_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Asignada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [issues]
      operationId: removeSprintIssue
      summary: Quitar una incidencia del sprint
      description: Requiere gestionar sprints. La incidencia vuelve al backlog; en un sprint activo queda registrada como retirada.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: issue_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Quitada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sprints/{id}/burndown:
    get:
      tags: [issues]
      operationId: getSprintBurndown
      summary: Burndown del sprint por dia
      description: Trabajo restante real frente a la linea ideal, calculado del historial de alcance. En un sprint activo la serie llega hasta hoy. El sprint necesita fechas (422 sprint.dates_required).
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Un punto por dia}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/backlog:
    get:
      tags: [issues]
      operationId: getProjectBacklog
      summary: Backlog del proyecto con sus secciones
      description: |
        Devuelve las secciones en orden: sprint activo, sprints planificados (por creacion) y backlog sin sprint. Cada seccion lista sus incidencias
        por rank con totales (incidencias, puntos, estimacion original en segundos y desglose por categoria de estado). Las epicas no aparecen como
        filas: van en epics con su progreso. El backlog sin sprint no muestra las incidencias ya terminadas. El parametro version esta reservado y
        aun no filtra. Maximo 3000 filas (truncated=true si se supera).
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: epic, in: query, required: false, description: Solo incidencias hijas de esta epica, schema: {type: string, format: uuid}}
        - {name: version, in: query, required: false, description: Reservado, schema: {type: string}}
        - {name: q, in: query, required: false, description: Texto en el resumen o clave (SPR-12), schema: {type: string}}
      responses:
        '200':
          description: Backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Backlog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /backlog/rank:
    put:
      tags: [issues]
      operationId: rankBacklog
      summary: Mover y ordenar varias incidencias en el backlog
      description: |
        Mueve issue_ids (en ese orden, maximo 200) a target (sprint_id o null para el backlog) justo antes de before_issue_id o despues de
        after_issue_id, que deben estar en la seccion de destino y no ser de las movidas; sin ancla van al final. Todo en una transaccion:
        actualiza sprint y rank y escribe los eventos de alcance de los sprints activos (anadida despues del inicio, retirada, movida).
        Reordenar y mover entre backlog y sprint activo requiere mover tarjetas; tocar un sprint planificado requiere ademas gestionar sprints.
        Un sprint cerrado no admite movimientos (409 sprint.closed).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_ids, target]
              additionalProperties: false
              properties:
                project_id: {type: string, format: uuid, description: Opcional; se deduce de las incidencias}
                issue_ids: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
                target:
                  type: object
                  required: [sprint_id]
                  properties:
                    sprint_id: {type: string, format: uuid, nullable: true}
                before_issue_id: {type: string, format: uuid}
                after_issue_id: {type: string, format: uuid}
            example:
              issue_ids: ['0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a1111', '0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a2222']
              target: {sprint_id: '5d1c7b6e-3f0a-4c58-8d0e-2e4b9a7c3333'}
              before_issue_id: '0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a4444'
      responses:
        '200':
          description: Movidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project_id: {type: string, format: uuid}
                      issue_ids: {type: array, items: {type: string, format: uuid}}
                      sprint_id: {type: string, format: uuid, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /issues/{issue}/worklogs:
    get:
      tags: [worklogs]
      operationId: listIssueWorklogs
      summary: Registros de tiempo de una incidencia
      description: Devuelve los registros vivos (los mas recientes primero) y los totales de la incidencia (estimacion original, restante y tiempo registrado). Requiere ver el proyecto; una incidencia borrada o de un proyecto borrado responde 404.
      security:
        - bearerAuth: []
      parameters:
        - {name: issue, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Registros y totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      worklogs: {type: array, items: {$ref: '#/components/schemas/Worklog'}}
                      totals: {$ref: '#/components/schemas/WorklogTotals'}
              example:
                data:
                  worklogs:
                    - id: 7d1c2f0e-3a4b-4c5d-8e6f-112233445566
                      issue_id: 3b9a1c2d-0e1f-4a2b-9c3d-445566778899
                      issue_key: COR-12
                      author_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                      author_name: Ana Lopez
                      started_at: '2026-11-27T14:00:00Z'
                      time_spent_seconds: 5400
                      time_spent: 1h 30m
                      description: Revision del flujo de login
                      remaining_mode: auto
                      remaining_adjust_seconds: 5400
                      created_at: '2026-11-27T15:00:00Z'
                      updated_at: '2026-11-27T15:00:00Z'
                  totals:
                    original_estimate_seconds: 28800
                    original_estimate: 1d
                    remaining_estimate_seconds: 23400
                    remaining_estimate: 6h 30m
                    time_spent_seconds: 5400
                    time_spent: 1h 30m
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [worklogs]
      operationId: logIssueWork
      summary: Registrar tiempo en una incidencia
      description: Exactamente uno de time_spent (texto como 1w 2d 3h 30m, usando horas por dia y dias por semana de la organizacion) o time_spent_seconds es obligatorio. La duracion debe estar entre 1 segundo y 3 dias de 24 horas. started_at por defecto es ahora y no puede estar mas de un dia en el futuro. remaining indica como cambia la estimacion restante; auto la reduce por el tiempo registrado sin bajar de cero (por defecto), set la reemplaza por value, reduce la reduce en value y leave no la toca. Requiere log_work; con mode distinto de leave requiere tambien edit_issue. Proyecto archivado responde 409 project.archived.
      security:
        - bearerAuth: []
      parameters:
        - {name: issue, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                time_spent: {type: string, maxLength: 60}
                time_spent_seconds: {type: integer, minimum: 1, maximum: 259200}
                started_at: {type: string, format: date-time}
                description: {type: string, maxLength: 5000}
                remaining:
                  type: object
                  additionalProperties: false
                  properties:
                    mode: {type: string, enum: [auto, set, reduce, leave]}
                    value: {type: string, maxLength: 60, description: Duracion para set (puede ser 0m) o reduce}
                    value_seconds: {type: integer, minimum: 0}
            example:
              time_spent: 1h 30m
              started_at: '2026-11-27T14:00:00Z'
              description: Revision del flujo de login
              remaining: {mode: auto}
      responses:
        '201':
          description: Registro creado con los totales actualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      worklog: {$ref: '#/components/schemas/Worklog'}
                      totals: {$ref: '#/components/schemas/WorklogTotals'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /issues/{issue}/estimates:
    put:
      tags: [worklogs]
      operationId: updateIssueEstimates
      summary: Cambiar la estimacion original y restante de una incidencia
      description: Cada campo es opcional. Un texto de duracion (1w 2d 3h 30m, 0m permitido) fija el valor; null lo borra. Las duraciones se leen con las horas por dia de la organizacion. Requiere edit_issue. Cada cambio queda en el historial de la incidencia.
      security:
        - bearerAuth: []
      parameters:
        - {name: issue, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                original: {type: string, nullable: true, maxLength: 60}
                remaining: {type: string, nullable: true, maxLength: 60}
            example: {original: 3d, remaining: 2d 4h}
      responses:
        '200':
          description: Totales de la incidencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WorklogTotals'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /worklogs/{id}:
    patch:
      tags: [worklogs]
      operationId: updateWorklog
      summary: Editar un registro de tiempo
      description: El autor edita su registro con log_work; cualquier otro usuario necesita manage_worklogs (lead del proyecto, o propietario o admin de la organizacion). Si cambia el tiempo de un registro con modo auto, la estimacion restante se recalcula desde el valor anterior. Proyecto archivado responde 409.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                time_spent: {type: string, maxLength: 60}
                time_spent_seconds: {type: integer, minimum: 1, maximum: 259200}
                started_at: {type: string, format: date-time}
                description: {type: string, maxLength: 5000}
            example: {time_spent: 2h, description: Corregido el tiempo}
      responses:
        '200':
          description: Registro actualizado con los totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      worklog: {$ref: '#/components/schemas/Worklog'}
                      totals: {$ref: '#/components/schemas/WorklogTotals'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [worklogs]
      operationId: deleteWorklog
      summary: Borrar un registro de tiempo
      description: Mismas reglas de permiso que la edicion. Devuelve al estimado restante el ajuste que el registro le quito (modos auto y reduce).
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Registro borrado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/timesheet:
    get:
      tags: [worklogs]
      operationId: getMyTimesheet
      summary: Hoja de tiempo por dia
      description: Registros del usuario entre from y to (ambas fechas incluidas, AAAA-MM-DD, maximo 366 dias) agrupados por dia local de la organizacion del proyecto. Con user= (otro usuario) solo aparecen los registros de proyectos donde el llamador gestiona registros (lead o admin de la organizacion). Rango invalido responde 422 worklog.range_invalid.
      security:
        - bearerAuth: []
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: user, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Dias con registros y totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from: {type: string, format: date}
                      to: {type: string, format: date}
                      total_seconds: {type: integer}
                      total: {type: string, example: 1d 2h}
                      days:
                        type: array
                        items: {$ref: '#/components/schemas/TimesheetDay'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/time-summary:
    get:
      tags: [worklogs]
      operationId: getProjectTimeSummary
      summary: Resumen de tiempo de un proyecto
      description: Totales de registros del proyecto entre from y to agrupados por user, issue o day (dia local de la organizacion). Requiere view_reports. Un proyecto ajeno responde 403.
      security:
        - bearerAuth: []
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: group_by, in: query, required: false, schema: {type: string, enum: [user, issue, day], default: user}}
      responses:
        '200':
          description: Grupos con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group_by: {type: string, enum: [user, issue, day]}
                      from: {type: string, format: date}
                      to: {type: string, format: date}
                      total_seconds: {type: integer}
                      total: {type: string}
                      count: {type: integer}
                      groups:
                        type: array
                        items: {$ref: '#/components/schemas/TimeSummaryGroup'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/reports:
    get:
      tags: [reports]
      operationId: listProjectReports
      summary: Informes disponibles de un proyecto
      description: Lista los tipos de informe con su descripcion en espanol y los parametros que acepta cada uno. Requiere view_reports; un proyecto oculto responde 404.
      security:
        - bearerAuth: []
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Catalogo de informes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ReportDescriptor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project}/reports/{kind}:
    get:
      tags: [reports]
      operationId: getProjectReport
      summary: Ejecuta un informe del proyecto
      description: >-
        Devuelve un informe con forma uniforme (series, tabla y resumen). kind es uno de burndown, burnup, velocity,
        cumulative-flow, control, created-vs-resolved, resolution-time, time-tracking, workload, version y sprint-report.
        Con el sufijo .csv (por ejemplo burndown.csv) devuelve la tabla como CSV UTF-8 con BOM, cabeceras en espanol y las
        celdas de texto que empiezan por = + - o @ precedidas de un apostrofo. Las fechas se calculan en la zona horaria de la
        organizacion y los rangos son inclusivos (maximo 366 dias). filter acepta CoreQL y limita las incidencias consideradas.
        Requiere view_reports; un proyecto oculto responde 404. La respuesta se puede cachear 30 segundos en el navegador.
      security:
        - bearerAuth: []
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: kind, in: path, required: true, description: Tipo de informe, con el sufijo .csv opcional, schema: {type: string}}
        - {name: from, in: query, required: false, description: Inicio del rango (por defecto 29 dias antes de to), schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: Fin del rango, inclusivo (por defecto hoy), schema: {type: string, format: date}}
        - {name: group_by, in: query, required: false, description: 'burndown y burnup: points o issues; time-tracking: issue o user; resolution-time: type o priority', schema: {type: string}}
        - {name: filter, in: query, required: false, description: Texto CoreQL (maximo 2000 caracteres), schema: {type: string}}
        - {name: sprint, in: query, required: false, description: Sprint del informe; sin valor se usa el activo o el ultimo iniciado, schema: {type: string, format: uuid}}
        - {name: version, in: query, required: false, description: Version (obligatorio en el informe version), schema: {type: string, format: uuid}}
        - {name: interval, in: query, required: false, description: Periodo de created-vs-resolved, schema: {type: string, enum: [day, week, month], default: day}}
        - {name: limit, in: query, required: false, description: Sprints de velocity (1 a 20), schema: {type: integer, minimum: 1, maximum: 20, default: 6}}
      responses:
        '200':
          description: Informe (JSON) o su tabla (CSV)
          headers:
            Cache-Control: {schema: {type: string}, description: private, max-age=30}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Report'}
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /notifications:
    get:
      tags: [issues]
      operationId: listNotifications
      summary: Notificaciones del usuario, las mas recientes primero
      description: Devuelve hasta 50 avisos in-app del usuario autenticado. La interfaz consulta el contador cada 30 segundos (sondeo).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notificaciones
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/preferences:
    get:
      tags: [issues]
      summary: Preferencias de avisos del usuario
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias; sin configurar, los avisos en la aplicacion estan activos
          content:
            application/json:
              schema:
                type: object
                properties:
                  in_app: {type: boolean}
                  email: {type: string, enum: [immediate, daily, off]}
                  notify_own_actions: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [issues]
      summary: Actualizar las preferencias de avisos
      description: >-
        Con in_app en false no se guardan avisos nuevos en la aplicacion. email define el correo: immediate
        (cada aviso), daily (un resumen diario) u off. notify_own_actions permite recibir avisos de las propias
        acciones. Las preferencias siempre prevalecen sobre el esquema de notificaciones.
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [in_app]
              properties:
                in_app: {type: boolean}
                email: {type: string, enum: [immediate, daily, off]}
                notify_own_actions: {type: boolean}
      responses:
        '200':
          description: Preferencias guardadas
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notifications/unread-count:
    get:
      tags: [issues]
      operationId: getUnreadNotificationCount
      summary: Numero de notificaciones no leidas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contador
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{id}/read:
    post:
      tags: [issues]
      operationId: markNotificationRead
      summary: Marcar una notificacion como leida
      description: Solo el dueno puede marcarla. Una notificacion ajena responde no encontrada.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marcada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notificacion no encontrada para este usuario
  /notifications/read-all:
    post:
      tags: [issues]
      operationId: markAllNotificationsRead
      summary: Marcar todas las notificaciones como leidas
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Marcadas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project}/notification-scheme:
    get:
      tags: [issues]
      operationId: getProjectNotificationScheme
      summary: Esquema de notificaciones en vigor de un proyecto
      description: >-
        Requiere edit_project. Devuelve las 13 reglas (evento, destinatarios, canales) que aplican al proyecto: las
        propias, completadas con el esquema por defecto de la organizacion y con el esquema base. overridden indica
        que la regla es propia del proyecto. Sin cambios propios, is_default es true.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationProjectId'
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [issues]
      operationId: putProjectNotificationScheme
      summary: Guardar las reglas de notificacion de un proyecto
      description: >-
        Requiere edit_project. Reemplaza las reglas propias del proyecto; los eventos no incluidos siguen el esquema
        de la organizacion. Codigo de validacion notification.scheme_invalid.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSchemeRequest'}
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [issues]
      operationId: resetProjectNotificationScheme
      summary: Restablecer el esquema de notificaciones de un proyecto
      description: Requiere edit_project. Elimina las reglas propias y devuelve el esquema heredado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationProjectId'
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/notification-scheme:
    get:
      tags: [issues]
      operationId: getOrganizationNotificationScheme
      summary: Esquema de notificaciones por defecto de una organizacion
      description: Cualquier miembro puede leerlo. Sin cambios de la organizacion, is_default es true y rige el esquema base.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationOrgId'
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [issues]
      operationId: putOrganizationNotificationScheme
      summary: Guardar el esquema de notificaciones por defecto de la organizacion
      description: Propietarios y administradores. Los proyectos sin reglas propias lo heredan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationOrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSchemeRequest'}
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [issues]
      operationId: resetOrganizationNotificationScheme
      summary: Restablecer el esquema de notificaciones de la organizacion
      description: Propietarios y administradores. Vuelve al esquema base.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationOrgId'
      responses:
        '200': {$ref: '#/components/responses/NotificationScheme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/email-outbox:
    get:
      tags: [issues]
      operationId: adminListEmailOutbox
      summary: Cola de correo saliente
      description: >-
        Solo administradores de la plataforma. Lista los correos de la cola, los mas recientes primero; la
        direccion del destinatario se muestra enmascarada. Estados: pending, sent, dead (6 intentos fallidos).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, sent, dead]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Pagina de correos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/EmailOutboxEntry'}
                  meta:
                    type: object
                    properties:
                      page: {type: integer}
                      page_size: {type: integer}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/email-outbox/{id}/retry:
    post:
      tags: [issues]
      operationId: adminRetryEmailOutbox
      summary: Reintentar un correo muerto
      description: Solo administradores de la plataforma. Vuelve a poner en cola un correo en estado dead con el contador de intentos en cero.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Correo en cola otra vez
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/jobs:
    get:
      tags: [issues]
      operationId: adminListJobs
      summary: Trabajos programados y su ultima ejecucion
      description: Solo administradores de la plataforma. Un unico nodo (el lider) ejecuta los trabajos; cada ejecucion queda registrada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trabajos registrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ScheduledJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /calendar/events:
    get:
      tags: [issues]
      operationId: listCalendarEvents
      summary: Hitos del proyecto entre dos fechas
      description: Inicio y fin de sprint, y fechas limite de incidencias. El rango puede tener como maximo un ano.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Hitos ordenados por fecha
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para ver el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [calendar]
      operationId: createCalendarEvent
      summary: Crear un evento
      description: Los eventos de dia completo usan medianoche UTC y un fin exclusivo (tambien se acepta AAAA-MM-DD). recurrence_rule admite FREQ (DAILY, WEEKLY, MONTHLY, YEARLY), INTERVAL, BYDAY, COUNT y UNTIL (calendar.invalid_recurrence). visibility project exige project_id y editar incidencias; organization exige administrar la organizacion. Los invitados deben ser miembros de la organizacion. Codigo calendar.invalid_event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventCreate'
      responses:
        '201':
          description: Evento creado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /search:
    get:
      tags: [issues]
      operationId: globalSearch
      summary: Busqueda global de proyectos e incidencias
      description: Busca por texto en nombre y clave de proyecto, y en titulo y descripcion de incidencia con indice de texto completo (clave exacta primero, luego relevancia, luego coincidencia por prefijo). Solo devuelve lo visible para el usuario. Los comodines se buscan literalmente. Cada resultado incluye key, highlight (titulo escapado con marcas mark) y snippet (extracto escapado). types selecciona tipos (all, o una lista de project, issue, person, team, filter y note; por defecto project e issue). meta.counts da los resultados por tipo.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
        - name: types
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Resultados por tipo (proyectos, incidencias, personas, equipos, filtros, notas)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/search:
    get:
      tags: [issues]
      operationId: searchIssuesGet
      summary: Buscar incidencias con CoreQL
      description: >-
        Ejecuta una consulta CoreQL (jql) con orden opcional (order, lista de campos con ASC o DESC que reemplaza al
        ORDER BY de la consulta), pagina por page y page_size (maximo 100, hasta 10000 resultados navegables) y
        devuelve las incidencias con la misma forma que GET /issues mas vote_count y labels. meta incluye total
        (omitelo con with_total=false), la consulta normalizada y warnings. fields limita las claves devueltas
        (id y key siempre). Las consultas se ejecutan como SQL parametrizado y siempre se limitan a los proyectos que el usuario puede ver (los eliminados y sus incidencias quedan fuera). Errores: search.syntax_error (con details: position, length, message, suggestions), search.unknown_field, search.field_unavailable, search.operator_unavailable (WAS y CHANGED aun no existen), search.query_too_long, search.query_too_complex, search.page_out_of_range y search.query_timeout.
      security:
        - bearerAuth: []
      parameters:
        - {name: jql, in: query, required: false, schema: {type: string, maxLength: 4000}}
        - {name: order, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: total, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: fields, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Pagina de incidencias con meta (page, page_size, total, query, warnings)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [issues]
      operationId: searchIssuesPost
      summary: Buscar incidencias con CoreQL (cuerpo JSON)
      description: >-
        Ejecuta una consulta CoreQL (jql) con orden opcional (order, lista de campos con ASC o DESC que reemplaza al
        ORDER BY de la consulta), pagina por page y page_size (maximo 100, hasta 10000 resultados navegables) y
        devuelve las incidencias con la misma forma que GET /issues mas vote_count y labels. meta incluye total
        (omitelo con with_total=false), la consulta normalizada y warnings. fields limita las claves devueltas
        (id y key siempre). Las consultas se ejecutan como SQL parametrizado y siempre se limitan a los proyectos que el usuario puede ver (los eliminados y sus incidencias quedan fuera). Errores: search.syntax_error (con details: position, length, message, suggestions), search.unknown_field, search.field_unavailable, search.operator_unavailable (WAS y CHANGED aun no existen), search.query_too_long, search.query_too_complex, search.page_out_of_range y search.query_timeout.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                jql: {type: string, maxLength: 4000}
                order: {type: string, maxLength: 200}
                page: {type: integer, minimum: 1}
                page_size: {type: integer, minimum: 1, maximum: 100}
                with_total: {type: boolean}
                project_id: {type: string, format: uuid}
                fields: {type: array, items: {type: string}}
      responses:
        '200':
          description: Pagina de incidencias con meta (page, page_size, total, query, warnings)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /search/issues:
