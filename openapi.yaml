        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      summary: Calendario combinado de eventos y fechas derivadas
      description: Ocurrencias de eventos (con recurrencia expandida, como maximo 1000 por serie y ventana) mas fechas de vencimiento e inicio de incidencias, inicio y fin de sprint y lanzamiento de versiones. Una fecha to sin hora es inclusiva. La ventana admite como maximo 366 dias. Sin projects, las fechas derivadas cubren los proyectos del usuario.
      security:
        - bearerAuth: []
      parameters:
        - {name: from, in: query, required: true, schema: {type: string}, description: Fecha AAAA-MM-DD o RFC 3339}
        - {name: to, in: query, required: true, schema: {type: string}, description: Fecha AAAA-MM-DD (inclusiva) o RFC 3339 (exclusiva)}
        - {name: projects, in: query, required: false, schema: {type: string}, description: Ids de proyecto separados por comas}
        - {name: types, in: query, required: false, schema: {type: string}, description: Lista separada por comas de event, issue_due, issue_start, sprint_start, sprint_end, version_release o los grupos events, issues, sprints y versions}
      responses:
        '200':
          description: Elementos ordenados por inicio
