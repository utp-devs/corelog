          $ref: '#/components/responses/NotFound'
  /dashboards/{id}/gadgets:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [dashboards]
      operationId: replaceDashboardGadgets
      summary: Reemplazar diseno y gadgets de forma atomica
      description: Valida cada gadget con la configuracion de su tipo (maximo 20). Los gadgets con id conservan su identidad; los demas se crean y los que faltan se borran. Los tipos son assigned_to_me, created_by_me, filter_results, issue_statistics, pie, two_dimensional, created_vs_resolved, sprint_burndown, activity_stream, recent_projects, favorites, text y calendar_upcoming. Codigos dashboard.invalid_gadget y dashboard.gadget_not_found.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardGadgetsRequest'
      responses:
        '200':
          description: Panel con los gadgets guardados
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboards/{id}/shares:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [dashboards]
      operationId: setDashboardShares
      summary: Reemplazar las comparticiones del panel (solo el propietario)
