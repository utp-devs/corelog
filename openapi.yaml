          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    put:
      tags: [projects]
      summary: Dar a un equipo un rol en el proyecto
      description: >-
        Crea o reemplaza el rol del equipo indicado (cuerpo {team_id, role}). El equipo debe pertenecer a la
        organizacion del proyecto (codigo project.team_not_in_org). Requiere manage_members.
      operationId: setProjectTeamRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectTeamRoleRequest'
      responses:
        '200':
          description: Rol de equipo guardado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectTeamRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Datos no validos (codigo validation) o el equipo no pertenece a la organizacion (codigo project.team_not_in_org).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/team-roles/{team_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [projects]
      summary: Quitar el rol de un equipo en el proyecto
      description: Requiere manage_members. Los miembros del equipo pierden el acceso que daba ese rol.
      operationId: deleteProjectTeamRole
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Rol de equipo eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El equipo no tiene rol en el proyecto (codigo project.team_grant_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: team_id no es un UUID valido.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
    get:
      tags: [projects]
      summary: Obtener el esquema de permisos del proyecto
      description: >-
        Devuelve el esquema completo: una entrada por cada permiso del catalogo con sus titulares. is_default es
        true cuando el proyecto no tiene reglas propias. Requiere poder ver el proyecto; si no, responde 404
        (code project.not_found).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Esquema de permisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionScheme'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El proyecto no existe o el usuario no puede verlo (code project.not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [projects]
      summary: Reemplazar el esquema de permisos del proyecto
      description: >-
        Sustituye el esquema completo por el enviado y lo valida. Permisos no listados quedan sin titulares.
        Reglas: lead conserva manage_members y edit_project; delete_project lo tiene lead u org_admin;
        browse_project lo tiene viewer, contributor o lead. Requiere edit_project (403 si no).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePermissionsRequest'
            example:
              grants:
                - permission: create_issue
                  holders: [lead, contributor, viewer]
      responses:
        '200':
          description: Esquema guardado (is_default false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionScheme'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario puede ver el proyecto pero no tiene edit_project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El proyecto no existe o el usuario no puede verlo (code project.not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Cuerpo no valido, permiso o titular desconocido, o regla de esquema rota (code
            authorization.invalid_scheme).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/permissions/reset:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
    post:
      tags: [projects]
      summary: Restaurar el esquema de permisos por defecto
      description: Borra las reglas propias del proyecto. Requiere edit_project (403 si no) y poder ver el proyecto (404 si no).
      security:
        - bearerAuth: []
      responses:
