  /issues/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [tickets]
      summary: Transition a ticket's status
      description: >-
        The transition must exist in the project's default workflow and be allowed for the
        authenticated role. Valid transitions are open to in_progress, open to closed,
        in_progress to resolved, in_progress to closed, resolved to closed, and resolved to
        in_progress. Any other transition is rejected with 409.
      operationId: updateTicketStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: The ticket with its updated status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The requested status transition is not allowed from the ticket's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [tickets]
      summary: Asignar o desasignar una incidencia
      description: >-
        Asigna la incidencia a un usuario, o la desasigna si assignee_id es null. Asignar una
        incidencia abierta tambien la pasa a in_progress; en otro estado solo cambia la persona
        asignada. La persona asignada debe pertenecer al mismo equipo que quien hace la peticion,
        si no responde 403, y se añade a los seguidores de la incidencia en la misma transaccion.
        Desasignar requiere el mismo permiso que asignar, no cambia el estado, no avisa a nadie y
        es idempotente: si la incidencia ya no tiene persona asignada responde 200 sin cambios.
      operationId: assignTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: The ticket with its updated assignee
