  /organizations:
    get:
      tags: [organizations]
      summary: List my organizations
      description: Returns the organizations the caller belongs to, each with the caller's role in it. Organizations the caller can no longer see are omitted.
      operationId: listOrganizations
      responses:
        '200':
          description: Organizations of the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [organizations]
      summary: Create an organization
      description: >-
        The caller becomes the owner. A user may own at most 5 organizations (code org.limit_reached). When slug is
        omitted it is derived from the name.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The slug is already used (code org.slug_taken) or the caller already owns 5 organizations (code org.limit_reached).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.name_required, org.slug_invalid, org.slug_reserved, org.body_invalid
            or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      summary: Get an organization
      description: Returns the organization with the caller's role. Non-members get 404 so that existence is not revealed.
      operationId: getOrganization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist, is deleted, or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The organization id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [organizations]
      summary: Update an organization
      description: >-
        Partial update of name, description and settings. Omitted fields keep their value; settings are merged field
        by field. Owners and admins only.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: The updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.name_required, org.settings_invalid with one detail per field,
            org.body_invalid, org.id_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Delete an organization
      description: >-
        Soft-deletes the organization. Owners only. The body must repeat the organization slug in confirm_slug. The slug
        stays reserved after deletion.
      operationId: deleteOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrganizationRequest'
      responses:
        '204':
          description: Organization deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an owner (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: confirm_slug does not match the slug (code org.confirmation_mismatch), or the body is invalid (org.body_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/issue-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [catalogs]
      summary: Listar tipos de incidencia
      description: >-
        Devuelve los elementos del catalogo en orden de posicion, con el numero de incidencias que los usan (usage_count).
        Cualquier miembro de la organizacion puede leerlos.
      operationId: listIssueTypes
      responses:
        '200':
          description: Elementos del catalogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [catalogs]
      summary: Crear tipo de incidencia
      description: >-
        Anade un elemento al final del catalogo. Solo propietarios y administradores. El nombre es unico en la organizacion
        sin distinguir mayusculas. Los campos icon y color solo aplican a tipos de incidencia y prioridades; en resoluciones se ignoran.
      operationId: createIssueType
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogCreateRequest'}
      responses:
        '201':
          description: Elemento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Ya existe un elemento con ese nombre (catalog.name_taken) o, en tipos de incidencia, ya existe otro con el mismo nivel jerarquico epica o subtarea (catalog.hierarchy_level_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/issue-types/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [catalogs]
      summary: Reordenar tipos de incidencia
      description: >-
        Fija la posicion de cada elemento segun el orden de ids. La lista debe contener exactamente todos los elementos del catalogo,
        una sola vez (catalog.order_mismatch). Solo propietarios y administradores.
      operationId: reorderIssueTypes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogReorderRequest'}
      responses:
        '200':
          description: Catalogo en el nuevo orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/issue-types/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: id
        in: path
        required: true
        description: Identificador del elemento de catalogo.
        schema: {type: string, format: uuid}
    patch:
      tags: [catalogs]
      summary: Actualizar tipo de incidencia
      description: >-
        Cambia nombre, descripcion, icono o color. El nivel jerarquico de un tipo de incidencia no cambia. is_default true
        convierte el elemento en el predeterminado; false no tiene efecto (para cambiar el predeterminado se marca otro elemento).
        Solo propietarios y administradores.
      operationId: updateIssueType
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogPatchRequest'}
      responses:
        '200':
          description: Elemento actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Ya existe otro elemento con ese nombre (catalog.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [catalogs]
      summary: Eliminar tipo de incidencia
      description: >-
        Elimina el elemento. Si hay incidencias que lo usan, reassign_to debe nombrar otro elemento compatible: las incidencias
        se mueven a el en la misma transaccion. El ultimo elemento obligatorio (tipo estandar, epica y subtarea en tipos; al menos
        uno en prioridades y resoluciones) no se puede eliminar. Si era el predeterminado, lo toma el primero por posicion.
        Solo propietarios y administradores.
      operationId: deleteIssueType
      parameters:
        - name: reassign_to
          in: query
          required: false
          description: Elemento que recibe las incidencias cuando el elemento que se elimina esta en uso.
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Elemento eliminado
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: El elemento esta en uso y falta reassign_to (catalog.in_use).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            reassign_to no existe o no es compatible (catalog.reassign_target_invalid, catalog.reassign_to_self), o es el ultimo
            elemento obligatorio de su tipo (catalog.last_required_item).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/priorities:
