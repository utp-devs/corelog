        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [calendar]
      operationId: updateCalendarEvent
      summary: Cambiar un evento o una sola ocurrencia
      description: Con occurrence (instante original en RFC 3339) solo se cambian titulo, descripcion, lugar, color y horario de esa ocurrencia (calendar.invalid_occurrence si no pertenece a la serie). Cambiar la regla o el inicio descarta las excepciones. Editan el propietario, quien edite incidencias en un evento de proyecto y los administradores en uno de organizacion.
