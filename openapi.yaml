          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Number of issues matching the filters, across all pages.
    CreateIssueRequest:
      type: object
      required: [summary, description]
      properties:
        custom:
          type: object
          additionalProperties: true
          description: Valores de campos personalizados por id de campo. Solo se aceptan campos que aplican al proyecto y tipo; los obligatorios y los valores por defecto se aplican al crear (issue.custom_field_invalid con details por campo).
        summary:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 3
          maxLength: 100000
          description: Descripcion en markdown (hasta 100000 caracteres).
        priority_id:
          type: string
          format: uuid
          nullable: true
          description: Prioridad del catalogo. Si se omite, se usa la prioridad predeterminada de la organizacion.
        priority:
          $ref: '#/components/schemas/IssuePriority'
          description: Valor legado (low, medium, high, critical) que se traduce al elemento del catalogo con esa clave. Usa priority_id.
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Proyecto de la incidencia. Si se omite, se usa el proyecto por defecto (CORE).
        issue_type_id:
          type: string
          format: uuid
          nullable: true
          description: Tipo de incidencia del catalogo. Si se omite, se usa el tipo predeterminado del proyecto (Tarea). Debe estar habilitado en el proyecto (issue.type_not_enabled).
        issue_type:
          $ref: '#/components/schemas/IssueType'
          description: Valor legado que se traduce al tipo del catalogo con esa clave. Usa issue_type_id.
        parent_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
          description: Fecha de vencimiento (YYYY-MM-DD). Se acepta tambien un timestamp RFC 3339, del que se conserva la fecha UTC.
        story_points:
          type: number
          format: double
          nullable: true
          description: Puntos de historia de 0 a 999.5 en pasos de 0.5 (issue.invalid_story_points).
        start_date:
          type: string
          format: date
          nullable: true
          description: Fecha de inicio (YYYY-MM-DD); no puede ser posterior al vencimiento (issue.invalid_dates).
        original_estimate_seconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        remaining_estimate_seconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Persona asignada (requiere assign_issue). Si se omite se aplica la politica del proyecto (default_assignee_policy). El resto de campos del esquema del proyecto marcados como obligatorios en la disposicion se validan (422 validation.failed con details).
    RunIssueTransitionRequest:
      type: object
      required: [transition_id]
      additionalProperties: false
      properties:
        transition_id:
          type: string
          maxLength: 64
          description: Id de una de las transiciones devueltas por GET /issues/{id}/transitions.
        fields:
          type: object
          additionalProperties: {type: string}
          description: >-
            Valores de los campos que pide la transicion (required_fields). Campos estandar: story_points, due_date,
            start_date (AAAA-MM-DD) y flagged; los campos personalizados usan el nombre cf_ seguido de los 32 digitos
            hexadecimales de su id.
        comment:
          type: string
          description: Comentario de la transicion; se guarda como comentario de la incidencia.
        resolution_id:
          type: string
          format: uuid
          nullable: true
          description: Resolucion elegida; si se omite, el flujo aplica la resolucion Done de la organizacion en estados de categoria done.
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Persona asignada cuando la transicion la pide.
        expected_status_id:
          type: string
          format: uuid
          nullable: true
          description: Estado que el cliente vio. Si ya no es el actual, la transicion falla con 409 issue.status_conflict.
    AssignIssueRequest:
      type: object
      required: [assignee_id]
      properties:
        assignee_id:
          description: UUID de la persona asignada, o null para desasignar. El campo es obligatorio; omitirlo responde 422.
          type: string
          format: uuid
          nullable: true
    UpdateIssueDetailsRequest:
      type: object
      required: [summary, description]
      properties:
        custom:
          type: object
          additionalProperties: true
          description: Cambio parcial de valores personalizados (null borra el valor). Los campos obligatorios que el cuerpo nombra se validan; una incidencia que cambia de tipo revalida todos los obligatorios y descarta los valores fuera de contexto.
        summary:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 3
          maxLength: 100000
          description: Descripcion en markdown (hasta 100000 caracteres).
        priority_id:
          type: string
          format: uuid
          nullable: true
          description: Prioridad del catalogo. Si se omite, se conserva la actual.
        priority:
          $ref: '#/components/schemas/IssuePriority'
          description: Valor legado. Usa priority_id.
        issue_type_id:
          type: string
          format: uuid
          nullable: true
          description: Tipo de incidencia del catalogo. Si se omite, se conserva el actual.
        issue_type:
          $ref: '#/components/schemas/IssueType'
          description: Valor legado. Usa issue_type_id.
        parent_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
          description: Fecha de vencimiento (YYYY-MM-DD). Se acepta tambien un timestamp RFC 3339, del que se conserva la fecha UTC.
        story_points:
          type: number
          format: double
          nullable: true
    PatchIssueRequest:
      type: object
      description: Todos los campos son opcionales; solo cambian los presentes. Los campos no listados se rechazan con 422.
      properties:
        summary: {type: string, maxLength: 255}
        description: {type: string, nullable: true, maxLength: 100000}
        issue_type_id: {type: string, format: uuid}
        issue_type: {$ref: '#/components/schemas/IssueType'}
        priority_id: {type: string, format: uuid}
        priority: {$ref: '#/components/schemas/IssuePriority'}
        parent_id: {type: string, format: uuid, nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        story_points: {type: number, format: double, nullable: true, minimum: 0, maximum: 999.5, multipleOf: 0.5}
        original_estimate_seconds: {type: integer, format: int64, nullable: true, minimum: 0}
        remaining_estimate_seconds: {type: integer, format: int64, nullable: true, minimum: 0}
        start_date: {type: string, format: date, nullable: true}
        due_date: {type: string, format: date, nullable: true}
        flagged: {type: boolean}
        labels: {type: array, nullable: true, maxItems: 20, items: {type: string, minLength: 1, maxLength: 40}}
        custom:
          type: object
          additionalProperties: true
        expected_updated_at:
          type: string
          format: date-time
          description: Precondicion de concurrencia; si difiere del updated_at actual la respuesta es 409 issue.stale.
    IssueChange:
      type: object
