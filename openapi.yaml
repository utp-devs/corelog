        schema:
          type: string
          format: uuid
    get:
      tags: [issues]
      summary: Historial de ediciones de un comentario
      description: Textos anteriores del comentario, el mas reciente primero. Solo el autor o quien gestiona comentarios.
      operationId: listCommentRevisions
