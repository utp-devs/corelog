                    $ref: '#/components/schemas/EffectivePermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El proyecto no existe o el usuario no puede verlo (code project.not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/labels:
