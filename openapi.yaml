        assignee_id:
          type: string
          format: uuid
          nullable: true
        assignee_name:
          type: string
          nullable: true
          description: Display name of the assignee; absent when unassigned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CatalogItem:
      type: object
      description: Elemento de un catalogo de la organizacion (tipo de incidencia, prioridad o resolucion).
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: Tarea}
        description: {type: string}
        icon:
          type: string
          description: Clave de icono de la paleta. Solo tipos de incidencia y prioridades.
          example: task
        color:
          type: string
          description: Clave de color de la paleta. Solo tipos de incidencia y prioridades.
          example: blue
        hierarchy_level:
          type: integer
          enum: [-1, 0, 1]
          description: Solo tipos de incidencia. 1 epica, 0 estandar, -1 subtarea.
        position: {type: integer, minimum: 0}
        is_default: {type: boolean, description: Elemento que se usa cuando la peticion no indica tipo o prioridad.}
        usage_count: {type: integer, minimum: 0, description: Incidencias que usan el elemento.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CatalogCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 60, description: 40 caracteres para prioridades.}
        description: {type: string, maxLength: 500}
        icon:
          type: string
          description: Clave de la paleta de iconos (task, bug, story, epic, subtask, star, flag, bolt, alert, check, layers, tag, book, rocket, shield, clock, circle, arrow-up, arrow-down, minus, chevrons-up, chevrons-down).
        color:
          type: string
          description: Clave de la paleta de colores (gray, red, orange, amber, green, teal, blue, indigo, purple, pink).
        hierarchy_level:
          type: integer
          enum: [-1, 0, 1]
          default: 0
          description: Solo tipos de incidencia. Una epica (1) o una subtarea (-1) solo se pueden crear si no existe ya una de ese nivel.
        is_default: {type: boolean, default: false}
    CatalogPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        description: {type: string, maxLength: 500}
        icon: {type: string}
        color: {type: string}
        is_default: {type: boolean}
    CatalogReorderRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
          description: Todos los identificadores del catalogo, en el nuevo orden.
    ProjectIssueTypesRequest:
      type: object
      required: [issue_type_ids]
      additionalProperties: false
      properties:
        issue_type_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
          description: Tipos de incidencia del proyecto, en orden. Debe incluir al menos un tipo estandar, el tipo epica y el tipo subtarea (project.issue_types_required).
    ProjectIssueTypes:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogItem'}
        configured:
          type: boolean
          description: false cuando el proyecto no tiene configuracion propia y usa todos los tipos de la organizacion.
    CustomFieldOption:
      type: object
      required: [id, label, position, archived]
      properties:
        id: {type: string, maxLength: 64, description: Identificador estable de la opcion. Lo asigna el servidor al crearla.}
        label: {type: string, maxLength: 60}
        color: {type: string, description: Color de la paleta de la aplicacion; vacio si no tiene.}
        position: {type: integer, minimum: 0}
        archived: {type: boolean, description: Las opciones archivadas siguen resolviendo valores existentes pero no admiten valores nuevos.}
    CustomFieldSettings:
      type: object
      description: Limites del tipo number. Ausentes cuando el campo no tiene limites.
      properties:
        min: {type: number, nullable: true}
        max: {type: number, nullable: true}
    CustomFieldContext:
      type: object
      required: [required, default_value]
      properties:
        project_id: {type: string, format: uuid, nullable: true, description: Proyecto del contexto; null = todos los proyectos de la organizacion.}
        issue_type_id: {type: string, format: uuid, nullable: true, description: Tipo de incidencia del contexto; null = todos los tipos.}
        required: {type: boolean}
        default_value: {nullable: true, description: Valor por defecto aplicado al crear, con la forma del tipo de campo.}
    CustomField:
      type: object
      required: [id, name, description, type, options, position, contexts, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 60}
        description: {type: string, maxLength: 500}
        type:
          type: string
          enum: [text, paragraph, number, date, datetime, select, multiselect, checkbox, user, url, labels]
        options:
          type: array
          description: Solo para select y multiselect; vacio en los demas tipos.
          items: {$ref: '#/components/schemas/CustomFieldOption'}
        settings: {$ref: '#/components/schemas/CustomFieldSettings'}
        position: {type: integer, minimum: 0}
        contexts:
          type: array
          items: {$ref: '#/components/schemas/CustomFieldContext'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CustomFieldCreateRequest:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 60}
        description: {type: string, maxLength: 500}
        type:
          type: string
          enum: [text, paragraph, number, date, datetime, select, multiselect, checkbox, user, url, labels]
        options:
          type: array
          maxItems: 100
          description: Opciones iniciales (solo select y multiselect). Al crear no se envia id.
          items:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              label: {type: string, maxLength: 60}
              color: {type: string}
        settings:
          type: object
          additionalProperties: false
          properties:
            min: {type: number}
            max: {type: number}
    CustomFieldPatchRequest:
      type: object
      additionalProperties: false
      description: Cambio parcial. Enviar options reemplaza la lista completa; las opciones con id existente conservan su identificador.
      properties:
        name: {type: string, maxLength: 60}
        description: {type: string, maxLength: 500}
        options:
          type: array
          maxItems: 100
          items:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              id: {type: string, maxLength: 64, description: Vacio o ausente crea una opcion nueva.}
              label: {type: string, maxLength: 60}
              color: {type: string}
              archived: {type: boolean}
        settings:
          type: object
          additionalProperties: false
          properties:
            min: {type: number, nullable: true}
            max: {type: number, nullable: true}
    CustomFieldContextsRequest:
      type: object
      required: [contexts]
      additionalProperties: false
      properties:
        contexts:
          type: array
          description: Lista completa de contextos. Cada par proyecto y tipo aparece una sola vez.
          items:
            type: object
            additionalProperties: false
            properties:
              project_id: {type: string, format: uuid, nullable: true}
              issue_type_id: {type: string, format: uuid, nullable: true}
              required: {type: boolean}
              default_value: {nullable: true}
    IssueCustomField:
      type: object
      description: Campo personalizado que aplica a la incidencia, para renderizar su valor.
      required: [field_id, name, type, options, required]
      properties:
        field_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string}
        options: {type: array, items: {$ref: '#/components/schemas/CustomFieldOption'}}
        required: {type: boolean, description: Obligatorio en el contexto de la incidencia (contexto o disposicion).}
    ProjectFieldLayout:
      type: object
      required: [issue_type_id, configured, items]
      properties:
        issue_type_id: {type: string, format: uuid}
        configured: {type: boolean, description: false cuando el proyecto no tiene disposicion propia para el tipo.}
        items:
          type: array
          items:
            type: object
            required: [kind, required]
            properties:
              kind: {type: string, enum: [system, custom]}
              key: {type: string, description: Presente en entradas del sistema.}
              field_id: {type: string, format: uuid, description: Presente en entradas personalizadas.}
              name: {type: string}
              type: {type: string}
              options: {type: array, items: {$ref: '#/components/schemas/CustomFieldOption'}}
              required: {type: boolean}
    ProjectFieldLayoutRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [kind]
            additionalProperties: false
            properties:
              kind: {type: string, enum: [system, custom]}
              key:
                type: string
                enum: [summary, description, priority, assignee, parent, due_date, story_points, labels]
              field_id: {type: string, format: uuid}
              required: {type: boolean}
    IssueTypeRef:
      type: object
      description: Tipo de incidencia de una incidencia.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        icon: {type: string}
        color: {type: string}
        hierarchy_level: {type: integer, enum: [-1, 0, 1]}
    PriorityRef:
      type: object
      description: Prioridad de una incidencia.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        icon: {type: string}
        color: {type: string}
    ResolutionRef:
      type: object
      nullable: true
      description: Resolucion de una incidencia terminada. Null mientras la incidencia no esta resuelta.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Worklog:
      type: object
      description: Registro de tiempo de una persona sobre una incidencia. Las duraciones textuales usan las horas por dia y dias por semana de la organizacion.
      properties:
        id: {type: string, format: uuid}
        issue_id: {type: string, format: uuid}
        issue_key: {type: string, example: COR-12}
        author_id: {type: string, format: uuid}
        author_name: {type: string}
        started_at: {type: string, format: date-time}
        time_spent_seconds: {type: integer, minimum: 1}
        time_spent: {type: string, example: 1h 30m}
        description: {type: string, maxLength: 5000}
        remaining_mode: {type: string, enum: [auto, set, reduce, leave]}
        remaining_adjust_seconds: {type: integer, minimum: 0, description: Segundos que este registro quito a la estimacion restante}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorklogTotals:
      type: object
      description: Totales de tiempo de una incidencia.
      properties:
        original_estimate_seconds: {type: integer, nullable: true}
        original_estimate: {type: string, nullable: true, example: 1d}
        remaining_estimate_seconds: {type: integer, nullable: true}
        remaining_estimate: {type: string, nullable: true, example: 6h 30m}
        time_spent_seconds: {type: integer, minimum: 0}
        time_spent: {type: string, example: 1h 30m}
    TimesheetDay:
      type: object
      properties:
        date: {type: string, format: date}
        total_seconds: {type: integer}
        total: {type: string, example: 7h}
        capacity_seconds: {type: integer, description: Horas por dia de la organizacion en segundos}
        entries:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              issue_id: {type: string, format: uuid}
              issue_key: {type: string}
              issue_title: {type: string}
              author_id: {type: string, format: uuid}
              started_at: {type: string, format: date-time}
              time_spent_seconds: {type: integer}
              time_spent: {type: string}
              description: {type: string}
    TimeSummaryGroup:
      type: object
      properties:
        key: {type: string, description: Identificador del grupo (usuario, incidencia o fecha AAAA-MM-DD)}
        label: {type: string}
        total_seconds: {type: integer}
        total: {type: string}
        count: {type: integer}
    ReportDescriptor:
      type: object
      properties:
        kind: {type: string}
        title: {type: string}
        description: {type: string}
        params: {type: array, items: {type: string}}
    Report:
      type: object
      description: Informe uniforme. Los codigos de error son report.kind_unknown, report.range_invalid, report.range_too_large, report.param_invalid, report.sprint_not_found, report.version_required, report.version_not_found, report.filter_invalid, report.filter_too_broad y report.too_many_issues.
      properties:
        kind: {type: string}
        title: {type: string}
        generated_at: {type: string, format: date-time}
        params: {type: object, additionalProperties: true, description: Parametros usados, con la zona horaria aplicada}
        series:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    x: {type: string, description: Fecha AAAA-MM-DD, periodo o etiqueta}
                    y: {type: number}
        table:
          type: object
          properties:
            columns:
              type: array
              items:
                type: object
                properties:
                  key: {type: string}
                  label: {type: string}
                  type: {type: string, enum: [text, number, percent, date]}
            rows:
              type: array
              description: Cada fila tiene un valor por columna, en el mismo orden
              items: {type: array, items: {}}
        summary: {type: object, additionalProperties: true}
    LegalSlug:
      type: string
      enum: [privacy_policy, data_processing, terms_of_use, cookies, communications]
    ConsentRef:
      type: object
      required: [slug, version]
      properties:
        slug:
          $ref: '#/components/schemas/LegalSlug'
        version:
          type: integer
          minimum: 1
    PendingConsent:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/LegalSlug'
        title:
          type: string
        version:
          type: integer
    LegalDocumentSummary:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/LegalSlug'
        title:
          type: string
        version:
          type: integer
        summary:
          type: string
        required:
          type: boolean
        effective_from:
          type: string
          format: date-time
    LegalDocument:
      allOf:
        - $ref: '#/components/schemas/LegalDocumentSummary'
        - type: object
          properties:
            body_markdown:
              type: string
              description: Contenido en Markdown (vacio en el listado de administracion).
            published_at:
              type: string
              format: date-time
            created_by:
              type: string
              format: uuid
              nullable: true
    ConsentStatus:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: object
            properties:
              slug:
                $ref: '#/components/schemas/LegalSlug'
              version:
                type: integer
              accepted_at:
                type: string
                format: date-time
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingConsent'
    RecordConsentsRequest:
      type: object
      additionalProperties: false
      required: [accepted, source]
      properties:
        accepted:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConsentRef'
        source:
          type: string
          enum: [register, invite, login_reprompt, profile]
    PublishLegalDocumentRequest:
      type: object
      additionalProperties: false
      required: [slug, title, body_markdown]
      properties:
        slug:
          $ref: '#/components/schemas/LegalSlug'
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
        body_markdown:
          type: string
          maxLength: 200000
        required:
          type: boolean
          description: Por defecto true para privacy_policy, data_processing y terms_of_use; false para el resto. communications nunca puede ser obligatorio.
    ConsentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/LegalSlug'
        version:
          type: integer
        accepted_at:
          type: string
          format: date-time
        ip:
          type: string
          nullable: true
          description: Direccion anonimizada (IPv4 con el ultimo octeto en cero, IPv6 a /64).
        user_agent:
          type: string
          nullable: true
          maxLength: 255
        source:
          type: string
          enum: [register, invite, login_reprompt, profile]
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Mensaje legible en espanol.
              example: a valid email is required
            code:
              type: string
              description: Codigo estable para el cliente (por ejemplo auth.invalid_credentials). Se omite si el error no tiene codigo.
              example: validation.failed
            details:
              type: array
              description: Errores por campo (solo en validation.failed). Se omite cuando esta vacio.
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: un correo valido es obligatorio
    Organization:
      type: object
      required: [id, slug, name, description, settings, has_logo, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: acme
        name:
          type: string
          example: Acme
        description:
          type: string
          description: Descripción de la organización (puede estar vacía).
        settings:
          $ref: '#/components/schemas/OrganizationSettings'
        has_logo:
          type: boolean
          description: Indica si la organización tiene logo. La URL de la imagen es GET /organizations/{org}/logo.
        role:
          type: string
          enum: [owner, admin, member, guest]
          description: Rol del usuario autenticado en la organización. Solo aparece en el listado y en los detalles.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationSettings:
      type: object
      required: [who_can_create_projects, who_can_create_teams, default_project_visibility, require_2fa, max_upload_bytes, hours_per_day, days_per_week, timezone]
      properties:
        who_can_create_projects:
          type: string
          enum: [members, admins]
          description: Quién puede crear proyectos.
        who_can_create_teams:
          type: string
          enum: [members, admins]
          description: Quién puede crear equipos.
        default_project_visibility:
          type: string
          enum: [open, private]
          description: Visibilidad por defecto de los proyectos nuevos.
        require_2fa:
          type: boolean
          description: Exigir segundo factor a los miembros.
        max_upload_bytes:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Tamaño máximo de adjuntos en bytes (100 MiB como máximo).
        hours_per_day:
          type: number
          exclusiveMinimum: 0
          maximum: 24
        days_per_week:
          type: number
          exclusiveMinimum: 0
          maximum: 7
        timezone:
          type: string
          description: Zona horaria IANA, por ejemplo Europe/Madrid.
    OrganizationMember:
      type: object
      required: [user_id, name, display_name, email, job_title, department, has_avatar, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre visible del miembro (el nombre a mostrar si existe, si no el nombre de la cuenta).
        display_name:
          type: string
        email:
          type: string
          format: email
        job_title:
          type: string
          description: Cargo; cadena vacía si no está informado.
        department:
          type: string
          description: Departamento; cadena vacía si no está informado.
        has_avatar:
          type: boolean
          description: Indica si la cuenta tiene avatar. La clave de almacenamiento no se expone.
        role:
          type: string
          enum: [owner, admin, member, guest]
        joined_at:
          type: string
          format: date-time
    OrganizationPerson:
      type: object
      required: [user_id, name, display_name, email, job_title, department, timezone, has_avatar, org_role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        job_title:
          type: string
        department:
          type: string
        timezone:
          type: string
          description: Zona horaria IANA de la cuenta.
        has_avatar:
          type: boolean
        org_role:
          type: string
          enum: [owner, admin, member, guest]
          description: Rol del miembro en la organización consultada.
        joined_at:
          type: string
          format: date-time
    OrganizationMembership:
      type: object
      required: [organization_id, user_id, role, joined_at]
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, guest]
          description: Rol con el que se entró (el de la invitación).
        joined_at:
          type: string
          format: date-time
    Invitation:
      type: object
      required: [id, email, role, status, invited_by, expires_at, accepted_at, revoked_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, member, guest]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: Estado calculado en el instante de la respuesta.
        invited_by:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    InvitationCreated:
      description: Invitación con su token en claro. El token y accept_url solo se muestran en esta respuesta.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [token, accept_url]
          properties:
            token:
              type: string
              description: Token en claro (32 bytes aleatorios, codificados). Solo se almacena su hash.
            accept_url:
              type: string
              format: uri
              description: URL para aceptar la invitación, ${PUBLIC_URL o el origen de la petición}/invite/<token>.
    InvitationPreview:
      type: object
      required: [organization_id, organization_name, has_logo, invited_by, role, email, status, expires_at]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        has_logo:
          type: boolean
          description: Indica si la organización tiene logo. La URL de la imagen es GET /organizations/{org}/logo.
        invited_by:
          type: string
          nullable: true
          description: Nombre visible (display_name, o name si no tiene) del miembro que creó la invitación. Null si se desconoce o su cuenta fue desactivada.
        role:
          type: string
          enum: [owner, admin, member, guest]
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expires_at:
          type: string
          format: date-time
    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          example: Acme
        slug:
          type: string
          description: Identificador en minúsculas, 3 a 40 caracteres. Si se omite se deriva del nombre.
          example: acme
        description:
          type: string
          maxLength: 500
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      description: Actualización parcial. Los campos omitidos conservan su valor.
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        settings:
          type: object
          additionalProperties: false
          description: Campos de OrganizationSettings a cambiar. Los omitidos conservan su valor.
          properties:
            who_can_create_projects:
              type: string
              enum: [members, admins]
            who_can_create_teams:
              type: string
              enum: [members, admins]
            default_project_visibility:
              type: string
              enum: [open, private]
            require_2fa:
              type: boolean
            max_upload_bytes:
              type: integer
            hours_per_day:
              type: number
            days_per_week:
              type: number
            timezone:
              type: string
    DeleteOrganizationRequest:
      type: object
      required: [confirm_slug]
      additionalProperties: false
      properties:
        confirm_slug:
          type: string
          description: Debe coincidir exactamente con el identificador de la organización.
    TransferOwnershipRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: Miembro que pasa a ser propietario. La persona que transfiere pasa a admin.
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [owner, admin, member, guest]
    InviteItem:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        role:
          type: string
          enum: [owner, admin, member, guest]
    CreateInvitationsRequest:
      type: object
      required: [invitations]
      additionalProperties: false
      properties:
        invitations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/InviteItem'
    CreateInvitationsResponse:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationCreated'
security:
  - bearerAuth: []
