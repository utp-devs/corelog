    PermissionGrant:
      type: object
      required: [permission, holders]
      properties:
        permission:
          type: string
          description: Nombre del permiso del catalogo (por ejemplo create_issue, edit_project).
          example: create_issue
        holders:
          type: array
          description: >-
            Titulares que tienen el permiso: lead, contributor, viewer, org_admin, o los titulares especiales
            reporter, assignee, watcher (solo aplican sobre una incidencia).
          items:
            type: string
            enum: [lead, contributor, viewer, org_admin, reporter, assignee, watcher]
          example: [lead, contributor]
    PermissionScheme:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        is_default:
          type: boolean
          description: true cuando el proyecto no tiene reglas propias y usa el esquema por defecto.
        grants:
          type: array
          description: Una entrada por cada permiso del catalogo, en orden de catalogo.
          items:
            $ref: '#/components/schemas/PermissionGrant'
    ReplacePermissionsRequest:
      type: object
      description: Esquema completo. Campos desconocidos se rechazan (422).
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
    EffectivePermissions:
      type: object
      properties:
        role:
          type: string
          description: Rol efectivo del usuario en el proyecto, o none si no tiene rol.
          enum: [lead, contributor, viewer, none]
          example: contributor
        permissions:
          type: array
          description: Permisos del catalogo que el usuario tiene (sin titulares especiales).
          items:
            type: string
          example: [browse_project, create_issue, comment_issue]
    ProjectMember:
