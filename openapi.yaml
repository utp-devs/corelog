  /projects/{id}/components/{component_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: component_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [projects]
      summary: Editar un componente
      description: Requiere manage_components. Cambia nombre, descripcion, responsable (lead_id; null lo quita) y la politica por defecto de asignacion. El responsable debe ser miembro del proyecto (422 component.lead_invalid). La politica component_lead exige responsable (422 component.lead_required).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectComponentRequest'
      responses:
        '200':
          description: Componente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectComponent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Borrar un componente
      description: Requiere manage_components. Con move_to, las incidencias del componente pasan al componente de destino (mismo proyecto, distinto del borrado; 422 component.move_target_invalid).
      security:
        - bearerAuth: []
      parameters:
        - name: move_to
          in: query
          required: false
          description: Componente que recibe las incidencias del borrado.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Componente borrado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
    get:
      tags: [releases]
      summary: Listar versiones del proyecto con su progreso
      description: Devuelve las versiones con el progreso de sus incidencias de correccion (total, hechas y por categoria de estado) y sus puntos. Requiere ver el proyecto; un usuario sin acceso recibe 404.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado.
          schema:
            type: string
            enum: [unreleased, released, archived]
      responses:
        '200':
          description: Versiones del proyecto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [releases]
      summary: Crear una version
      description: Requiere manage_versions. El nombre es unico en el proyecto sin distinguir mayusculas (409 version.name_taken). Un proyecto archivado responde 409 project.archived.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Version creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /versions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [releases]
      summary: Leer una version
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Version con su progreso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [releases]
      summary: Editar una version
      description: Requiere manage_versions. Enviar status unreleased reabre una version publicada (limpia la fecha de publicacion). Las versiones archivadas no admiten cambios (409 version.archived).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVersionRequest'
      responses:
        '200':
          description: Version actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [releases]
      summary: Borrar una version
      description: Requiere manage_versions. Con move_to, las incidencias vinculadas pasan a esa version (debe ser del mismo proyecto y seguir sin publicar); si no, se quitan los vinculos.
      security:
        - bearerAuth: []
      parameters:
        - name: move_to
          in: query
          required: false
          description: Version que recibe las incidencias de la version borrada.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Version borrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /versions/{id}/release:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [releases]
      summary: Publicar una version
      description: Requiere manage_versions. Pasa la version de unreleased a released. move_unresolved_to decide el destino de las incidencias de correccion no terminadas - "new" crea la siguiente version, un UUID mueve a una version sin publicar del mismo proyecto, null las deja. Emite version.released.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseVersionRequest'
      responses:
        '200':
          description: Version publicada con el resumen del movimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseVersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /versions/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [releases]
      summary: Archivar una version
      description: Requiere manage_versions. Estado terminal; una version archivada ya no admite cambios ni incidencias de correccion. Responde 409 version.invalid_transition si ya estaba archivada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Version archivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /versions/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [releases]
      summary: Notas de la version
      description: Incidencias que corrigen la version agrupadas por tipo de incidencia, en markdown (titulos en espanol) y en JSON. Requiere ver el proyecto.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notas de la version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseNotes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations:
    get:
      tags: [organizations]
      summary: List my organizations
      description: Returns the organizations the caller belongs to, each with the caller's role in it. Organizations the caller can no longer see are omitted.
      operationId: listOrganizations
      responses:
        '200':
          description: Organizations of the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [organizations]
      summary: Create an organization
      description: >-
        The caller becomes the owner. A user may own at most 5 organizations (code org.limit_reached). When slug is
        omitted it is derived from the name.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The slug is already used (code org.slug_taken) or the caller already owns 5 organizations (code org.limit_reached).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.name_required, org.slug_invalid, org.slug_reserved, org.body_invalid
            or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      summary: Get an organization
      description: Returns the organization with the caller's role. Non-members get 404 so that existence is not revealed.
      operationId: getOrganization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist, is deleted, or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The organization id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [organizations]
      summary: Update an organization
      description: >-
        Partial update of name, description and settings. Omitted fields keep their value; settings are merged field
        by field. Owners and admins only.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: The updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.name_required, org.settings_invalid with one detail per field,
            org.body_invalid, org.id_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Delete an organization
      description: >-
        Soft-deletes the organization. Owners only. The body must repeat the organization slug in confirm_slug. The slug
        stays reserved after deletion.
      operationId: deleteOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrganizationRequest'
      responses:
        '204':
          description: Organization deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an owner (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: confirm_slug does not match the slug (code org.confirmation_mismatch), or the body is invalid (org.body_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/issue-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [catalogs]
      summary: Listar tipos de incidencia
      description: >-
        Devuelve los elementos del catalogo en orden de posicion, con el numero de incidencias que los usan (usage_count).
        Cualquier miembro de la organizacion puede leerlos.
      operationId: listIssueTypes
      responses:
        '200':
          description: Elementos del catalogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [catalogs]
      summary: Crear tipo de incidencia
      description: >-
        Anade un elemento al final del catalogo. Solo propietarios y administradores. El nombre es unico en la organizacion
