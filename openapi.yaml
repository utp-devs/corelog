components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: The ticket's unique identifier
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: The user's unique identifier
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: The team's unique identifier
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The request is missing a valid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No resource exists with the given identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The operation conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum: [admin, agent, requester]
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, medium, high, critical]
    IssueType:
      type: string
      enum: [task, bug, story, epic, subtask]
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        team_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    SetTeamRequest:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          nullable: true
          description: Set to null to remove the user from their current team.
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
        type:
          type: string
          enum: [kanban, scrum]
        lead_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [private, team]
    ProjectBoard:
      type: object
      required: [id, project_id, name, type, columns]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [kanban, scrum]
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
    BoardColumn:
      type: object
      required: [id, name, status, position, count, cards]
      properties:
        id:
          type: string
          format: uuid
        name:
