  /search:
    get:
      tags: [tickets]
      operationId: globalSearch
      summary: Busqueda global de proyectos e incidencias
      description: Busca por texto en nombre y clave de proyecto, y en titulo y descripcion de incidencia. Solo devuelve lo visible para el usuario (admin global, o miembro del proyecto). Los comodines se buscan literalmente.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: Proyectos primero, luego incidencias
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard/me:
    get:
      tags: [tickets]
      operationId: getMyDashboard
      summary: Resumen personal del usuario
      description: Trabajo asignado por estado, incidencias vencidas, proyectos en los que es miembro, sprints activos de esos proyectos y las 5 incidencias abiertas mas urgentes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen personal
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workflows:
    get:
      tags: [tickets]
      operationId: getDefaultWorkflow
      summary: Flujo por defecto de un proyecto
      description: Devuelve las transiciones de estado permitidas y los roles de proyecto que pueden ejecutarlas. Requiere poder ver el proyecto.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Flujo por defecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      project_id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      transitions:
                        type: array
                        items:
                          type: object
                          properties:
                            from_status:
                              type: string
                            to_status:
                              type: string
                            allowed_roles:
                              type: array
                              items:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para ver el proyecto
        '404':
          description: El proyecto no tiene flujo por defecto
    put:
      tags: [tickets]
      operationId: updateDefaultWorkflow
      summary: Reemplazar las transiciones del flujo por defecto
      description: Solo el lider del proyecto o el administrador global. Valida estados, roles permitidos (admin, lead, contributor, viewer) y transiciones duplicadas o sin cambio de estado.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitions]
              properties:
                transitions:
                  type: array
                  items:
                    type: object
                    required: [from_status, to_status, allowed_roles]
                    properties:
                      from_status:
                        type: string
                        enum: [open, in_progress, resolved, closed]
                      to_status:
                        type: string
                        enum: [open, in_progress, resolved, closed]
                      allowed_roles:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum: [admin, lead, contributor, viewer]
      responses:
        '200':
          description: Flujo actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Solo lead o administrador global
        '404':
          description: El proyecto no tiene flujo por defecto
        '422':
          $ref: '#/components/responses/ValidationError'
