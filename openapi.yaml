        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Ya existe un elemento con ese nombre (catalog.name_taken) o, en tipos de incidencia, ya existe otro con el mismo nivel jerarquico epica o subtarea (catalog.hierarchy_level_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/priorities/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [catalogs]
      summary: Reordenar prioridades
      description: >-
        Fija la posicion de cada elemento segun el orden de ids. La lista debe contener exactamente todos los elementos del catalogo,
        una sola vez (catalog.order_mismatch). Solo propietarios y administradores.
      operationId: reorderPriorities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogReorderRequest'}
      responses:
        '200':
          description: Catalogo en el nuevo orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/priorities/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: id
        in: path
        required: true
        description: Identificador del elemento de catalogo.
        schema: {type: string, format: uuid}
    patch:
      tags: [catalogs]
      summary: Actualizar prioridad
      description: >-
        Cambia nombre, descripcion, icono o color. El nivel jerarquico de un tipo de incidencia no cambia. is_default true
        convierte el elemento en el predeterminado; false no tiene efecto (para cambiar el predeterminado se marca otro elemento).
        Solo propietarios y administradores.
      operationId: updatePriority
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogPatchRequest'}
      responses:
        '200':
          description: Elemento actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Ya existe otro elemento con ese nombre (catalog.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [catalogs]
      summary: Eliminar prioridad
      description: >-
        Elimina el elemento. Si hay incidencias que lo usan, reassign_to debe nombrar otro elemento compatible: las incidencias
        se mueven a el en la misma transaccion. El ultimo elemento obligatorio (tipo estandar, epica y subtarea en tipos; al menos
        uno en prioridades y resoluciones) no se puede eliminar. Si era el predeterminado, lo toma el primero por posicion.
        Solo propietarios y administradores.
      operationId: deletePriority
      parameters:
        - name: reassign_to
          in: query
          required: false
          description: Elemento que recibe las incidencias cuando el elemento que se elimina esta en uso.
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Elemento eliminado
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: El elemento esta en uso y falta reassign_to (catalog.in_use).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            reassign_to no existe o no es compatible (catalog.reassign_target_invalid, catalog.reassign_to_self), o es el ultimo
            elemento obligatorio de su tipo (catalog.last_required_item).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/resolutions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [catalogs]
      summary: Listar resoluciones
      description: >-
        Devuelve los elementos del catalogo en orden de posicion, con el numero de incidencias que los usan (usage_count).
        Cualquier miembro de la organizacion puede leerlos.
      operationId: listResolutions
      responses:
        '200':
          description: Elementos del catalogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [catalogs]
      summary: Crear resolucion
      description: >-
        Anade un elemento al final del catalogo. Solo propietarios y administradores. El nombre es unico en la organizacion
        sin distinguir mayusculas. Los campos icon y color solo aplican a tipos de incidencia y prioridades; en resoluciones se ignoran.
      operationId: createResolution
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogCreateRequest'}
      responses:
        '201':
          description: Elemento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Ya existe un elemento con ese nombre (catalog.name_taken) o, en tipos de incidencia, ya existe otro con el mismo nivel jerarquico epica o subtarea (catalog.hierarchy_level_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/resolutions/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [catalogs]
      summary: Reordenar resoluciones
      description: >-
        Fija la posicion de cada elemento segun el orden de ids. La lista debe contener exactamente todos los elementos del catalogo,
        una sola vez (catalog.order_mismatch). Solo propietarios y administradores.
      operationId: reorderResolutions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogReorderRequest'}
      responses:
        '200':
          description: Catalogo en el nuevo orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/resolutions/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
