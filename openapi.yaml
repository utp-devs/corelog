      security:
        - bearerAuth: []
      responses:
        '200':
          description: Panel principal
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/roadmap:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [roadmap]
      operationId: getProjectRoadmap
      summary: Hoja de ruta del proyecto
      description: Barras de epicas (o versiones o sprints segun group_by) con fechas propias o derivadas de sus hijas, progreso por categoria de estado, banderas de version, bandas de sprint y dependencias blocks entre epicas. Las barras sin fechas llevan dated false y siempre se devuelven. Requiere ver el proyecto.
      security:
        - bearerAuth: []
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: group_by, in: query, required: false, schema: {type: string, enum: [epic, version, sprint]}}
        - {name: filter, in: query, required: false, schema: {type: string, enum: [all, open, done]}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Hoja de ruta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/roadmap/dependencies:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [roadmap]
      operationId: getProjectRoadmapDependencies
      summary: Dependencias blocks entre epicas del proyecto
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de {from, to, kind}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/roadmap/rank:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [roadmap]
      operationId: rankProjectRoadmapEpics
      summary: Orden manual de las epicas en la hoja de ruta
      description: Las epicas indicadas van primero y en ese orden; las demas conservan su orden por defecto. Una lista vacia borra el orden. Requiere editar incidencias. Codigo roadmap.invalid_rank.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epic_ids]
