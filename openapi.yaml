          description: Esquema por defecto (is_default true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionScheme'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario puede ver el proyecto pero no tiene edit_project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El proyecto no existe o el usuario no puede verlo (code project.not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/permissions/me:
    parameters:
