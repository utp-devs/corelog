openapi: 3.0.3
info:
  title: CoreLog API
  description: Incident management and ticket resolution API for CoreLog.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: auth
    description: Registration and authentication
  - name: users
    description: User identity, profile, and directory search
  - name: teams
    description: Team management and membership
  - name: tickets
    description: Incident and ticket management
  - name: health
    description: Service liveness
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email address is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive an access token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          description: The email or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me:
    get:
      tags: [users]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      summary: Update the current user's profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The email address is already registered to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/password:
    post:
      tags: [users]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed successfully
        '401':
          description: Not authenticated, or the supplied current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/search:
    get:
      tags: [users]
      summary: Search users within the current user's own team
      description: >-
        Returns an empty list when the current user does not belong to a team, since there is
        nobody they are allowed to search for or assign tickets to.
      operationId: searchTeammates
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
      responses:
        '200':
          description: Teammates matching the search query
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [users]
      summary: List or search all users
      description: Administrator only. Unlike /users/search, this is not restricted to the caller's own team.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: team_id
          in: query
          required: false
          description: Restrict results to members of this team. Omit to search across every team.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users matching the given filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}/team:
    patch:
      tags: [users]
      summary: Assign or clear a user's team
      description: Administrator only.
      operationId: setUserTeam
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams:
    get:
      tags: [teams]
      summary: List all teams
      operationId: listTeams
      responses:
        '200':
          description: Every team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [teams]
      summary: Create a team
      description: Administrator only.
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A team with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get a team by id
      operationId: getTeam
      responses:
        '200':
          description: The requested team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [teams]
      summary: Rename a team
      description: Administrator only.
      operationId: renameTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTeamRequest'
      responses:
        '200':
          description: The renamed team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A team with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [teams]
      summary: Delete a team
      description: Administrator only. Members of the deleted team are left without a team rather than being deleted themselves.
      operationId: deleteTeam
      responses:
        '204':
          description: The team was deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects visible to the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      summary: Update a project
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Delete a project
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/board:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Get the default board for a project
      description: Incluye can_manage_board, true si el actor puede editar el tablero y sus columnas (lead o administrador global).
      operationId: getProjectBoard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Board columns and their issue cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/cards/{issue_id}/move:
    post:
      tags: [tickets]
      operationId: moveBoardCard
      summary: Mover una incidencia a otra columna del tablero
      description: La columna destino define el estado de la incidencia (ADR-004). Requiere permiso de edicion de incidencias y respeta el flujo del proyecto y el limite WIP de la columna.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column_id]
              properties:
                column_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para editar incidencias del proyecto
        '404':
          description: Columna o incidencia no encontrada en el proyecto
        '409':
          description: La columna destino alcanzo su limite WIP o el cambio de estado no esta permitido por el flujo
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/columns/{column_id}:
    patch:
      tags: [tickets]
      operationId: updateBoardColumnWip
      summary: Fijar o quitar el limite WIP de una columna
      description: Solo el lider del proyecto o el administrador global. Enviar wip_limit null quita el limite.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: column_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wip_limit:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Solo lead o administrador global
        '404':
          description: Columna no encontrada en el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: List project members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [projects]
      summary: Add or update a project member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: Project member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/members/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [projects]
      summary: Change a project member role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberRequest'
      responses:
        '200':
          description: Project member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Remove a project member
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /issues:
    post:
      tags: [tickets]
      summary: Create a ticket
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [tickets]
      summary: List tickets
      operationId: listTickets
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by ticket status. When absent, tickets of every status are returned.
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          required: false
          description: Filter by ticket priority. When absent, tickets of every priority are returned.
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: q
          in: query
          required: false
          description: Text search across title and description.
          schema:
            type: string
        - name: issue_type
          in: query
          required: false
          description: Filter by issue type.
          schema:
            $ref: '#/components/schemas/IssueType'
        - name: label_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: due_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: One-based page number. Defaults to 1 when absent or invalid.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Number of tickets per page. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tickets matching the given filters, with the total across all pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backlog:
    get:
      tags: [tickets]
      operationId: listBacklog
      summary: Backlog de un proyecto ordenado por rank
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Incidencias en orden de backlog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para ver el proyecto
  /backlog/{issue_id}:
    put:
      tags: [tickets]
      operationId: moveInBacklog
      summary: Colocar una incidencia en una posicion del backlog
      description: Requiere permiso de mover tarjetas (lead o contributor). Renumera el rank de las incidencias del proyecto con el orden resultante y devuelve el backlog.
      security:
        - bearerAuth: []
      parameters:
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Backlog actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para mover incidencias del proyecto
        '404':
          description: Incidencia no encontrada en el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
  /workflows:
    get:
      tags: [tickets]
      operationId: getDefaultWorkflow
      summary: Flujo por defecto de un proyecto
      description: Devuelve las transiciones de estado permitidas y los roles de proyecto que pueden ejecutarlas. Requiere poder ver el proyecto.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Flujo por defecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      project_id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      transitions:
                        type: array
                        items:
                          type: object
                          properties:
                            from_status:
                              type: string
                            to_status:
                              type: string
                            allowed_roles:
                              type: array
                              items:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para ver el proyecto
        '404':
          description: El proyecto no tiene flujo por defecto
    put:
      tags: [tickets]
      operationId: updateDefaultWorkflow
      summary: Reemplazar las transiciones del flujo por defecto
      description: Solo el lider del proyecto o el administrador global. Valida estados, roles permitidos (admin, lead, contributor, viewer) y transiciones duplicadas o sin cambio de estado.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitions]
              properties:
                transitions:
                  type: array
                  items:
                    type: object
                    required: [from_status, to_status, allowed_roles]
                    properties:
                      from_status:
                        type: string
                        enum: [open, in_progress, resolved, closed]
                      to_status:
                        type: string
                        enum: [open, in_progress, resolved, closed]
                      allowed_roles:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum: [admin, lead, contributor, viewer]
      responses:
        '200':
          description: Flujo actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Solo lead o administrador global
        '404':
          description: El proyecto no tiene flujo por defecto
        '422':
          $ref: '#/components/responses/ValidationError'
