        - bearerAuth: []
      parameters:
        - {name: occurrence, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '204':
          description: Evento borrado u ocurrencia cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
