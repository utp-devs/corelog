        status_ids: {type: array, items: {type: string, format: uuid}}
    OrganizationStatusDeleteResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        reassigned_issues: {type: integer, minimum: 0}
    BoardSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [scrum, kanban]}
        is_default: {type: boolean}
        column_count: {type: integer}
        swimlane_mode: {type: string, enum: [none, assignee, epic, query, story]}
    BoardColumnConfig:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        color: {type: string, description: 'Vacio o gray, red, orange, amber, green, teal, blue, indigo, purple, pink.'}
        position: {type: integer}
        min_issues: {type: integer, nullable: true}
        max_issues: {type: integer, nullable: true, description: Limite WIP de la columna.}
        status_ids:
          type: array
          items: {type: string, format: uuid}
    BoardColumnInput:
      type: object
      required: [name]
      properties:
        id: {type: string, format: uuid, description: Id de una columna existente del tablero para conservarla.}
        name: {type: string, maxLength: 80}
        color: {type: string}
        min_issues: {type: integer, minimum: 0, nullable: true}
        max_issues: {type: integer, minimum: 1, nullable: true}
        status_ids:
          type: array
          items: {type: string, format: uuid}
    BoardQueryInput:
      type: object
      required: [name, query]
      properties:
        name: {type: string, maxLength: 60}
        query: {type: string, maxLength: 500}
    BoardQuery:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        query: {type: string}
    BoardWorkflowStatus:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        category: {type: string, enum: [todo, in_progress, done]}
    BoardDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [scrum, kanban]}
        is_default: {type: boolean}
