            format: uuid
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Backlog actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
