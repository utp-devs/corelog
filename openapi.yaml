        schema: {type: string, format: uuid}
      - name: issue_type_id
        in: query
        required: true
        description: Tipo de incidencia cuya disposicion de campos se consulta o se guarda.
        schema: {type: string, format: uuid}
    get:
      tags: [custom-fields]
      summary: Disposicion de campos del proyecto para un tipo
      description: >-
        Devuelve los campos del sistema y los personalizados que aplican al tipo en el proyecto, en orden, con su
        marca de obligatorio. Sin disposicion guardada (configured false) se usa el orden por defecto. Requiere ver el proyecto.
      operationId: getProjectFieldLayout
      responses:
        '200':
          description: Disposicion de campos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectFieldLayout'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    put:
      tags: [custom-fields]
      summary: Guardar disposicion de campos del proyecto para un tipo
      description: >-
        Reemplaza la disposicion del tipo en el proyecto. Cada entrada es un campo del sistema (key) o un campo
        personalizado de la organizacion (field_id), sin repetir. Requiere editar el proyecto.
      operationId: replaceProjectFieldLayout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectFieldLayoutRequest'}
      responses:
        '200':
          description: Disposicion guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectFieldLayout'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{id}/issue-types:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del proyecto. Los no miembros reciben 404.
        schema: {type: string, format: uuid}
    get:
      tags: [catalogs]
      summary: Tipos de incidencia del proyecto
      description: >-
        Devuelve los tipos de incidencia que usa el proyecto. Sin configuracion propia, son todos los tipos de la organizacion
        (configured false). Requiere ver el proyecto.
      operationId: getProjectIssueTypes
      responses:
        '200':
          description: Tipos del proyecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectIssueTypes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [catalogs]
      summary: Configurar los tipos de incidencia del proyecto
      description: >-
        Reemplaza la lista de tipos del proyecto, en el orden recibido. Debe incluir al menos un tipo estandar, el tipo epica
        y el tipo subtarea (project.issue_types_required). Requiere editar el proyecto.
      operationId: replaceProjectIssueTypes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectIssueTypesRequest'}
      responses:
        '200':
          description: Configuracion guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectIssueTypes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/logo:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [organizations]
      summary: Upload an organization logo
      description: >-
        Replaces the logo of the organization. The multipart field file must be a PNG, JPEG or WebP image of at most 2 MB.
        The image is converted to a 256x256 PNG before it is stored. The previous logo file is removed. Owners and admins only.
      operationId: uploadOrganizationLogo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP image, at most 2 MB and 4096 px per side.
      responses:
        '200':
          description: Logo stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logo_url:
                        type: string
                        description: Relative URL of the stored logo (/organizations/{org}/logo).
                        example: /organizations/3f2a1c9e-8b4d-4e7a-9c1f-2d6b5a7e8f90/logo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '413':
          description: The file exceeds 2 MB (code org.logo_too_large).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The multipart body is malformed, the file part is missing, or the file is not a valid PNG, JPEG or WebP image
            (code org.logo_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    get:
      tags: [organizations]
      summary: Get an organization logo
      description: >-
        Returns the PNG logo of the organization. Any member may read it. The response carries an ETag and a private cache
        lifetime of one hour; send If-None-Match to receive 304 when the logo has not changed.
      operationId: getOrganizationLogo
      responses:
        '200':
          description: The logo image
          headers:
            ETag:
              description: Strong validator derived from the stored logo version.
              schema: {type: string}
            Cache-Control:
              description: Always private, max-age=3600.
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              description: Always nosniff.
              schema: {type: string, example: nosniff}
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The client already holds the current logo (If-None-Match matched the ETag).
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              schema: {type: string, example: nosniff}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            The organization does not exist or the caller is not a member (code org.not_found), or the organization has no
            logo (code org.logo_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The organization id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Delete an organization logo
      description: Removes the logo of the organization. Idempotent. Owners and admins only.
      operationId: deleteOrganizationLogo
      responses:
        '204':
          description: Logo removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/leave:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      summary: Leave an organization
      description: The caller removes their own membership. The last owner cannot leave (code org.last_owner).
      operationId: leaveOrganization
      responses:
        '204':
          description: Membership removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The caller is the last owner (code org.last_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      summary: Transfer ownership
      description: Makes an existing member the owner and demotes the caller to admin. Owners only.
      operationId: transferOrganizationOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: Ownership transferred
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an owner (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The target is the caller (code org.transfer_self) or the body is invalid (org.body_invalid, org.id_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      summary: List the members of an organization
      description: Returns the members with their name, display name, job title, department, avatar flag and email. Guests may not read the list.
      operationId: listOrganizationMembers
      responses:
        '200':
          description: Members of the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a guest (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/people/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationUserId'
    get:
      tags: [organizations]
      summary: Get the profile of a member
      description: >-
        Returns the profile of a member of the organization. Any member may read it, except that guests may only read
        their own profile (code org.forbidden). Users outside the organization and targets that are not members get 404.
      operationId: getOrganizationPerson
      responses:
        '200':
          description: Profile of the member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationPerson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a guest and the target is not the caller (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, the caller is not a member, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationUserId'
    patch:
      tags: [organizations]
      summary: Change the role of a member
      description: >-
        Owners may grant or revoke any role. Admins may only switch members and guests between member and guest. Changing
        one's own role is not allowed (code org.self_role_change).
      operationId: changeOrganizationMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '204':
          description: Role changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not grant or revoke this role (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The caller changes their own role (code org.self_role_change) or the role is invalid (org.role_invalid, org.body_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Remove a member
      description: Owners and admins. Admins may remove members and guests. Removing an owner requires being an owner; the last owner cannot be removed.
      operationId: removeOrganizationMember
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not remove this member (code org.forbidden or org.cannot_remove_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The member is the last owner (code org.last_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [invitations]
      summary: List invitations
      description: >-
        Owners and admins. status=pending (default) returns invitations still open at this instant; status=all also
        returns accepted, revoked and expired ones.
      operationId: listOrganizationInvitations
      parameters:
        - name: status
          in: query
          required: false
          description: Which invitations to list.
          schema:
            type: string
            enum: [pending, all]
            default: pending
      responses:
        '200':
          description: Invitations of the organization, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The status filter is not pending or all (code org.status_filter_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [invitations]
      summary: Invite people by email
      description: >-
        Owners and admins. Creates one invitation per entry, atomically. The response is the only time the plain token
        and accept_url are returned; only a hash is stored. Tokens expire after 7 days. Creating a new invitation for an
        email with a pending one retires the old one.
      operationId: createOrganizationInvitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationsRequest'
      responses:
        '201':
          description: Invitations created, in the order of the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateInvitationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin, or admins invite a role they may not grant (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The email is already a member (code org.already_member) or a pending invitation already exists for it (code org.invitation_exists).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.invitation_batch_invalid, org.invitation_email_invalid, org.role_invalid,
            org.body_invalid, org.id_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [invitations]
      summary: Revoke an invitation
      description: Owners and admins. Revokes a pending invitation; its link stops working at once.
      operationId: revokeOrganizationInvitation
      responses:
        '204':
          description: Invitation revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization or the invitation does not exist (code org.not_found or org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The invitation was already accepted (code org.invitation_used) or revoked (code org.invitation_revoked).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      summary: Resend an invitation with a new token
      description: >-
        Owners and admins. Replaces the token of a pending invitation and restarts its 7-day expiry. The old link stops
        working immediately. The new plain token and accept_url are returned once.
      operationId: resendOrganizationInvitation
      responses:
        '200':
          description: Invitation renewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization or the invitation does not exist (code org.not_found or org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The invitation was already accepted (code org.invitation_used) or revoked (code org.invitation_revoked).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [invitations]
      summary: Preview an invitation
      description: >-
        Public. Describes the invitation behind the token so the invitee can decide to accept. It has no side effects.
        Every unknown token gets the same 404, so the answer never reveals whether an account exists.
      operationId: previewInvitation
      security: []
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: Unknown token (code org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [invitations]
      summary: Accept an invitation
      description: >-
        The caller's account email must match the invited email (case-insensitive). Adds the caller to the organization
        with the invited role.
      operationId: acceptInvitation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                consents:
                  type: array
                  description: >-
                    Documentos legales aceptados. Si el usuario aun tiene documentos obligatorios pendientes, 422
                    legal.consent_required y la invitacion no se acepta.
                  items:
                    $ref: '#/components/schemas/ConsentRef'
      responses:
        '201':
          description: The caller is now a member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The account email does not match the invitation (code org.email_mismatch).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: Unknown token (code org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: >-
            The invitation was used (org.invitation_used), revoked (org.invitation_revoked), expired (org.invitation_expired)
            or the caller is already a member (org.already_member).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /legal/documents:
    get:
      tags: [legal]
      summary: Listar los documentos legales vigentes
      description: >-
        Publico (sin autenticacion). Devuelve la version vigente de cada documento legal sin su contenido. Incluye
        ETag y Cache-Control (max-age corto); un If-None-Match igual responde 304.
      operationId: listLegalDocuments
      security: []
      responses:
        '200':
          description: Documentos vigentes
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegalDocumentSummary'
        '304':
          description: El cliente ya tiene esta version (If-None-Match)
        '422':
          $ref: '#/components/responses/ValidationError'
  /legal/documents/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {$ref: '#/components/schemas/LegalSlug'}
    get:
      tags: [legal]
      summary: Obtener un documento legal con su contenido
      description: >-
        Publico (sin autenticacion). Devuelve la version vigente o, con ?version=N, una version concreta. El contenido
        es Markdown en espanol. ETag por slug y version.
      operationId: getLegalDocument
      security: []
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 1}
          description: Version concreta; por defecto la vigente. Una version no valida responde 422 legal.version_invalid.
      responses:
        '200':
          description: El documento
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LegalDocument'
        '304':
          description: El cliente ya tiene esta version (If-None-Match)
        '404':
          description: El documento o la version no existe (legal.document_not_found)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/consents:
    get:
      tags: [legal]
      summary: Estado de mis consentimientos
      description: Devuelve la version aceptada de cada documento y la lista de documentos obligatorios pendientes.
      operationId: getMyConsents
      responses:
        '200':
          description: Estado de consentimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [legal]
      summary: Aceptar documentos legales
      description: >-
        Registra la aceptacion de la version vigente de cada documento enviado. Aceptar de nuevo la misma version es
        idempotente. La direccion IP se guarda anonimizada (IPv4 con el ultimo octeto en cero, IPv6 a /64).
      operationId: recordMyConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentsRequest'
      responses:
        '200':
          description: Estado de consentimientos tras registrar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >-
            Lista vacia (legal.consent_empty), origen no valido (legal.source_invalid), documento no valido
            (legal.slug_invalid) o version que no es la vigente (legal.version_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /me/consents/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {$ref: '#/components/schemas/LegalSlug'}
    delete:
      tags: [legal]
      summary: Revocar el consentimiento de comunicaciones
      description: Solo el consentimiento opcional communications se puede revocar.
      operationId: revokeMyConsent
      responses:
        '204':
          description: Consentimiento revocado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No hay un consentimiento activo (legal.consent_not_found)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El documento es obligatorio y no se puede revocar (legal.consent_not_revocable)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/legal/documents:
    get:
      tags: [legal]
      summary: Listar todas las versiones de los documentos legales
      description: Solo administradores de la plataforma. Sin contenido (body_markdown vacio).
      operationId: adminListLegalDocuments
      responses:
        '200':
          description: Todas las versiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegalDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [legal]
      summary: Publicar una nueva version de un documento legal
      description: >-
        Solo administradores de la plataforma. La version se autoincrementa y entra en vigor al publicarse; los
        usuarios deberan aceptarla de nuevo si el documento es obligatorio.
      operationId: adminPublishLegalDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishLegalDocumentRequest'
      responses:
        '201':
          description: Version publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LegalDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Otra publicacion simultanea (legal.publish_conflict)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Datos no validos (validation.failed), slug (legal.slug_invalid) o communications obligatorio (legal.communications_optional)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /admin/legal/consents:
    get:
      tags: [legal]
      summary: Auditoria de consentimientos
      description: Solo administradores de la plataforma. Lista los consentimientos, los mas recientes primero.
      operationId: adminListConsents
      parameters:
        - name: user
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: Filtra por usuario.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Consentimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Solicitar el enlace para restablecer la contrasena
      description: >-
        Responde siempre 202 con el mismo mensaje, exista o no la cuenta (no revela si el correo esta registrado).
        Si existe, envia un correo con un enlace de un solo uso valido durante 1 hora; una solicitud nueva invalida
        el enlace anterior. Limitado por direccion IP y por correo.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Restablecer la contrasena con el enlace recibido por correo
      description: >-
        Aplica la politica de contrasenas y la confirmacion, revoca todas las sesiones, limpia el bloqueo de la cuenta
        y registra el evento en la auditoria. El token es de un solo uso. Un token desconocido, vencido o usado
        responde auth.reset_token_invalid; una contrasena debil (user.password_weak) no consume el token.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Contrasena actualizada
        '422':
          description: >-
            Token invalido (auth.reset_token_invalid), contrasena debil (user.password_weak), confirmacion distinta
            (user.password_mismatch) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email/verify/request:
    post:
      tags: [auth]
      summary: Enviar el enlace de verificacion del correo del usuario actual
      operationId: requestEmailVerification
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Enlace enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El correo ya esta verificado (auth.email_already_verified) o el envio no esta disponible (auth.verification_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email/verify:
    post:
      tags: [auth]
      summary: Verificar el correo con el token recibido
      description: Marca users.email_verified_at. El token es de un solo uso y vale 24 horas.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Correo verificado
        '422':
          description: Token invalido, vencido o usado (auth.verification_token_invalid) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/audit:
    get:
      tags: [audit]
      summary: Registro de auditoria de toda la plataforma
      description: >-
        Solo administradores de la plataforma. Entradas inmutables (solo lectura), las mas recientes primero, con
        paginacion por cursor. La IP se guarda anonimizada.
      operationId: adminListAudit
      parameters:
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          $ref: '#/components/responses/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/audit/export:
    get:
      tags: [audit]
      summary: Exportar la auditoria de la plataforma como CSV
      description: Solo administradores de la plataforma. Admite los mismos filtros que el listado (maximo 50000 filas).
      operationId: adminExportAudit
      parameters:
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          $ref: '#/components/responses/AuditCsv'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{org}/audit:
    get:
      tags: [audit]
      summary: Registro de auditoria de una organizacion
      description: Propietarios y administradores de la organizacion. Solo ve las entradas de esa organizacion.
      operationId: listOrganizationAudit
      parameters:
        - name: org
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          $ref: '#/components/responses/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /organizations/{org}/audit/export:
    get:
      tags: [audit]
      summary: Exportar la auditoria de una organizacion como CSV
      description: Propietarios y administradores de la organizacion (maximo 50000 filas).
      operationId: exportOrganizationAudit
      parameters:
        - name: org
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          $ref: '#/components/responses/AuditCsv'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Mounted at the server root, outside the /api/v1 prefix used by every other endpoint.
      operationId: getHealth
      security: []
      servers:
        - url: http://localhost:8080
          description: Server root, without the /api/v1 prefix
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '405':
          description: Método HTTP no permitido para esta ruta
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Notas del usuario
      description: Solo devuelve notas propias, nunca de otros usuarios, tampoco para administradores. Orden - primero las fijadas y luego por fecha de actualizacion descendente. Paginacion por cursor (cursor opaco de la respuesta anterior).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Texto buscado en titulo y cuerpo (sin distinguir mayusculas)
          schema:
            type: string
            maxLength: 200
        - name: tag
          in: query
          description: Filtra por una etiqueta
          schema:
            type: string
            maxLength: 30
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: issue
          in: query
          description: Notas vinculadas a esta incidencia
          schema:
            type: string
            format: uuid
        - name: project
          in: query
          description: Notas vinculadas a este proyecto
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Cursor de la pagina siguiente
          schema:
            type: string
        - name: limit
          in: query
          description: Notas por pagina (1 a 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Notas del usuario y cursor de la siguiente pagina
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  meta:
                    $ref: '#/components/schemas/NoteListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [notes]
      operationId: createNote
      summary: Crear una nota privada
      description: Las notas son privadas de su autor. Para vincular una incidencia o un proyecto, el usuario debe poder verlo; si no existe o no puede verlo responde 404 con note.link_forbidden.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Nota creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteLinkForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /notes/tags:
    get:
      tags: [notes]
      operationId: listNoteTags
      summary: Etiquetas de mis notas con su cantidad
      description: Etiquetas distintas de las notas propias no borradas, con el numero de notas que las usan. Ordenadas por cantidad descendente y luego alfabeticamente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Etiquetas con su cantidad
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NoteTagCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la nota
        schema:
          type: string
          format: uuid
    get:
      tags: [notes]
      operationId: getNote
      summary: Obtener una nota propia
      description: Las notas de otros usuarios, incluidos los administradores, responden 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nota
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
    patch:
      tags: [notes]
      operationId: updateNote
      summary: Actualizar una nota (parcial)
      description: Solo se modifican los campos enviados. issue_id y project_id aceptan null o cadena vacia para quitar el vinculo; si se omiten, el vinculo se conserva. Un vinculo nuevo exige poder ver el elemento.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotePatch'
      responses:
        '200':
          description: Nota actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La nota no existe o no es propia, o el elemento a vincular no existe o no puede verse (note.not_found o note.link_forbidden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Borrar una nota (borrado logico)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Nota borrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
  /notes/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [notes]
      operationId: pinNote
      summary: Fijar una nota
      description: Operacion idempotente. Responde la nota actualizada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nota fijada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
  /notes/{id}/unpin:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [notes]
      operationId: unpinNote
      summary: Quitar la fijacion de una nota
      description: Operacion idempotente. Responde la nota actualizada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nota sin fijar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteNotFound'
  /favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: Favoritos del usuario por tipo
      description: Devuelve los elementos marcados con estrella que el usuario todavia puede ver. Los proyectos borrados o que dejaron de ser visibles no aparecen. El campo created_at es el momento en que se marco la estrella.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          description: Tipo de elemento. Hoy solo se admite project.
          schema:
            type: string
            enum: [project, filter, board, dashboard, issue, team]
          example: project
      responses:
        '200':
          description: Favoritos del usuario
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavoriteItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /favorites/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        description: Tipo de elemento. Hoy solo se admite project.
        schema:
          type: string
          enum: [project, filter, board, dashboard, issue, team]
      - name: id
        in: path
        required: true
        description: Identificador del elemento
        schema:
          type: string
          format: uuid
    put:
      tags: [favorites]
      operationId: starEntity
      summary: Marcar un elemento como favorito
      description: Operación idempotente. Requiere poder ver el elemento; si no es visible responde 404 sin revelar que existe. Marcarlo dos veces no tiene efecto adicional.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Favorito guardado (o ya existía)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [favorites]
      operationId: unstarEntity
      summary: Quitar un elemento de favoritos
      description: Operación idempotente. Permite quitar la estrella aunque el elemento ya no sea visible o haya sido borrado.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Favorito eliminado (o no existía)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /recent:
    get:
      tags: [favorites]
      operationId: listRecent
      summary: Elementos vistos recientemente por el usuario
      description: Ordenados por última visita, de más reciente a más antiguo. Se conservan como máximo 50 por usuario y tipo. El campo created_at es la fecha de creación del elemento y viewed_at la última visita. Los elementos no visibles o borrados se omiten.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          description: Tipo de elemento. Hoy solo se admite project.
          schema:
            type: string
            enum: [project, filter, board, dashboard, issue, team]
          example: project
        - name: limit
          in: query
          required: false
          description: Número máximo de elementos. Por defecto 10; el máximo es 50 y valores mayores se ajustan a 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Elementos recientes del usuario
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecentItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/api-tokens:
    get:
      tags: [integrations]
      summary: "Listar los tokens de acceso personales"
      description: "Requiere una sesion: un token de acceso no puede gestionar tokens. Nunca devuelve el valor secreto."
      operationId: listApiTokens
      responses:
        '200':
          description: "Tokens del usuario, el mas reciente primero"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ApiToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [integrations]
      summary: "Crear un token de acceso personal"
      description: "Devuelve el token en claro una sola vez (campo token, formato cl_pat_ mas 40 caracteres). Maximo 20 tokens activos. Alcances: read (solo lectura), write (lectura y escritura), admin (solo administradores de la plataforma). Codigos: api_token.invalid_input, api_token.limit_reached (409), api_token.admin_scope_forbidden, api_token.session_required."
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, maxLength: 80}
                scopes:
                  type: array
                  items: {type: string, enum: [read, write, admin]}
                expires_at: {type: string, format: date-time, nullable: true}
      responses:
        '201':
          description: "Token creado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ApiToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /me/api-tokens/{id}:
    delete:
      tags: [integrations]
      summary: "Revocar un token de acceso"
      operationId: revokeApiToken
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Token revocado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/webhooks:
    get:
      tags: [integrations]
      summary: "Listar los webhooks de una organizacion"
      description: "Propietarios y administradores de la organizacion. Filtro opcional project_id."
      operationId: listWebhooks
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Webhooks"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [integrations]
      summary: "Crear un webhook"
      description: "Devuelve el secreto de firma una sola vez (campo secret). Eventos: issue.created, issue.updated, issue.transitioned, issue.deleted, issue.restored, comment.created, sprint.started, sprint.completed, version.released o *. Cada entrega lleva X-CoreLog-Signature (sha256= HMAC-SHA256 de \"timestamp.cuerpo\"), X-CoreLog-Timestamp, X-CoreLog-Event y X-CoreLog-Delivery. Codigos: webhook.invalid, webhook.invalid_filter, webhook.project_not_found."
      operationId: createWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: {type: string}
                url: {type: string}
                events: {type: array, items: {type: string}}
                filter_query: {type: string, nullable: true}
                project_id: {type: string, format: uuid, nullable: true}
                enabled: {type: boolean}
      responses:
        '201':
          description: "Webhook creado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /organizations/{org}/webhooks/{id}:
    get:
      tags: [integrations]
      summary: "Obtener un webhook"
      operationId: getWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Webhook"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [integrations]
      summary: "Modificar un webhook"
      description: "Un filter_query vacio elimina el filtro."
      operationId: updateWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                url: {type: string}
                events: {type: array, items: {type: string}}
                filter_query: {type: string}
                enabled: {type: boolean}
      responses:
        '200':
          description: "Webhook actualizado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Webhook'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [integrations]
      summary: "Eliminar un webhook y sus entregas"
      operationId: deleteWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Webhook eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/webhooks/{id}/test:
    post:
      tags: [integrations]
      summary: "Enviar un ping de prueba"
      description: "Envia el evento ping de forma sincrona y devuelve la entrega registrada. Un fallo no se reintenta."
      operationId: testWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Entrega del ping"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/webhooks/{id}/rotate-secret:
    post:
      tags: [integrations]
      summary: "Rotar el secreto de firma"
      description: "Devuelve el nuevo secreto una sola vez; el anterior deja de ser valido."
      operationId: rotateWebhookSecret
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Nuevo secreto"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/webhooks/{id}/deliveries:
    get:
      tags: [integrations]
      summary: "Entregas recientes de un webhook"
      operationId: listWebhookDeliveries
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: "Entregas, la mas reciente primero"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{org}/webhooks/{id}/deliveries/{delivery}/redeliver:
    post:
      tags: [integrations]
      summary: "Reenviar una entrega"
      description: "Encola una copia del cuerpo de la entrega original."
      operationId: redeliverWebhook
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: delivery, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202':
          description: "Entrega encolada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project}/automation-rules:
    get:
      tags: [automation]
      summary: "Listar las reglas de automatizacion de un proyecto"
      description: "Requiere el permiso manage_automation (responsables del proyecto y administradores de la organizacion)."
      operationId: listAutomationRules
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Reglas"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [automation]
      summary: "Crear una regla de automatizacion"
      description: "Disparadores: issue_created, issue_updated (field), issue_transitioned (from, to), comment_added, sprint_started, sprint_completed, scheduled (every_minutes, query). Condiciones: query, field_equals, field_in, actor_role, issue_type. Acciones: transition_issue, assign_issue, set_field, add_comment, add_label, remove_label, create_subtask, send_webhook, send_notification. Valores inteligentes permitidos en los textos: issue.key, issue.summary, issue.status, issue.priority, issue.type, actor.name, project.key, project.name, trigger.from, trigger.to, rule.name. Codigos: automation.invalid_rule, automation.invalid_query."
      operationId: createAutomationRule
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationRuleInput'
      responses:
        '201':
          description: "Regla creada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /automation-rules/validate:
    post:
      tags: [automation]
      summary: "Validar una regla sin guardarla (simulacion)"
      description: "Devuelve los errores de la definicion y, con issue_id de muestra, el texto de las acciones que se ejecutarian."
      operationId: validateAutomationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, trigger, actions]
              properties:
                project_id: {type: string, format: uuid}
                issue_id: {type: string, format: uuid, nullable: true}
                name: {type: string}
                trigger: {type: object}
                conditions: {type: array, items: {type: object}}
                actions: {type: array, items: {type: object}}
      responses:
        '200':
          description: "Resultado de la validacion"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: {type: boolean}
                      errors: {type: array, items: {type: string}}
                      planned_actions: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /automation-rules/{id}:
    get:
      tags: [automation]
      summary: "Obtener una regla"
      operationId: getAutomationRule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Regla"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [automation]
      summary: "Modificar una regla"
      description: "Con version, una edicion sobre una version antigua responde 409 automation.version_conflict."
      operationId: updateAutomationRule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                enabled: {type: boolean}
                version: {type: integer}
                trigger: {type: object}
                conditions: {type: array, items: {type: object}}
                actions: {type: array, items: {type: object}}
      responses:
        '200':
          description: "Regla actualizada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [automation]
      summary: "Eliminar una regla y su historial"
      operationId: deleteAutomationRule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Regla eliminada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automation-rules/{id}/enable:
    post:
      tags: [automation]
      summary: "Activar una regla"
      operationId: enableAutomationRule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Regla activada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automation-rules/{id}/disable:
    post:
      tags: [automation]
      summary: "Desactivar una regla"
      operationId: disableAutomationRule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Regla desactivada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AutomationRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automation-rules/{id}/runs:
    get:
      tags: [automation]
      summary: "Ejecuciones de una regla"
      operationId: listAutomationRuns
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [success, skipped, failed]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: "Ejecuciones, la mas reciente primero"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AutomationRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/import/csv:
    post:
      tags: [import-export]
      summary: "Subir un CSV y obtener la vista previa"
      description: "Multipart con el campo file (maximo 10 MiB, UTF-8 con o sin BOM, delimitador detectado). Requiere edit_project. Codigos: import.file_too_large, import.invalid_encoding, import.empty_file, import.too_many_rows, import.invalid_csv."
      operationId: uploadImportCsv
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: "Vista previa y trabajo creado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ImportPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/import/csv/{job}/start:
    post:
      tags: [import-export]
      summary: "Iniciar la importacion con el mapeo final"
      description: "Con dry_run solo se validan las filas. Codigos: import.invalid_mapping, import.already_started (409)."
      operationId: startImportCsv
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: job, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  additionalProperties: {type: string}
                dry_run: {type: boolean}
      responses:
        '202':
          description: "Importacion encolada"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/import/jobs:
    get:
      tags: [import-export]
      summary: "Importaciones de un proyecto"
      operationId: listImportJobs
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Importaciones, la mas reciente primero"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project}/import/jobs/{job}:
    get:
      tags: [import-export]
      summary: "Progreso de una importacion"
      description: "Incluye los primeros 50 errores por fila; el informe completo se descarga en errors.csv."
      operationId: getImportJob
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: job, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Importacion"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project}/import/jobs/{job}/errors.csv:
    get:
      tags: [import-export]
      summary: "Informe de errores por fila en CSV"
      operationId: downloadImportErrors
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: job, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "CSV con las columnas fila y errores"
          content:
            text/csv:
              schema:
                type: string
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project}/export/issues.csv:
    get:
      tags: [import-export]
      summary: "Exportar las incidencias de un proyecto a CSV"
      description: "Filtro CoreQL opcional. Requiere export_issues; solo incluye lo que el usuario puede ver. Las celdas que empiezan por = + - @ se prefijan con una comilla simple."
      operationId: exportProjectIssuesCsv
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: filter, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: "CSV de incidencias"
          content:
            text/csv:
              schema:
                type: string
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /projects/{project}/export/project.json:
    get:
      tags: [import-export]
      summary: "Copia de seguridad completa de un proyecto en JSON"
      description: "Proyecto, incidencias, comentarios, registros de trabajo y vinculos con limites de tamano (truncated indica recorte). Solo responsables y administradores (edit_project)."
      operationId: exportProjectJson
      parameters:
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "Copia en JSON"
          content:
            application/json:
              schema:
                type: object
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NotificationProjectId:
      name: project
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationOrgId:
      name: org
      in: path
      required: true
      schema: {type: string, format: uuid}
    AuditActor:
      name: actor
      in: query
      required: false
      schema: {type: string, format: uuid}
      description: Filtra por el usuario que hizo la accion.
    AuditEntityType:
      name: entity_type
      in: query
      required: false
      schema: {type: string, maxLength: 64}
    AuditAction:
      name: action
      in: query
      required: false
      schema: {type: string, maxLength: 64, example: org.updated}
    AuditFrom:
      name: from
      in: query
      required: false
      schema: {type: string}
      description: Desde (inclusive), AAAA-MM-DD o RFC 3339.
    AuditTo:
      name: to
      in: query
      required: false
      schema: {type: string}
      description: Hasta (una fecha sola incluye ese dia completo), AAAA-MM-DD o RFC 3339.
    AuditCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
      description: Cursor opaco de meta.next_cursor.
    AuditLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IssueRef:
      name: id
      in: path
      required: true
      description: >-
        UUID o clave legible de la incidencia (por ejemplo CORE-12). Con una clave, la busqueda se limita a las
        incidencias visibles para el usuario; si la clave existe en varias organizaciones del usuario y no se indica
        organization_id responde 409 (codigo issue.key_ambiguous). Una clave desconocida responde 404 (issue.not_found)
        y un valor que no es UUID ni clave responde 422 (issue.invalid_id).
      schema:
        type: string
        example: CORE-12
    IssueOrganizationId:
      name: organization_id
      in: query
      required: false
      description: Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario; se ignora cuando es un UUID.
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: The user's unique identifier
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: The team's unique identifier
      schema:
        type: string
        format: uuid
    TeamUserId:
      name: user_id
      in: path
      required: true
      description: The user's unique identifier (a member of the team)
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: org
      in: path
      required: true
      description: The organization's unique identifier. Non-members get 404.
      schema:
        type: string
        format: uuid
    OrganizationUserId:
      name: user_id
      in: path
      required: true
      description: The user's unique identifier (a member of the organization)
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      description: The invitation's unique identifier
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: The plain invitation token received in the invitation link
      schema:
        type: string
        minLength: 1
  responses:
    NotificationScheme:
      description: Esquema de notificaciones en vigor
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/NotificationScheme'}
    RateLimited:
      description: Demasiadas solicitudes (auth.rate_limited) o cuenta bloqueada temporalmente (auth.account_locked). Incluye Retry-After en segundos.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuditPage:
      description: Pagina de entradas de auditoria
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
              meta:
                type: object
                properties:
                  next_cursor: {type: string, nullable: true}
    AuditCsv:
      description: CSV con columnas id, fecha, actor, accion, entidad, id_entidad, resumen, ip, id_peticion
      content:
        text/csv:
          schema: {type: string}
    Unauthorized:
      description: The request is missing a valid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No resource exists with the given identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoteNotFound:
      description: La nota no existe, fue borrada o pertenece a otro usuario (note.not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoteLinkForbidden:
      description: El elemento a vincular no existe o el usuario no puede verlo (note.link_forbidden)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The operation conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiToken:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string, description: Primeros caracteres del token para reconocerlo}
        scopes: {type: array, items: {type: string, enum: [read, write, admin]}}
        expires_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        token: {type: string, description: Token en claro; solo aparece en la respuesta de creacion}
    Webhook:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid, nullable: true}
        name: {type: string}
        url: {type: string}
        events: {type: array, items: {type: string}}
        filter_query: {type: string, nullable: true}
        enabled: {type: boolean}
        created_by: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        secret: {type: string, description: Secreto de firma; solo aparece al crear}
    WebhookDelivery:
      type: object
      properties:
        id: {type: string, format: uuid}
        webhook_id: {type: string, format: uuid}
        event_id: {type: integer, nullable: true}
        event: {type: string}
        payload: {type: object, description: 'Sobre v1: version, id, event, occurred_at, organization_id, project, issue, actor, changes'}
        status: {type: string, enum: [pending, success, failed, dead]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time, nullable: true}
        response_status: {type: integer, nullable: true}
        response_excerpt: {type: string}
        duration_ms: {type: integer}
        created_at: {type: string, format: date-time}
    AutomationRuleInput:
      type: object
      required: [name, trigger, actions]
      properties:
        name: {type: string, maxLength: 120}
        enabled: {type: boolean}
        trigger:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [issue_created, issue_updated, issue_transitioned, comment_added, sprint_started, sprint_completed, scheduled]}
            field: {type: string}
            from: {type: string}
            to: {type: string}
            every_minutes: {type: integer, minimum: 5}
            query: {type: string}
        conditions:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: {type: string, enum: [query, field_equals, field_in, actor_role, issue_type]}
              query: {type: string}
              field: {type: string}
              value: {type: string}
              values: {type: array, items: {type: string}}
              role: {type: string}
        actions:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: {type: string, enum: [transition_issue, assign_issue, set_field, add_comment, add_label, remove_label, create_subtask, send_webhook, send_notification]}
              status: {type: string}
              who: {type: string}
              user_id: {type: string}
              team_id: {type: string}
              field: {type: string}
              value: {type: string}
              text: {type: string}
              label: {type: string}
              url: {type: string}
    AutomationRule:
      allOf:
        - $ref: '#/components/schemas/AutomationRuleInput'
        - type: object
          properties:
            id: {type: string, format: uuid}
            organization_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid, nullable: true}
            created_by: {type: string, format: uuid, nullable: true}
            version: {type: integer}
            run_count: {type: integer}
            last_run_at: {type: string, format: date-time, nullable: true}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    AutomationRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        event_id: {type: integer, nullable: true}
        issue_id: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [success, skipped, failed]}
        detail: {type: string}
        created_at: {type: string, format: date-time}
    ImportPreview:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        columns: {type: array, items: {type: string}}
        sample_rows: {type: array, items: {type: array, items: {type: string}}}
        suggested_mapping: {type: object, additionalProperties: {type: string}}
        total_rows: {type: integer}
        delimiter: {type: string}
    ImportJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        source: {type: string, enum: [csv]}
        status: {type: string, enum: [queued, validating, running, done, failed]}
        total_rows: {type: integer}
        processed_rows: {type: integer}
        created_rows: {type: integer}
        error_rows: {type: integer}
        dry_run: {type: boolean}
        file_name: {type: string}
        mapping: {type: object, additionalProperties: {type: string}}
        errors:
          type: array
          items:
            type: object
            properties:
              row: {type: integer}
              errors: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
    NotificationRecipient:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [reporter, assignee, watchers, project_lead, component_lead, mentioned, reply_target, user, team, role]}
        id: {type: string, format: uuid, description: Solo para user y team}
        role: {type: string, description: Solo para role; nombre de rol del proyecto}
    NotificationRuleInput:
      type: object
      required: [event, recipients, channels]
      properties:
        event: {type: string, enum: [issue_created, issue_assigned, issue_commented, issue_mentioned, issue_transitioned, issue_resolved, issue_updated, comment_edited, worklog_logged, version_released, sprint_started, sprint_completed, filter_subscription]}
        recipients:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/NotificationRecipient'}
        channels:
          type: array
          items: {type: string, enum: [in_app, email]}
    NotificationRule:
      allOf:
        - $ref: '#/components/schemas/NotificationRuleInput'
        - type: object
          properties:
            overridden: {type: boolean, description: La regla es propia de este ambito}
    NotificationSchemeRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: {$ref: '#/components/schemas/NotificationRuleInput'}
    NotificationScheme:
      type: object
      properties:
        scope: {type: string, enum: [project, organization]}
        organization_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid, nullable: true}
        is_default: {type: boolean}
        updated_at: {type: string, format: date-time, nullable: true}
        rules:
          type: array
          items: {$ref: '#/components/schemas/NotificationRule'}
    EmailOutboxEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid, nullable: true}
        to: {type: string, description: Direccion enmascarada}
        kind: {type: string}
        subject: {type: string}
        status: {type: string, enum: [pending, sent, dead]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        sent_at: {type: string, format: date-time, nullable: true}
    ScheduledJob:
      type: object
      properties:
        name: {type: string}
        schedule: {type: string, example: every 10s}
        registered_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_success_at: {type: string, format: date-time, nullable: true}
        last_run:
          type: object
          nullable: true
          properties:
            status: {type: string, enum: [running, ok, error, abandoned]}
            started_at: {type: string, format: date-time}
            finished_at: {type: string, format: date-time, nullable: true}
            duration_ms: {type: integer, nullable: true}
            error: {type: string}
    DashboardCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 120}
        description: {type: string, maxLength: 500}
        layout: {type: string, enum: ['1', '2', '3', 2-1, 1-2], description: Plantilla de columnas (por defecto 2)}
        organization_id: {type: string, format: uuid}
    DashboardUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 120}
        description: {type: string, maxLength: 500}
        layout: {type: string, enum: ['1', '2', '3', 2-1, 1-2]}
        is_default: {type: boolean}
    DashboardGadgetInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, description: Presente en los gadgets que ya existen}
        type: {type: string, enum: [assigned_to_me, created_by_me, filter_results, issue_statistics, pie, two_dimensional, created_vs_resolved, sprint_burndown, activity_stream, recent_projects, favorites, text, calendar_upcoming]}
        title: {type: string, maxLength: 120}
        config:
          type: object
          description: Configuracion del tipo, con valores por defecto y claves desconocidas rechazadas
        column_index: {type: integer, minimum: 0, maximum: 2}
        position: {type: integer, minimum: 0}
    DashboardGadgetsRequest:
      type: object
      required: [gadgets]
      additionalProperties: false
      properties:
        layout: {type: string, enum: ['1', '2', '3', 2-1, 1-2]}
        gadgets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DashboardGadgetInput'
    DashboardSharesRequest:
      type: object
      required: [shares]
      additionalProperties: false
      properties:
        shares:
          type: array
          maxItems: 100
          items:
            type: object
            required: [type, target_id]
            additionalProperties: false
            properties:
              type: {type: string, enum: [user, team, project, organization]}
              target_id: {type: string, format: uuid}
              permission: {type: string, enum: [view, edit]}
    CalendarEventCreate:
      type: object
      required: [title, starts_at, ends_at]
      additionalProperties: false
      properties:
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 8000}
        location: {type: string, maxLength: 300}
        starts_at: {type: string, description: RFC 3339 o AAAA-MM-DD}
        ends_at: {type: string, description: RFC 3339 o AAAA-MM-DD (exclusivo en eventos de dia completo)}
        all_day: {type: boolean}
        timezone: {type: string, example: Europe/Madrid, description: Zona IANA en la que se mantiene la hora de las repeticiones}
        recurrence_rule: {type: string, nullable: true, example: 'FREQ=WEEKLY;BYDAY=MO,WE;COUNT=10'}
        visibility: {type: string, enum: [private, project, organization]}
        color: {type: string, enum: [gray, red, orange, amber, green, teal, blue, indigo, purple, pink]}
        project_id: {type: string, format: uuid, nullable: true}
        organization_id: {type: string, format: uuid, nullable: true}
        attendees:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
    CalendarEventPatch:
      type: object
      additionalProperties: false
      description: Los campos ausentes no cambian; recurrence_rule y project_id aceptan null para borrarlos.
      properties:
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 8000}
        location: {type: string, maxLength: 300}
        starts_at: {type: string}
        ends_at: {type: string}
        all_day: {type: boolean}
        timezone: {type: string}
        recurrence_rule: {type: string, nullable: true}
        visibility: {type: string, enum: [private, project, organization]}
        color: {type: string, enum: [gray, red, orange, amber, green, teal, blue, indigo, purple, pink]}
        project_id: {type: string, format: uuid, nullable: true}
        attendees:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Si el correo esta registrado, recibiras un mensaje con las instrucciones
    ForgotPasswordRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
    ResetPasswordRequest:
      type: object
      required: [token, password, password_confirmation]
      additionalProperties: false
      properties:
        token: {type: string, maxLength: 200, description: Token del enlace recibido por correo}
        password:
          type: string
          description: Minimo 10 caracteres combinando al menos tres clases (o 14 o mas), sin el correo y fuera de las contrasenas comunes
        password_confirmation: {type: string}
    VerifyEmailRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: {type: string, maxLength: 200}
    AuditEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        organization_id: {type: string, format: uuid, nullable: true}
        project_id: {type: string, format: uuid, nullable: true}
        actor_id: {type: string, format: uuid, nullable: true}
        actor_name: {type: string}
        action: {type: string, example: member.role_changed}
        entity_type: {type: string, example: member}
        entity_id: {type: string, format: uuid, nullable: true}
        summary: {type: string, description: Resumen en espanol}
        before: {type: object, nullable: true, additionalProperties: true}
        after: {type: object, nullable: true, additionalProperties: true}
        ip: {type: string, description: Direccion anonimizada (IPv4 /24, IPv6 /48)}
        user_agent: {type: string}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    Sprint:
      type: object
      required: [id, project_id, name, goal, status]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        board_id: {type: string, format: uuid, nullable: true}
        name: {type: string}
        goal: {type: string}
        status: {type: string, enum: [planned, active, closed]}
        start_date: {type: string, format: date, nullable: true}
        end_date: {type: string, format: date, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        closed_at: {type: string, format: date-time, nullable: true, description: Igual que completed_at}
        committed_points: {type: number, nullable: true, description: Puntos del alcance al iniciar}
        completed_points: {type: number, nullable: true, description: Puntos completados al cerrar}
      example:
        id: 5d1c7b6e-3f0a-4c58-8d0e-2e4b9a7c3333
        project_id: 9a0c1f10-2b3c-4d5e-8f60-71829304a5b6
        board_id: null
        name: Sprint 12
        goal: Estabilizar la API
        status: closed
        start_date: '2026-11-02'
        end_date: '2026-11-13'
        started_at: '2026-11-02T09:00:00Z'
        completed_at: '2026-11-13T17:30:00Z'
        closed_at: '2026-11-13T17:30:00Z'
        committed_points: 21
        completed_points: 18
    SprintVelocityPoint:
      type: object
      properties:
        sprint_id: {type: string, format: uuid}
        name: {type: string}
        points: {type: number}
    SprintCompletion:
      type: object
      properties:
        sprint: {$ref: '#/components/schemas/Sprint'}
        next_sprint: {allOf: [{$ref: '#/components/schemas/Sprint'}], nullable: true, description: Sprint de destino cuando destination es new o sprint:<id>}
        completed_issues: {type: integer}
        moved_issues: {type: integer}
        completed_points: {type: number}
        committed_points: {type: number}
    SprintReportIssue:
      type: object
      properties:
        issue_id: {type: string, format: uuid}
        key: {type: string, example: SPR-12}
        summary: {type: string}
        points: {type: number, nullable: true, description: Puntos en el momento relevante}
        status_category: {type: string, enum: [todo, in_progress, done]}
        added_after_start: {type: boolean}
        removed_at: {type: string, format: date-time, description: Solo en removed}
        removed_kind: {type: string, enum: [removed, moved_out], description: Solo en removed}
    SprintReport:
      type: object
      properties:
        sprint: {$ref: '#/components/schemas/Sprint'}
        committed_points: {type: number}
        completed_points: {type: number}
        incomplete_points: {type: number}
        added_points: {type: number}
        removed_points: {type: number}
        completed: {type: array, items: {$ref: '#/components/schemas/SprintReportIssue'}}
        incomplete: {type: array, items: {$ref: '#/components/schemas/SprintReportIssue'}}
        removed: {type: array, items: {$ref: '#/components/schemas/SprintReportIssue'}}
        added_after_start: {type: array, items: {$ref: '#/components/schemas/SprintReportIssue'}}
        burndown:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              ideal: {type: number, nullable: true}
              remaining: {type: number}
              scope: {type: number}
              completed: {type: number}
        velocity: {type: array, items: {$ref: '#/components/schemas/SprintVelocityPoint'}}
      example:
        sprint: {id: 5d1c7b6e-3f0a-4c58-8d0e-2e4b9a7c3333, name: Sprint 12, status: closed}
        committed_points: 10
        completed_points: 5
        incomplete_points: 15
        added_points: 8
        removed_points: 0
        completed: [{issue_id: 0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a1111, key: SPR-1, summary: A, points: 5, status_category: done, added_after_start: false}]
        incomplete: [{issue_id: 0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a2222, key: SPR-4, summary: D, points: 8, status_category: todo, added_after_start: true}]
        removed: []
        added_after_start: [{issue_id: 0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a2222, key: SPR-4, summary: D, points: 8, status_category: todo, added_after_start: true}]
        burndown: [{date: '2026-11-02', ideal: 10, remaining: 10, scope: 10, completed: 0}]
        velocity: [{sprint_id: 5d1c7b6e-3f0a-4c58-8d0e-2e4b9a7c3333, name: Sprint 12, points: 5}]
    BacklogTotals:
      type: object
      properties:
        issues: {type: integer}
        points: {type: number}
        original_estimate_seconds: {type: integer}
        by_category:
          type: object
          description: Claves todo, in_progress y done, cada una con issues, points y original_estimate_seconds
          additionalProperties:
            type: object
            properties:
              issues: {type: integer}
              points: {type: number}
              original_estimate_seconds: {type: integer}
    BacklogIssue:
      type: object
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        summary: {type: string}
        issue_type: {type: string}
        issue_type_name: {type: string}
        issue_type_icon: {type: string}
        issue_type_color: {type: string}
        status: {type: string}
        status_name: {type: string}
        status_category: {type: string, enum: [todo, in_progress, done]}
        priority: {type: string}
        priority_name: {type: string}
        priority_icon: {type: string}
        priority_color: {type: string}
        assignee_id: {type: string, format: uuid, nullable: true}
        assignee_name: {type: string}
        story_points: {type: number, nullable: true}
        original_estimate_seconds: {type: integer, nullable: true}
        rank: {type: string}
        epic_id: {type: string, format: uuid, nullable: true}
        epic_key: {type: string}
        epic_summary: {type: string}
        flagged: {type: boolean}
        labels:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              color: {type: string}
    BacklogSection:
      type: object
      properties:
        kind: {type: string, enum: [active, planned, backlog]}
        sprint: {allOf: [{$ref: '#/components/schemas/Sprint'}], nullable: true, description: Null en la seccion backlog}
        issues: {type: array, items: {$ref: '#/components/schemas/BacklogIssue'}}
        totals: {$ref: '#/components/schemas/BacklogTotals'}
    Backlog:
      type: object
      properties:
        project_id: {type: string, format: uuid}
        sections: {type: array, items: {$ref: '#/components/schemas/BacklogSection'}}
        epics:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              key: {type: string}
              summary: {type: string}
              status: {type: string, enum: [todo, in_progress, done]}
              total: {type: integer}
              done: {type: integer}
              points: {type: number}
              done_points: {type: number}
              progress: {type: number, description: Fraccion de hijas terminadas, de 0 a 1}
        can_manage_sprints: {type: boolean}
        can_move_cards: {type: boolean}
        truncated: {type: boolean}
      example:
        project_id: 9a0c1f10-2b3c-4d5e-8f60-71829304a5b6
        sections:
          - kind: active
            sprint: {id: 5d1c7b6e-3f0a-4c58-8d0e-2e4b9a7c3333, name: Sprint 12, status: active}
            issues: [{id: 0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a1111, key: SPR-1, summary: Pagar con tarjeta, status_category: todo, story_points: 5, rank: m, labels: []}]
            totals: {issues: 1, points: 5, original_estimate_seconds: 0, by_category: {todo: {issues: 1, points: 5, original_estimate_seconds: 0}, in_progress: {issues: 0, points: 0, original_estimate_seconds: 0}, done: {issues: 0, points: 0, original_estimate_seconds: 0}}}
          - kind: backlog
            sprint: null
            issues: []
            totals: {issues: 0, points: 0, original_estimate_seconds: 0, by_category: {}}
        epics: [{id: 0b6f2a40-5c1e-4a3e-9d57-7c1a2a9a9999, key: SPR-9, summary: Pagos, status: in_progress, total: 4, done: 1, points: 13, done_points: 3, progress: 0.25}]
        can_manage_sprints: true
        can_move_cards: true
        truncated: false
    TwoFactorChallenge:
      type: object
      description: Reto de inicio de sesion. El token caduca a los 5 minutos y solo sirve para /auth/login/2fa.
      required: [two_factor_required, challenge_token]
      properties:
        two_factor_required:
          type: boolean
          enum: [true]
        challenge_token:
          type: string
    TwoFactorLoginRequest:
      type: object
      description: Indica exactamente uno de code o recovery_code.
      required: [challenge_token]
      additionalProperties: false
      properties:
        challenge_token:
          type: string
        code:
          type: string
          maxLength: 16
          description: Codigo de 6 digitos de la aplicacion de autenticacion
        recovery_code:
          type: string
          maxLength: 64
          description: Codigo de recuperacion de 10 caracteres (guiones y mayusculas se ignoran)
    TwoFactorStatus:
      type: object
      required: [enabled, enabled_at, recovery_codes_remaining]
      properties:
        enabled:
          type: boolean
        enabled_at:
          type: string
          format: date-time
          nullable: true
        recovery_codes_remaining:
          type: integer
          minimum: 0
    TwoFactorEnrollment:
      type: object
      description: Se devuelve una sola vez. El secreto no vuelve a mostrarse.
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Secreto en base32 para introducir manualmente
        otpauth_uri:
          type: string
          description: URI otpauth:// para generar el codigo QR
    TwoFactorCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 16
          description: Codigo de 6 digitos de la aplicacion de autenticacion
    TwoFactorDisableRequest:
      type: object
      description: Requiere la contrasena actual y un codigo de la aplicacion o un codigo de recuperacion.
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
        code:
          type: string
          maxLength: 16
        recovery_code:
          type: string
          maxLength: 64
    RecoveryCodes:
      type: object
      description: Codigos de recuperacion de un solo uso, mostrados una sola vez.
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
    Role:
      type: string
      enum: [admin, user]
      description: Platform role. The first account created on an empty installation is admin; every other account is user.
    IssueStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    IssuePriority:
      type: string
      enum: [low, medium, high, critical]
    IssueType:
      type: string
      enum: [task, bug, story, epic, subtask]
    RegisterRequest:
      type: object
      description: |
        Alta de cuenta. Envia first_name y last_name; el campo heredado name sigue aceptandose (se divide en
        nombre y apellido) solo cuando first_name viene vacio. password_confirmation debe ser identico a
        password (sin recortar espacios) y se comprueba antes que la politica de contrasena: si no coincide
        responde 422 user.password_mismatch con detalle en password_confirmation y no se crea la cuenta.
      required: [email, password, password_confirmation]
      properties:
        first_name:
          type: string
          maxLength: 80
          example: Ada
          description: Nombre (1-80). Solo letras, espacios, guiones y apostrofes. Error 422 user.invalid_name.
        last_name:
          type: string
          maxLength: 120
          example: Lovelace
          description: Apellido (1-120), mismo alfabeto que el nombre. Obligatorio si se envia first_name.
        name:
          type: string
          maxLength: 120
          example: Ada Lovelace
          description: Heredado. Nombre completo; se divide en first_name y last_name. Se ignora si hay first_name.
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
          description: Debe ser exactamente igual a password. Si falta o difiere, 422 user.password_mismatch (Las contraseñas no coinciden).
        phone:
          $ref: '#/components/schemas/PhoneInput'
        locale:
          type: string
          example: es
          description: Idioma de la interfaz (es, en, es-PE). Por defecto es.
        consents:
          type: array
          description: >-
            Versiones aceptadas de los documentos legales. Deben cubrir todos los documentos obligatorios vigentes
            (privacy_policy, data_processing, terms_of_use) en su version actual; si falta alguno, 422
            legal.consent_required con los slugs que faltan en details. communications es opcional. Los
            consentimientos se guardan en la misma transaccion que la cuenta.
          items:
            $ref: '#/components/schemas/ConsentRef'
    PhoneInput:
      type: object
      required: [country, number]
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: PE
          description: Codigo ISO 3166-1 alpha-2 (ver GET /meta/countries).
        number:
          type: string
          maxLength: 32
          example: "+51 912 345 678"
          description: Numero nacional o con prefijo internacional (+51 o 0051). Se admiten espacios, guiones, puntos y parentesis. Error 422 user.invalid_phone.
    Phone:
      type: object
      description: Telefono del usuario. Solo lo ven el propio usuario y los administradores o propietarios de la organizacion; para los demas el campo se omite.
      required: [country, number, e164, verified]
      properties:
        country:
          type: string
          example: PE
        number:
          type: string
          example: "912345678"
          description: Numero nacional significativo (solo digitos).
        e164:
          type: string
          example: "+51912345678"
        verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          description: Presente solo cuando el telefono esta verificado.
    Country:
      type: object
      required: [code, name, dial_code]
      properties:
        code:
          type: string
          example: PE
        name:
          type: string
          example: Perú
        dial_code:
          type: string
          example: "+51"
        example:
          type: string
          example: "912345678"
          description: Numero nacional de ejemplo, cuando se conoce.
        areas:
          type: array
          items:
            type: string
          description: Codigos de area NANP permitidos para paises que comparten +1 (por ejemplo DO 809, 829, 849).
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre completo (first_name + last_name); se mantiene sincronizado.
        first_name:
          type: string
        last_name:
          type: string
        locale:
          type: string
          example: es
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        display_name:
          type: string
        job_title:
          type: string
        department:
          type: string
        avatar_key:
          type: string
          nullable: true
        timezone:
          type: string
          default: UTC
          description: IANA time zone name (for example America/Bogota). Defaults to UTC.
        team_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
    UpdateProfileRequest:
      type: object
      description: Partial update. Omitted fields keep their current value.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Heredado. Se divide en first_name y last_name; se ignora si se envia first_name o last_name.
        first_name:
          type: string
          maxLength: 80
          description: Error 422 user.invalid_name si tiene digitos o simbolos.
        last_name:
          type: string
          maxLength: 120
        phone:
          allOf:
            - $ref: '#/components/schemas/PhoneInput'
          nullable: true
          description: Omitido conserva el telefono; null lo elimina; un objeto lo reemplaza y borra la verificacion.
        locale:
          type: string
          maxLength: 10
          description: Idioma (es, en, es-PE). Error 422 user.locale_invalid.
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
        job_title:
          type: string
          maxLength: 120
        department:
          type: string
          maxLength: 120
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone name. Invalid values answer 422 (code user.timezone_invalid).
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
        new_password_confirmation:
          type: string
          format: password
          description: Debe ser exactamente igual a new_password. Si falta o difiere, 422 user.password_mismatch y la contrasena actual sigue vigente.
    SetTeamRequest:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          nullable: true
          description: Set to null to remove the user from their current team.
    Team:
      type: object
      required: [id, organization_id, name, description, avatar_color, created_by, created_at, updated_at, member_count, my_role]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        avatar_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#1F6FEB'
          description: Hex color (#RRGGBB), or null when no color is set.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The user who created the team, or null when unknown.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        member_count:
          type: integer
          minimum: 0
          description: Número de miembros del equipo.
        my_role:
          type: string
          nullable: true
          enum: [maintainer, member]
          description: Rol del usuario autenticado en el equipo (maintainer o member), o null si no es miembro del equipo.
    TeamMemberRole:
      type: string
      enum: [maintainer, member]
    TeamMember:
      type: object
      required: [team_id, user_id, role, created_at]
      properties:
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/TeamMemberRole'
        created_at:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      required: [organization_id, name]
      additionalProperties: false
      properties:
        organization_id:
          type: string
          format: uuid
          description: Organization that owns the team.
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        avatar_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color (#RRGGBB) or null.
    UpdateTeamRequest:
      type: object
      description: Partial update. Omitted fields keep their current value.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        avatar_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color (#RRGGBB) or null.
    AddTeamMemberRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/TeamMemberRole'
          default: member
    UpdateTeamMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/TeamMemberRole'
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
        type:
          type: string
          enum: [kanban, scrum]
        organization_id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [private, open]
        template:
          $ref: '#/components/schemas/ProjectTemplate'
        color:
          type: string
          maxLength: 20
          example: blue
        icon:
          type: string
          maxLength: 40
          example: rocket
        default_assignee_policy:
          type: string
          enum: [unassigned, lead]
          description: Quien recibe una incidencia creada sin responsable. unassigned la deja sin asignar; lead la asigna al lider.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Momento del archivado, o null si el proyecto esta activo.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectTemplate:
      type: string
      enum: [scrum, kanban, task_tracking, bug_tracking]
      description: >-
        Plantilla del proyecto. Define el tablero, los estados, los tipos de incidencia y si hay sprints
        (solo scrum). task_tracking y bug_tracking son proyectos de tipo kanban.
      example: kanban
    ArchiveFilter:
      type: string
      enum: [exclude, include, only]
      default: exclude
      description: exclude oculta los archivados, include los incluye y only muestra solo los archivados.
    ProjectListMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 25
        total:
          type: integer
          minimum: 0
          description: Numero de proyectos que cumplen los filtros, en todas las paginas.
          example: 3
    ProjectKeyAvailability:
      type: object
      required: [available, key]
      properties:
        available:
          type: boolean
          description: true si la clave es valida y no la usa ningun proyecto activo de la organizacion.
          example: true
        key:
          type: string
          description: Clave normalizada (sin espacios y en mayusculas).
          example: CORE
    DeleteProjectRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Nombre exacto del proyecto. Debe coincidir con el nombre guardado.
          example: Plataforma Core
    WorkflowStatus:
      type: object
      properties:
        id: {type: string, format: uuid, description: Identificador del estado de la organizacion.}
        name: {type: string, example: En curso}
        category: {type: string, enum: [todo, in_progress, done]}
        position: {type: integer, minimum: 0, description: Posicion del estado en el flujo.}
        issue_count: {type: integer, minimum: 0, description: Incidencias del proyecto que estan en este estado.}
    WorkflowRule:
      type: object
      required: [type]
      properties:
        type: {type: string, example: set_resolution, description: Tipo de regla del motor de transiciones.}
        params: {type: object, description: Parametros de la regla.}
    WorkflowTransition:
      type: object
      description: >-
        Transicion en el formato de definicion del motor. En las respuestas from y to son identificadores de estado;
        en las peticiones son refs de los estados de la misma peticion.
      properties:
        id: {type: string, example: complete}
        name: {type: string, example: Completar}
        from: {type: array, items: {type: string}, description: Vacio significa desde cualquier estado distinto de to.}
        to: {type: string}
        conditions: {type: array, items: {$ref: '#/components/schemas/WorkflowRule'}}
        validators: {type: array, items: {$ref: '#/components/schemas/WorkflowRule'}}
        post_functions: {type: array, items: {$ref: '#/components/schemas/WorkflowRule'}}
        required_fields: {type: array, items: {type: string}}
    WorkflowView:
      type: object
      properties:
        statuses: {type: array, items: {$ref: '#/components/schemas/WorkflowStatus'}}
        initial_status_id: {type: string, format: uuid}
        transitions: {type: array, items: {$ref: '#/components/schemas/WorkflowTransition'}}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        is_template_default: {type: boolean, description: Indica si el flujo es igual al de su plantilla.}
    WorkflowIssue:
      type: object
      properties:
        path: {type: string, example: 'transitions[3].to'}
        code: {type: string, example: workflow.unknown_status}
        message: {type: string, description: Mensaje en espanol.}
    WorkflowMappingRequirement:
      type: object
      properties:
        status_id: {type: string, format: uuid}
        name: {type: string}
        issue_count: {type: integer, minimum: 1}
    WorkflowWarning:
      allOf:
        - $ref: '#/components/schemas/WorkflowIssue'
    WorkflowSaveResponse:
      allOf:
        - $ref: '#/components/schemas/WorkflowView'
        - type: object
          properties:
            warnings: {type: array, items: {$ref: '#/components/schemas/WorkflowWarning'}}
    WorkflowValidation:
      type: object
      properties:
        valid: {type: boolean}
        errors: {type: array, items: {$ref: '#/components/schemas/WorkflowIssue'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/WorkflowWarning'}}
        mapping_required: {type: array, items: {$ref: '#/components/schemas/WorkflowMappingRequirement'}}
    WorkflowStatusInput:
      type: object
      required: [ref]
      properties:
        ref: {type: string, maxLength: 64, description: Nombre local del estado dentro de la peticion; las transiciones lo usan.}
        id: {type: string, format: uuid, description: Estado existente de la organizacion. Sin id se busca por nombre o se crea.}
        name: {type: string, maxLength: 60, description: Obligatorio para estados nuevos.}
        category: {type: string, enum: [todo, in_progress, done]}
    WorkflowDefinitionRequest:
      type: object
      required: [expected_version, statuses, transitions]
      properties:
        expected_version: {type: integer, minimum: 1, description: Version del flujo que se edita (no aplica a validate).}
        initial_ref: {type: string, description: Ref del estado inicial.}
        statuses: {type: array, items: {$ref: '#/components/schemas/WorkflowStatusInput'}}
        transitions: {type: array, items: {$ref: '#/components/schemas/WorkflowTransition'}}
        status_mapping:
          type: object
          additionalProperties: {type: string, format: uuid}
          description: Mapa de estado eliminado a estado destino, con identificadores UUID.
    WorkflowResetRequest:
      type: object
      required: [template, expected_version]
      properties:
        template: {type: string, enum: [scrum, kanban, task_tracking, bug_tracking]}
        expected_version: {type: integer, minimum: 1}
        status_mapping:
          type: object
          additionalProperties: {type: string, format: uuid}
    WorkflowMigrationRequest:
      type: object
      required: [status_mapping]
      properties:
        status_mapping:
          type: object
          additionalProperties: {type: string, format: uuid}
          description: Mapa de estado origen a estado destino. El destino debe estar en el flujo del proyecto.
    WorkflowMigrationResult:
      type: object
      properties:
        moved: {type: integer, minimum: 0}
        moves:
          type: array
          items:
            type: object
            properties:
              from_status_id: {type: string, format: uuid}
              to_status_id: {type: string, format: uuid}
              issue_count: {type: integer, minimum: 0}
    WorkflowTemplate:
      type: object
      properties:
        id: {type: string, enum: [scrum, kanban, task_tracking, bug_tracking]}
        name: {type: string, example: Seguimiento de tareas}
        description: {type: string}
        definition:
          type: object
          properties:
            initial_ref: {type: string, example: todo}
            statuses:
              type: array
              items:
                type: object
                properties:
                  ref: {type: string}
                  name: {type: string}
                  category: {type: string, enum: [todo, in_progress, done]}
            transitions: {type: array, items: {$ref: '#/components/schemas/WorkflowTransition'}}
    OrganizationStatus:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: Bloqueado}
        category: {type: string, enum: [todo, in_progress, done]}
        position: {type: integer, minimum: 0}
    OrganizationStatusCreateRequest:
      type: object
      required: [name, category]
      properties:
        name: {type: string, maxLength: 60}
        category: {type: string, enum: [todo, in_progress, done]}
    OrganizationStatusPatchRequest:
      type: object
      properties:
        name: {type: string, maxLength: 60}
        category: {type: string, enum: [todo, in_progress, done]}
    OrganizationStatusReorderRequest:
      type: object
      required: [status_ids]
