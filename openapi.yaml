openapi: 3.0.3
info:
  title: CoreLog API
  description: Incident and issue management API for CoreLog.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: auth
    description: Registration and authentication
  - name: users
    description: User identity, profile, and directory search
  - name: teams
    description: Team management and membership
  - name: organizations
    description: Organizations, members, roles and ownership
  - name: invitations
    description: Invitations to join an organization
  - name: favorites
    description: Starred elements and recently viewed elements
  - name: notes
    description: Notas personales privadas del usuario
  - name: issues
    description: Gestion de incidencias (issues) con clave legible por proyecto
  - name: boards
    description: Tableros por proyecto, columnas, carriles, filtros rapidos y movimiento de tarjetas
  - name: workflows
    description: Flujo de trabajo por proyecto, plantillas y catalogo de estados de la organizacion
  - name: health
    description: Service liveness
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a user account
      description: The account gets the role user. The first account created on an empty installation becomes admin.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email address is already registered (code auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive an access token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Credenciales correctas. Si la cuenta tiene autenticacion en dos pasos activa, la respuesta es un
            reto (two_factor_required=true) y no abre sesion; el cliente debe llamar a /auth/login/2fa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthSession'
                      - $ref: '#/components/schemas/TwoFactorChallenge'
        '401':
          description: The email or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login/2fa:
    post:
      tags: [auth]
      summary: Completar el inicio de sesion con el codigo de la aplicacion o un codigo de recuperacion
      operationId: loginSecondFactor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorLoginRequest'
      responses:
        '200':
          description: Codigo correcto; devuelve la sesion como el login normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          description: El reto ha caducado, ya se uso o agoto sus intentos (auth.challenge_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Codigo incorrecto (auth.two_factor_invalid) o falta el codigo (auth.two_factor_required), o datos
            invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa:
    get:
      tags: [auth]
      summary: Estado de la autenticacion en dos pasos del usuario actual
      operationId: getTwoFactorStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/2fa/enroll:
    post:
      tags: [auth]
      summary: Iniciar la configuracion de la autenticacion en dos pasos (devuelve el secreto una sola vez)
      operationId: enrollTwoFactor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Secreto pendiente de confirmar; la autenticacion aun no esta activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos ya esta activada (auth.two_factor_already_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/confirm:
    post:
      tags: [auth]
      summary: Confirmar la configuracion con un codigo y activar la autenticacion en dos pasos
      operationId: confirmTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Activada; devuelve los codigos de recuperacion una sola vez
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No hay configuracion pendiente (auth.two_factor_not_enrolled) o ya esta activada (auth.two_factor_already_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/disable:
    post:
      tags: [auth]
      summary: Desactivar la autenticacion en dos pasos (contrasena actual y codigo o codigo de recuperacion)
      operationId: disableTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
      responses:
        '204':
          description: Desactivada; se eliminan el secreto y los codigos de recuperacion
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos no esta activada (auth.two_factor_not_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid), falta el codigo (auth.two_factor_required) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa/recovery-codes:
    post:
      tags: [auth]
      summary: Regenerar los codigos de recuperacion (invalida los anteriores)
      operationId: regenerateTwoFactorRecoveryCodes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: Nuevos codigos de recuperacion, mostrados una sola vez
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La autenticacion en dos pasos no esta activada (auth.two_factor_not_enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Codigo incorrecto (auth.two_factor_invalid) o datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [users]
      summary: Cerrar la sesion actual (revoca el token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: La sesion se cerro; el token deja de ser valido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [users]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      summary: Update the current user's profile
      description: >-
        Partial update: omitted fields keep their value. An invalid timezone answers 422 (code user.timezone_invalid).
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The email address is already registered to another account (code auth.email_taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/password:
    post:
      tags: [users]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed successfully
        '401':
          description: Not authenticated, or the supplied current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/deactivate:
    post:
      tags: [users]
      summary: Desactivar la cuenta propia (borrado logico)
      description: >-
        Requiere la contrasena actual. La cuenta deja de poder iniciar sesion y todas sus sesiones
        quedan revocadas. Los datos se conservan para no romper el historial de incidencias. La cuenta
        se retira de las organizaciones, equipos y proyectos, y deja de aparecer en directorios y selectores.
        Si la cuenta es la unica propietaria de una organizacion (no eliminada), la operacion se rechaza
        con 409 (user.sole_owner) hasta que transfiera la propiedad o elimine la organizacion.
      operationId: deactivateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '204':
          description: La cuenta quedo desactivada
        '401':
          description: No autenticado, o la contrasena no coincide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Eres el unico propietario de una organizacion (user.sole_owner). Transfiere la propiedad o eliminala antes de cerrar la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/sessions:
    get:
      tags: [users]
      summary: Listar las sesiones activas de la cuenta propia
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones activas; la marcada como current es la de la peticion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    user_agent: {type: string}
                    created_at: {type: string, format: date-time}
                    last_seen_at: {type: string, format: date-time}
                    current: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/sessions/revoke-others:
    post:
      tags: [users]
      summary: Cerrar todas las sesiones salvo la actual
      operationId: revokeOtherSessions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Las demas sesiones quedaron revocadas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/sessions/{id}:
    delete:
      tags: [users]
      summary: Cerrar una sesion de la cuenta propia
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: La sesion quedo revocada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La sesion no existe o pertenece a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me/avatar:
    put:
      tags: [users]
      summary: Upload the caller's avatar
      description: >-
        Replaces the caller's avatar. The multipart field file must be a PNG, JPEG or WebP image of at most 2 MB. The
        image is converted to a 256x256 PNG before it is stored. The previous avatar file is removed.
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP image, at most 2 MB and 4096 px per side.
      responses:
        '200':
          description: Avatar stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      avatar_url:
                        type: string
                        description: Relative URL of the stored avatar (/users/{id}/avatar).
                        example: /users/3f2a1c9e-8b4d-4e7a-9c1f-2d6b5a7e8f90/avatar
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The file exceeds 2 MB (code user.avatar_too_large).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The multipart body is malformed, the file part is missing, or the file is not a valid PNG, JPEG or WebP image
            (code user.avatar_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [users]
      summary: Delete the caller's avatar
      description: Removes the caller's avatar. Idempotent, so it succeeds when the caller has no avatar.
      operationId: deleteAvatar
      responses:
        '204':
          description: Avatar removed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Get a user's avatar
      description: >-
        Returns the PNG avatar of any user. Any authenticated user may read it. The response carries an ETag and a private
        cache lifetime of one hour; send If-None-Match to receive 304 when the avatar has not changed.
      operationId: getUserAvatar
      responses:
        '200':
          description: The avatar image
          headers:
            ETag:
              description: Strong validator derived from the stored avatar version.
              schema: {type: string}
            Cache-Control:
              description: Always private, max-age=3600.
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              description: Always nosniff.
              schema: {type: string, example: nosniff}
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The client already holds the current avatar (If-None-Match matched the ETag).
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              schema: {type: string, example: nosniff}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user does not have an avatar, or the stored image is missing (code user.avatar_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The user id is not a UUID (code validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /users/search:
    get:
      tags: [users]
      summary: Search the members of an organization
      description: >-
        Pass organization_id. The caller must be a member of that organization, otherwise the answer is
        404 (code organization.not_found). Returns at most 20 users whose name or email matches q.
        Platform administrators may omit organization_id, which keeps the legacy search among their own team;
        every other caller who omits it gets 422 (code validation.failed).
      operationId: searchTeammates
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: organization_id
          in: query
          required: false
          description: Organization whose members are searched. Required for every caller except a platform administrator.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members matching the search query (at most 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or the caller is not a member of it (code organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: organization_id is missing for a non-administrator, or is not a UUID (code validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /users:
    get:
      tags: [users]
      summary: List or search all users
      description: Administrator only. Unlike /users/search, this is not restricted to the caller's own team.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: team_id
          in: query
          required: false
          description: Restrict results to members of this team. Omit to search across every team.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users matching the given filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}/team:
    patch:
      tags: [users]
      summary: Assign or clear a user's team
      description: Administrator only.
      operationId: setUserTeam
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams:
    get:
      tags: [teams]
      summary: List the teams of an organization
      description: Returns the teams of the given organization that the authenticated user can see.
      operationId: listTeams
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organization whose teams are listed.
          schema:
            type: string
            format: uuid
        - name: member_id
          in: query
          required: false
          description: Keeps only the teams of the organization that this user belongs to. Same visibility rules as the list without the filter.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Teams of the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or is not visible to the user (code team.organization_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: organization_id is missing or is not a UUID (code team.organization_required), or member_id is not a UUID (code team.member_id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [teams]
      summary: Create a team in an organization
      description: >-
        Whether the caller may create teams in the organization depends on the organization role and policy
        (code team.creation_not_allowed otherwise).
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The organization policy does not allow the caller to create teams (code team.creation_not_allowed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist (code team.organization_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: A team with this name already exists in the organization (code team.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.name_required, team.description_too_long,
            team.avatar_color_invalid, team.organization_required or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get a team by id
      operationId: getTeam
      responses:
        '200':
          description: The requested team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [teams]
      summary: Update a team
      description: Partial update. Omitted fields keep their current value. Replaces the former rename operation.
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: The updated team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to change this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: A team with this name already exists in the organization (code team.name_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.name_required, team.description_too_long,
            team.avatar_color_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [teams]
      summary: Delete a team
      description: Members of the deleted team are left without a team rather than being deleted themselves.
      operationId: deleteTeam
      responses:
        '204':
          description: The team was deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to delete this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: List the members of a team
      operationId: listTeamMembers
      responses:
        '200':
          description: Members of the team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to see the members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The team does not exist or is not visible to the user (code team.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [teams]
      summary: Add a member to a team
      description: >-
        The user must already belong to the organization of the team (code team.user_not_in_org otherwise).
        When role is omitted the member is added with the role member.
      operationId: addTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamMemberRequest'
      responses:
        '201':
          description: Team member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The user is already a member of the team (code team.member_exists).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes team.user_not_in_org, team.role_invalid, team.user_id_invalid
            or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /teams/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/TeamUserId'
    patch:
      tags: [teams]
      summary: Change the role of a team member
      operationId: updateTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
      responses:
        '200':
          description: Team member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The user is not a member of the team (code team.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The role is not maintainer or member (code team.role_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [teams]
      summary: Remove a member from a team
      operationId: removeTeamMember
      responses:
        '204':
          description: Team member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not allowed to manage members of this team (code team.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The user is not a member of the team (code team.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects:
    get:
      tags: [projects]
      summary: Listar los proyectos de una organizacion
      description: >-
        Devuelve una pagina de los proyectos de la organizacion indicada que el usuario autenticado puede ver.
        Los filtros se combinan con AND. Sin archived, solo se listan los proyectos activos.
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organizacion cuyos proyectos se listan.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Texto que debe aparecer en el nombre o en la clave del proyecto (sin distinguir mayusculas).
          schema:
            type: string
            maxLength: 120
        - name: template
          in: query
          description: Solo proyectos creados con esta plantilla.
          schema:
            $ref: '#/components/schemas/ProjectTemplate'
        - name: type
          in: query
          description: >-
            Alias legado. Con scrum equivale a template=scrum. Con kanban no filtra por si solo, porque agrupa
            varias plantillas; usa template para esos casos.
          schema:
            type: string
            enum: [kanban, scrum]
        - name: lead_id
          in: query
          description: Solo proyectos cuyo lider es este usuario.
          schema:
            type: string
            format: uuid
        - name: starred
          in: query
          description: Si es true, solo los proyectos marcados como favoritos por el usuario.
          schema:
            type: boolean
        - name: archived
          in: query
          description: >-
            exclude (valor por defecto) oculta los archivados; include los muestra junto a los activos; only
            muestra solo los archivados.
          schema:
            $ref: '#/components/schemas/ArchiveFilter'
        - name: sort
          in: query
          description: Columna de orden. Por defecto name.
          schema:
            type: string
            enum: [name, key, created_at, updated_at]
        - name: desc
          in: query
          description: Si es true, orden descendente.
          schema:
            type: boolean
        - name: page
          in: query
          description: Pagina, desde 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Elementos por pagina. Se limita a 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Pagina de proyectos visibles para el usuario, con el total de coincidencias.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/ProjectListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            Un parametro no es valido (codigos project.organization_required, project.invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [projects]
      summary: Crear un proyecto desde una plantilla
      description: >-
        El creador queda como lider. Cualquier miembro de la organizacion puede llamar a este endpoint, pero el
        rol de la organizacion y su politica deciden si el proyecto se crea (codigo project.creation_not_allowed
        en caso contrario). template es obligatoria salvo que se envie el campo legado type. visibility es
        opcional; si falta se aplica el valor por defecto de la organizacion.
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La politica de la organizacion no permite al usuario crear proyectos (codigo project.creation_not_allowed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Ya existe un proyecto activo con esta clave en la organizacion (codigo project.key_taken).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            El cuerpo no es valido. Codigos: project.organization_required, project.invalid_key,
            project.invalid_template, project.invalid_assignee_policy, project.user_not_in_org,
            project.team_not_in_org, validation.failed.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/key-available:
    get:
      tags: [projects]
      summary: Comprobar si una clave de proyecto esta libre
      description: >-
        Normaliza la clave (espacios fuera, mayusculas) y responde si es valida y no la usa ningun proyecto
        activo de la organizacion. Los proyectos eliminados no cuentan.
      operationId: checkProjectKeyAvailability
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          description: Organizacion donde se comprueba la clave.
          schema:
            type: string
            format: uuid
        - name: key
          in: query
          required: true
          description: Clave a comprobar.
          schema:
            type: string
            minLength: 2
            maxLength: 10
            example: CORE
      responses:
        '200':
          description: Resultado de la comprobacion.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectKeyAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La organizacion no existe o el usuario no pertenece a ella (codigo organization.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La organizacion o la clave no son validas (codigos project.organization_required, project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: >-
          Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario; se ignora cuando es un UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Obtener un proyecto
      description: >-
        Devuelve 404 (codigo project.not_found) cuando el proyecto no existe o no es visible para el usuario.
        Con una clave, si existe en varias organizaciones del usuario y no se indica organization_id, responde 409
        (codigo project.key_ambiguous).
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle del proyecto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [projects]
      summary: Actualizar un proyecto
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto esta archivado y no admite cambios (codigo project.archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            El cuerpo no es valido. Codigos: project.invalid_assignee_policy, project.user_not_in_org, validation.failed.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [projects]
      summary: Eliminar un proyecto
      description: >-
        Eliminacion logica. Pueden eliminarlo el lead del proyecto y los owner o admin de la organizacion. El cuerpo
        debe repetir el nombre exacto del proyecto en confirmation; si no coincide, responde 422 con codigo
        project.confirmation_mismatch y no se elimina nada.
      operationId: deleteProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
      responses:
        '204':
          description: Proyecto eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            Falta el cuerpo o confirmation no coincide con el nombre del proyecto (codigo project.confirmation_mismatch).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario.
        schema:
          type: string
          format: uuid
    post:
      tags: [projects]
      summary: Archivar un proyecto
      description: Un proyecto archivado es de solo lectura. Requiere permiso para editar el proyecto.
      operationId: archiveProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Proyecto archivado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto ya estaba archivado (codigo project.already_archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: organization_id
        in: query
        required: false
        description: Opcional. Solo se usa cuando {id} es una clave que existe en varias organizaciones del usuario.
        schema:
          type: string
          format: uuid
    post:
      tags: [projects]
      summary: Restaurar un proyecto archivado
      description: Devuelve el proyecto a estado activo. Requiere permiso para editar el proyecto.
      operationId: restoreProject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Proyecto restaurado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El proyecto no existe o no es visible para el usuario (codigo project.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: El proyecto no estaba archivado (codigo project.not_archived).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: La clave no es valida (codigo project.invalid_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/board:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [projects]
      summary: Get the default board for a project
      description: Incluye can_manage_board, true si el actor puede editar el tablero y sus columnas (lead o administrador global).
      operationId: getProjectBoard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Board columns and their issue cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/cards/{issue_id}/move:
    post:
      tags: [issues]
      operationId: moveBoardCard
      summary: Mover una incidencia a otra columna del tablero
      description: La columna destino define el estado de la incidencia (ADR-004). Requiere permiso de edicion de incidencias y respeta el flujo del proyecto y el limite WIP de la columna.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column_id]
              properties:
                column_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permiso para editar incidencias del proyecto
        '404':
          description: Columna o incidencia no encontrada en el proyecto
        '409':
          description: La columna destino alcanzo su limite WIP o el cambio de estado no esta permitido por el flujo
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/board/columns/{column_id}:
    patch:
      tags: [issues]
      operationId: updateBoardColumnWip
      summary: Fijar o quitar el limite WIP de una columna
      description: Solo el lider del proyecto o el administrador global. Enviar wip_limit null quita el limite.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: column_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wip_limit:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        '200':
          description: Tablero actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Solo lead o administrador global
        '404':
          description: Columna no encontrada en el proyecto
        '422':
          $ref: '#/components/responses/ValidationError'
  /projects/{id}/boards:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: listProjectBoards
      summary: Listar los tableros de un proyecto
      description: El tablero principal va primero. Requiere poder ver el proyecto.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tableros del proyecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BoardSummary'}
              example:
                data:
                  - {id: 7f0c3c2e-6d55-4d44-9c3a-0e1b2c3d4e5f, project_id: 1a2b3c4d-0000-4000-8000-000000000001, name: Tablero principal, type: scrum, is_default: true, column_count: 3, swimlane_mode: none}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [boards]
      operationId: createProjectBoard
      summary: Crear un tablero
      description: Requiere manage_board (lead u org-admin). Sin columnas, crea Por hacer, En curso y Hecho con los estados del flujo agrupados por categoria. El nombre es unico por proyecto sin distinguir mayusculas y un proyecto admite hasta 20 tableros. Un proyecto archivado es de solo lectura (project.archived).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBoardRequest'}
            example:
              name: Sprint de bugs
              type: kanban
              swimlane_mode: assignee
              estimation: issue_count
              columns:
                - {name: Pendiente, status_ids: ['9b1a0000-0000-4000-8000-000000000001']}
                - {name: Hecho, color: green, max_issues: 10, status_ids: ['9b1a0000-0000-4000-8000-000000000004']}
      responses:
        '201':
          description: Tablero creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Nombre repetido (board.name_taken), limite de tableros (board.too_many) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Ajustes o columnas no validos (board.invalid_settings, board.invalid_columns, board.invalid)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: getBoard
      summary: Obtener un tablero con su configuracion
      description: Devuelve ajustes, columnas con sus estados, filtros rapidos, carriles, los estados del flujo y los estados sin columna (unmapped_status_ids, que se muestran en la columna implicita Sin asignar).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [boards]
      operationId: updateBoard
      summary: Editar los ajustes de un tablero
      description: Requiere manage_board. Los campos ausentes no cambian; done_retention_days null quita la retencion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateBoardRequest'}
            example: {name: Tablero del equipo, swimlane_mode: epic, card_fields: [key, type, assignee, points], done_retention_days: 14}
      responses:
        '200':
          description: Tablero actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Nombre repetido (board.name_taken) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [boards]
      operationId: deleteBoard
      summary: Eliminar un tablero
      description: Requiere manage_board. El tablero principal del proyecto no se puede eliminar (board.default_not_deletable).
      security:
        - bearerAuth: []
      responses:
        '204': {description: Tablero eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Tablero principal (board.default_not_deletable) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/columns:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardColumns
      summary: Reemplazar las columnas de un tablero
      description: Reemplazo completo en una transaccion. Las columnas con id se conservan (y sus tarjetas), las demas se crean y las que faltan se eliminan. Reglas - al menos una columna (hasta 20), un estado del flujo del proyecto aparece como mucho en una columna, min_issues <= max_issues. Los estados sin columna se muestran en la columna implicita Sin asignar. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: array
                  items: {$ref: '#/components/schemas/BoardColumnInput'}
            example:
              columns:
                - {id: 5d0e0000-0000-4000-8000-000000000001, name: Por hacer, status_ids: ['9b1a0000-0000-4000-8000-000000000001']}
                - {name: En curso, color: blue, min_issues: 1, max_issues: 4, status_ids: ['9b1a0000-0000-4000-8000-000000000002', '9b1a0000-0000-4000-8000-000000000003']}
      responses:
        '200':
          description: Tablero con las columnas nuevas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Mapeo no valido (board.invalid_columns); details indica la columna y el campo
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/quick-filters:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardQuickFilters
      summary: Reemplazar los filtros rapidos de un tablero
      description: |
        Hasta 20 filtros. La consulta usa una gramatica minima que reemplazara la busqueda avanzada - clausulas unidas con AND:
        assignee = currentUser(), assignee = "nombre", assignee is EMPTY, labels = x, labels in (a, b), priority in (a, b), type = x, status = x, text ~ "texto", flagged = true. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quick_filters]
              properties:
                quick_filters:
                  type: array
                  items: {$ref: '#/components/schemas/BoardQueryInput'}
            example:
              quick_filters:
                - {name: Mis incidencias, query: 'assignee = currentUser()'}
                - {name: Prioridad alta, query: 'priority in (Alta, Crítica)'}
      responses:
        '200':
          description: Tablero con los filtros nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Consulta no valida (board.invalid_query)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/swimlanes:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [boards]
      operationId: replaceBoardSwimlanes
      summary: Reemplazar los carriles por consulta de un tablero
      description: Solo se usan cuando swimlane_mode es query; cada tarjeta cae en el primer carril cuya consulta cumple y las demas en el carril implicito other. Misma gramatica que los filtros rapidos. Requiere manage_board.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swimlanes]
              properties:
                swimlanes:
                  type: array
                  items: {$ref: '#/components/schemas/BoardQueryInput'}
            example:
              swimlanes:
                - {name: Errores, query: 'type = bug'}
                - {name: Urgente, query: 'labels = urgente'}
      responses:
        '200':
          description: Tablero con los carriles nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Consulta no valida (board.invalid_query)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/view:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [boards]
      operationId: getBoardView
      summary: Vista del tablero con columnas, carriles y tarjetas
      description: Un numero constante de consultas SQL, sin importar cuantas tarjetas haya (hasta 5000). count son las tarjetas mostradas tras los filtros rapidos y total las de la columna sin filtrar; wip_state se evalua sobre total (ok, below_min, at_max, over_max). Las epicas no son tarjetas. Los tableros scrum muestran por defecto el sprint activo y los kanban todas las incidencias. Los estados sin columna aparecen en unmapped_column cuando show_unmapped_lane es true.
      security:
        - bearerAuth: []
      parameters:
        - name: quick_filters
          in: query
          description: Ids de filtros rapidos separados por coma; deben cumplirse todos.
          schema: {type: string}
        - name: sprint
          in: query
          description: active, all, none (sin sprint) o el id de un sprint.
          schema: {type: string}
        - name: swimlane
          in: query
          description: Id de carril; solo devuelve las tarjetas de ese carril.
          schema: {type: string}
      responses:
        '200':
          description: Vista del tablero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BoardView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Parametros no validos (board.invalid_query, validacion)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /boards/{id}/cards/{issue_id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: issue_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [boards]
      operationId: moveBoardViewCard
      summary: Mover una tarjeta a una columna
      description: |
        Requiere move_cards. Si la tarjeta ya esta en la columna solo cambia su posicion (before_issue_id o after_issue_id, uno de los dos). Si no, resuelve con el motor de flujo la transicion que lleva del estado actual a los estados de la columna:
        - ninguna transicion disponible - 409 issue.transition_unavailable;
        - varias - 409 board.ambiguous_transition, details lista las candidatas (field es el id de la transicion y message su nombre); reenviar con transition_id;
        - la transicion pide datos - 422 issue.required_field_missing, details[0] es {field: transition_id, message: <id>} y siguen los campos pedidos (fields.x, comment, resolution, assignee); reenviar con transition_id e input.
        El limite WIP es solo un aviso: la respuesta lleva wip.exceeded. Con carriles por responsable (o por epica) soltar la tarjeta en un carril cambia su responsable (o su epica) a traves del servicio de incidencias.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveBoardCardRequest'}
            example:
              column_id: 5d0e0000-0000-4000-8000-000000000002
              after_issue_id: 3c9d0000-0000-4000-8000-0000000000aa
              swimlane: unassigned
      responses:
        '200':
          description: Tarjeta movida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MoveBoardCardResult'}
              example:
                data:
                  issue_id: 3c9d0000-0000-4000-8000-0000000000bb
                  column_id: 5d0e0000-0000-4000-8000-000000000002
                  status: {id: 9b1a0000-0000-4000-8000-000000000002, name: En curso, category: in_progress}
                  transition_id: start
                  transitioned: true
                  rank: n
                  wip: {column_id: 5d0e0000-0000-4000-8000-000000000002, count: 5, min_issues: null, max_issues: 4, state: over_max, exceeded: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Tablero, columna o tarjeta no encontrados (board.not_found, board.column_not_found, board.card_not_found)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Sin transicion (issue.transition_unavailable), ambigua (board.ambiguous_transition), cambio de estado concurrente (issue.status_conflict), posicion no calculable (board.rank_conflict) o proyecto archivado (project.archived)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: Falta informacion de la transicion (issue.required_field_missing) o peticion no valida (board.invalid_move, workflow.validation_failed)
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /projects/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
    get:
      tags: [projects]
      summary: List project members
      description: >-
        Direct members followed by the users reached through team grants (via_team true, with team_id and team_name).
        effective_role is the best role of the user across the direct membership and every team grant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [projects]
      summary: Add or update a project member
      description: >-
        The user must belong to the organization of the project (code project.user_not_in_org otherwise), and
        must exist (code project.user_not_found).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: Project member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user does not exist (code project.user_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The user does not belong to the organization of the project (code project.user_not_in_org).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/members/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID o clave del proyecto (por ejemplo CORE).
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [projects]
      summary: Change a project member role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMemberRequest'
      responses:
        '200':
          description: Project member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Remove a project member
      security:
        - bearerAuth: []
