        '422':
          description: >-
            The body failed validation (codes org.name_required, org.slug_invalid, org.slug_reserved, org.body_invalid
            or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      summary: Get an organization
      description: Returns the organization with the caller's role. Non-members get 404 so that existence is not revealed.
      operationId: getOrganization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist, is deleted, or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The organization id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    patch:
      tags: [organizations]
      summary: Update an organization
      description: >-
        Partial update of name, description and settings. Omitted fields keep their value; settings are merged field
        by field. Owners and admins only.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: The updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.name_required, org.settings_invalid with one detail per field,
            org.body_invalid, org.id_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Delete an organization
      description: >-
        Soft-deletes the organization. Owners only. The body must repeat the organization slug in confirm_slug. The slug
        stays reserved after deletion.
      operationId: deleteOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrganizationRequest'
      responses:
        '204':
          description: Organization deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an owner (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: confirm_slug does not match the slug (code org.confirmation_mismatch), or the body is invalid (org.body_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/logo:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    put:
      tags: [organizations]
      summary: Upload an organization logo
      description: >-
        Replaces the logo of the organization. The multipart field file must be a PNG, JPEG or WebP image of at most 2 MB.
        The image is converted to a 256x256 PNG before it is stored. The previous logo file is removed. Owners and admins only.
      operationId: uploadOrganizationLogo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP image, at most 2 MB and 4096 px per side.
      responses:
        '200':
          description: Logo stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logo_url:
                        type: string
                        description: Relative URL of the stored logo (/organizations/{org}/logo).
                        example: /organizations/3f2a1c9e-8b4d-4e7a-9c1f-2d6b5a7e8f90/logo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '413':
          description: The file exceeds 2 MB (code org.logo_too_large).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The multipart body is malformed, the file part is missing, or the file is not a valid PNG, JPEG or WebP image
            (code org.logo_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    get:
      tags: [organizations]
      summary: Get an organization logo
      description: >-
        Returns the PNG logo of the organization. Any member may read it. The response carries an ETag and a private cache
        lifetime of one hour; send If-None-Match to receive 304 when the logo has not changed.
      operationId: getOrganizationLogo
      responses:
        '200':
          description: The logo image
          headers:
            ETag:
              description: Strong validator derived from the stored logo version.
              schema: {type: string}
            Cache-Control:
              description: Always private, max-age=3600.
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              description: Always nosniff.
              schema: {type: string, example: nosniff}
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: The client already holds the current logo (If-None-Match matched the ETag).
          headers:
            ETag:
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: 'private, max-age=3600'}
            X-Content-Type-Options:
              schema: {type: string, example: nosniff}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            The organization does not exist or the caller is not a member (code org.not_found), or the organization has no
            logo (code org.logo_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The organization id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Delete an organization logo
      description: Removes the logo of the organization. Idempotent. Owners and admins only.
      operationId: deleteOrganizationLogo
      responses:
        '204':
          description: Logo removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/leave:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      summary: Leave an organization
      description: The caller removes their own membership. The last owner cannot leave (code org.last_owner).
      operationId: leaveOrganization
      responses:
        '204':
          description: Membership removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The caller is the last owner (code org.last_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [organizations]
      summary: Transfer ownership
      description: Makes an existing member the owner and demotes the caller to admin. Owners only.
      operationId: transferOrganizationOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: Ownership transferred
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not an owner (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The target is the caller (code org.transfer_self) or the body is invalid (org.body_invalid, org.id_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      summary: List the members of an organization
      description: Returns the members with their name, display name, job title, department, avatar flag and email. Guests may not read the list.
      operationId: listOrganizationMembers
      responses:
        '200':
          description: Members of the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a guest (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/people/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationUserId'
    get:
      tags: [organizations]
      summary: Get the profile of a member
      description: >-
        Returns the profile of a member of the organization. Any member may read it, except that guests may only read
        their own profile (code org.forbidden). Users outside the organization and targets that are not members get 404.
      operationId: getOrganizationPerson
      responses:
        '200':
          description: Profile of the member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationPerson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a guest and the target is not the caller (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, the caller is not a member, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationUserId'
    patch:
      tags: [organizations]
      summary: Change the role of a member
      description: >-
        Owners may grant or revoke any role. Admins may only switch members and guests between member and guest. Changing
        one's own role is not allowed (code org.self_role_change).
      operationId: changeOrganizationMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '204':
          description: Role changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not grant or revoke this role (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The caller changes their own role (code org.self_role_change) or the role is invalid (org.role_invalid, org.body_invalid, validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    delete:
      tags: [organizations]
      summary: Remove a member
      description: Owners and admins. Admins may remove members and guests. Removing an owner requires being an owner; the last owner cannot be removed.
      operationId: removeOrganizationMember
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not remove this member (code org.forbidden or org.cannot_remove_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist, or the target is not a member (code org.not_found or org.member_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The member is the last owner (code org.last_owner).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [invitations]
      summary: List invitations
      description: >-
        Owners and admins. status=pending (default) returns invitations still open at this instant; status=all also
        returns accepted, revoked and expired ones.
      operationId: listOrganizationInvitations
      parameters:
        - name: status
          in: query
          required: false
          description: Which invitations to list.
          schema:
            type: string
            enum: [pending, all]
            default: pending
      responses:
        '200':
          description: Invitations of the organization, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The status filter is not pending or all (code org.status_filter_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [invitations]
      summary: Invite people by email
      description: >-
        Owners and admins. Creates one invitation per entry, atomically. The response is the only time the plain token
        and accept_url are returned; only a hash is stored. Tokens expire after 7 days. Creating a new invitation for an
        email with a pending one retires the old one.
      operationId: createOrganizationInvitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationsRequest'
      responses:
        '201':
          description: Invitations created, in the order of the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateInvitationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin, or admins invite a role they may not grant (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization does not exist or the caller is not a member (code org.not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The email is already a member (code org.already_member) or a pending invitation already exists for it (code org.invitation_exists).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: >-
            The body failed validation (codes org.invitation_batch_invalid, org.invitation_email_invalid, org.role_invalid,
            org.body_invalid, org.id_invalid or validation.failed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [invitations]
      summary: Revoke an invitation
      description: Owners and admins. Revokes a pending invitation; its link stops working at once.
      operationId: revokeOrganizationInvitation
      responses:
        '204':
          description: Invitation revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization or the invitation does not exist (code org.not_found or org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The invitation was already accepted (code org.invitation_used) or revoked (code org.invitation_revoked).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /organizations/{org}/invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [invitations]
      summary: Resend an invitation with a new token
      description: >-
        Owners and admins. Replaces the token of a pending invitation and restarts its 7-day expiry. The old link stops
        working immediately. The new plain token and accept_url are returned once.
      operationId: resendOrganizationInvitation
      responses:
        '200':
          description: Invitation renewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is a member below admin (code org.forbidden).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: The organization or the invitation does not exist (code org.not_found or org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: The invitation was already accepted (code org.invitation_used) or revoked (code org.invitation_revoked).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422':
          description: The id is not a UUID (code org.id_invalid).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [invitations]
      summary: Preview an invitation
      description: >-
        Public. Describes the invitation behind the token so the invitee can decide to accept. It has no side effects.
        Every unknown token gets the same 404, so the answer never reveals whether an account exists.
      operationId: previewInvitation
      security: []
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: Unknown token (code org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [invitations]
      summary: Accept an invitation
      description: >-
        The caller's account email must match the invited email (case-insensitive). Adds the caller to the organization
        with the invited role.
      operationId: acceptInvitation
      responses:
        '201':
          description: The caller is now a member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The account email does not match the invitation (code org.email_mismatch).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '404':
          description: Unknown token (code org.invitation_not_found).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: >-
            The invitation was used (org.invitation_used), revoked (org.invitation_revoked), expired (org.invitation_expired)
            or the caller is already a member (org.already_member).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Mounted at the server root, outside the /api/v1 prefix used by every other endpoint.
      operationId: getHealth
      security: []
      servers:
        - url: http://localhost:8080
          description: Server root, without the /api/v1 prefix
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '405':
          description: Método HTTP no permitido para esta ruta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: The ticket's unique identifier
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: The user's unique identifier
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: The team's unique identifier
      schema:
        type: string
        format: uuid
    TeamUserId:
      name: user_id
      in: path
      required: true
      description: The user's unique identifier (a member of the team)
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: org
      in: path
      required: true
      description: The organization's unique identifier. Non-members get 404.
      schema:
        type: string
        format: uuid
    OrganizationUserId:
      name: user_id
      in: path
      required: true
      description: The user's unique identifier (a member of the organization)
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      description: The invitation's unique identifier
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: The plain invitation token received in the invitation link
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: The request is missing a valid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No resource exists with the given identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The operation conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum: [admin, user]
      description: Platform role. The first account created on an empty installation is admin; every other account is user.
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, medium, high, critical]
    IssueType:
      type: string
      enum: [task, bug, story, epic, subtask]
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      properties:
