  /search/validate:
    post:
      tags: [issues]
      operationId: validateSearchQuery
      summary: Validar una consulta CoreQL
      description: >-
        Devuelve valid, la consulta normalizada y errors con position y length (en caracteres), code, message,
        suggestions (nombres cercanos) y expected. No ejecuta la consulta. Los errores de sintaxis y de campos o
        valores no soportados se informan aqui con 200; un texto mayor de 4000 caracteres responde 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                jql: {type: string, maxLength: 4000}
                project_id: {type: string, format: uuid}
      responses:
        '200':
          description: Resultado de la validacion
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /search/suggest:
    get:
      tags: [issues]
      operationId: suggestSearch
      summary: Autocompletado de CoreQL
      description: >-
        Con field devuelve valores candidatos del campo que empiezan por q (usuarios, estados, prioridades, tipos,
        etiquetas, componentes, sprints, proyectos, claves de incidencia, versiones), siempre limitados a lo que el
        usuario puede ver. Sin field devuelve completados de la consulta jql en la posicion cursor (campos, operadores,
        palabras clave y funciones).
      security:
        - bearerAuth: []
      parameters:
        - {name: field, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: jql, in: query, required: false, schema: {type: string, maxLength: 4000}}
        - {name: cursor, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 25, default: 10}}
      responses:
        '200':
          description: Objeto con completions (label, kind, detail) y values (value, label, detail)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /filters:
    get:
      tags: [issues]
      operationId: listFilters
      summary: Listar filtros guardados
      description: >-
        Filtros que el usuario puede ver: propios, compartidos con el (usuario, equipo, proyecto u organizacion) y
        favoritos. scope = all, mine, shared o favorite; q filtra por nombre. Cada filtro incluye access (owner, edit
        o view), is_favorite e is_subscribed.
      security:
        - bearerAuth: []
      parameters:
        - {name: scope, in: query, required: false, schema: {type: string, enum: [all, mine, shared, favorite], default: all}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Pagina de filtros con meta (page, page_size, total)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [issues]
      operationId: createFilter
      summary: Guardar un filtro CoreQL
      description: >-
        Valida la consulta (sintaxis, campos, valores y orden) antes de guardar. El filtro pertenece a la organizacion
        indicada (organization_id) o a la primera del usuario. El nombre es unico por propietario sin distinguir
        mayusculas (filter.name_taken).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 120}
                description: {type: string, maxLength: 500}
                query: {type: string, maxLength: 4000}
                columns: {type: array, items: {type: string}, maxItems: 30}
                sort: {type: string, maxLength: 200}
                organization_id: {type: string, format: uuid}
      responses:
        '201':
          description: Filtro creado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /filters/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [issues]
      operationId: getFilter
      summary: Obtener un filtro
      description: Un filtro que el usuario no puede ver responde 404. Solo el propietario recibe shares.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Filtro
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [issues]
      operationId: updateFilter
      summary: Modificar un filtro
      description: Pueden modificarlo el propietario y quienes lo tienen compartido con permiso edit (403 para quien solo lo ve).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 120}
                description: {type: string, maxLength: 500}
                query: {type: string, maxLength: 4000}
                columns: {type: array, items: {type: string}, maxItems: 30}
                sort: {type: string, maxLength: 200}
      responses:
        '200':
          description: Filtro modificado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      operationId: deleteFilter
      summary: Eliminar un filtro
      description: Solo el propietario. Se eliminan sus comparticiones, suscripciones y favoritos.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Filtro eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /filters/{id}/shares:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [issues]
      operationId: setFilterShares
      summary: Reemplazar las comparticiones de un filtro
      description: >-
        Solo el propietario. Cada destino (user, team, project u organization) debe pertenecer a la organizacion del
        filtro (filter.share_invalid). permission = view o edit. La lista vacia deja de compartir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shares:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      type: {type: string, enum: [user, team, project, organization]}
                      target_id: {type: string, format: uuid}
                      permission: {type: string, enum: [view, edit], default: view}
      responses:
        '200':
          description: Comparticiones resultantes con el nombre de cada destino
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /filters/{id}/issues:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [issues]
      operationId: runFilter
      summary: Ejecutar un filtro
      description: >-
        Ejecuta la consulta guardada con su orden para quien la pide: el resultado se intersecta con lo que esa persona
        puede ver, diga lo que diga el filtro. Acepta page, page_size, total y fields como la busqueda.
      security:
        - bearerAuth: []
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: total, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: fields, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Pagina de incidencias con meta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /filters/{id}/subscription:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [issues]
      operationId: getFilterSubscription
      summary: Obtener la suscripcion propia a un filtro
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suscripcion
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [issues]
      operationId: subscribeFilter
      summary: Suscribirse a un filtro
      description: >-
        Crea o reemplaza la suscripcion del usuario a un filtro que puede ver. frequency (daily o weekly), hour (0-23),
        weekday (0 domingo a 6 sabado, solo weekly) y timezone (IANA; por defecto la del usuario). Por ahora solo se
        guarda: el envio lo hara el planificador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                frequency: {type: string, enum: [daily, weekly]}
                hour: {type: integer, minimum: 0, maximum: 23}
                weekday: {type: integer, minimum: 0, maximum: 6}
                timezone: {type: string}
      responses:
        '200':
          description: Suscripcion guardada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      operationId: unsubscribeFilter
      summary: Cancelar la suscripcion a un filtro
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Suscripcion cancelada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dashboard/me:
    get:
      tags: [issues]
      operationId: getMyDashboard
      summary: Resumen personal del usuario
      description: Trabajo asignado por estado, incidencias vencidas, proyectos en los que es miembro, sprints activos de esos proyectos y las 5 incidencias abiertas mas urgentes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen personal
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboards:
    get:
      tags: [dashboards]
      operationId: listDashboards
      summary: Paneles visibles para el usuario
      description: Paneles propios, compartidos con el usuario (directamente, por equipo, por proyecto o por organizacion) y, para administradores de la organizacion, los de su organizacion (solo lectura). Cada elemento trae gadget_count en lugar de los gadgets.
      security:
        - bearerAuth: []
      parameters:
        - {name: scope, in: query, required: false, schema: {type: string, enum: [all, mine, shared]}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Pagina de paneles
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [dashboards]
      operationId: createDashboard
      summary: Crear un panel vacio
      description: Codigos de error dashboard.invalid, dashboard.name_taken (409) y dashboard.no_organization.
      security:
        - bearerAuth: []
      requestBody:
