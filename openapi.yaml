        id: {type: string, format: uuid, description: Id de una columna existente del tablero para conservarla.}
        name: {type: string, maxLength: 80}
        color: {type: string}
        min_issues: {type: integer, minimum: 0, nullable: true}
        max_issues: {type: integer, minimum: 1, nullable: true}
        status_ids:
          type: array
          items: {type: string, format: uuid}
    BoardQueryInput:
      type: object
      required: [name, query]
      properties:
        name: {type: string, maxLength: 60}
        query: {type: string, maxLength: 500}
    BoardQuery:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        query: {type: string}
    BoardWorkflowStatus:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        category: {type: string, enum: [todo, in_progress, done]}
    BoardDetail:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [scrum, kanban]}
        is_default: {type: boolean}
        swimlane_mode: {type: string, enum: [none, assignee, epic, query, story]}
        estimation: {type: string, enum: [story_points, issue_count, time]}
        card_fields:
          type: array
          items: {type: string, enum: [key, type, priority, assignee, labels, points, epic, subtasks, flag, estimate]}
        show_unmapped_lane: {type: boolean}
        done_retention_days: {type: integer, nullable: true}
        columns:
          type: array
          items: {$ref: '#/components/schemas/BoardColumnConfig'}
        quick_filters:
          type: array
          items: {$ref: '#/components/schemas/BoardQuery'}
        swimlanes:
          type: array
          items: {$ref: '#/components/schemas/BoardQuery'}
        workflow_statuses:
          type: array
          items: {$ref: '#/components/schemas/BoardWorkflowStatus'}
        unmapped_status_ids:
          type: array
          items: {type: string, format: uuid}
        can_manage_board: {type: boolean}
        can_move_cards: {type: boolean}
    CreateBoardRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 80}
        type: {type: string, enum: [scrum, kanban], description: Por defecto el tipo del proyecto.}
        swimlane_mode: {type: string, enum: [none, assignee, epic, query, story]}
        estimation: {type: string, enum: [story_points, issue_count, time]}
        card_fields:
          type: array
          items: {type: string}
        show_unmapped_lane: {type: boolean, default: true}
        done_retention_days: {type: integer, minimum: 0, maximum: 3650, nullable: true}
        columns:
          type: array
          items: {$ref: '#/components/schemas/BoardColumnInput'}
    UpdateBoardRequest:
      type: object
      properties:
        name: {type: string, maxLength: 80}
        swimlane_mode: {type: string, enum: [none, assignee, epic, query, story]}
        estimation: {type: string, enum: [story_points, issue_count, time]}
        card_fields:
          type: array
          items: {type: string}
        show_unmapped_lane: {type: boolean}
        done_retention_days: {type: integer, minimum: 0, maximum: 3650, nullable: true}
    BoardViewRef:
      type: object
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        summary: {type: string}
    BoardViewNamed:
      type: object
      properties:
        name: {type: string}
        key: {type: string, description: Clave heredada (bug, task, high...) cuando existe.}
        icon: {type: string}
        color: {type: string}
    BoardViewCard:
      type: object
      properties:
        id: {type: string, format: uuid}
        key: {type: string, example: CORE-12}
        summary: {type: string}
        type: {$ref: '#/components/schemas/BoardViewNamed'}
        priority: {$ref: '#/components/schemas/BoardViewNamed'}
        status: {$ref: '#/components/schemas/BoardWorkflowStatus'}
        assignee:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        labels:
          type: array
          items: {type: string}
        story_points: {type: number, nullable: true}
        remaining_estimate_seconds: {type: integer, nullable: true}
        flagged: {type: boolean}
        rank: {type: string}
        sprint_id: {type: string, format: uuid, nullable: true}
        epic:
          nullable: true
          allOf: [{$ref: '#/components/schemas/BoardViewRef'}]
        parent:
          nullable: true
          allOf: [{$ref: '#/components/schemas/BoardViewRef'}]
        subtasks:
          type: object
          properties:
            total: {type: integer}
            done: {type: integer}
        swimlane_id: {type: string, description: 'Id del carril; vacio sin carriles. Valores implicitos: unassigned, no-epic, no-parent, other.'}
    BoardViewColumn:
      allOf:
        - $ref: '#/components/schemas/BoardColumnConfig'
        - type: object
          properties:
            count: {type: integer, description: Tarjetas mostradas tras los filtros rapidos.}
            total: {type: integer, description: Tarjetas de la columna sin filtros rapidos.}
            estimate: {type: number, description: Suma segun la estimacion del tablero (puntos, incidencias u horas restantes).}
            wip_state: {type: string, enum: [ok, below_min, at_max, over_max]}
            cards:
              type: array
              items: {$ref: '#/components/schemas/BoardViewCard'}
    BoardView:
      type: object
      properties:
        board: {$ref: '#/components/schemas/BoardDetail'}
        sprint:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        columns:
          type: array
          items: {$ref: '#/components/schemas/BoardViewColumn'}
        unmapped_column:
          type: object
          nullable: true
          description: Columna implicita Sin asignar con las tarjetas cuyo estado no esta en ninguna columna.
          properties:
            id: {type: string, example: unmapped}
            name: {type: string}
            status_ids:
              type: array
              items: {type: string, format: uuid}
            count: {type: integer}
            total: {type: integer}
            estimate: {type: number}
            cards:
              type: array
              items: {$ref: '#/components/schemas/BoardViewCard'}
        unmapped_count: {type: integer}
        swimlanes:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              kind: {type: string, enum: [none, assignee, epic, query, story]}
              count: {type: integer}
    MoveBoardCardRequest:
      type: object
      required: [column_id]
      properties:
        column_id: {type: string, format: uuid}
        before_issue_id: {type: string, format: uuid}
        after_issue_id: {type: string, format: uuid}
        swimlane: {type: string, description: Id del carril donde se soltó la tarjeta.}
        transition_id: {type: string, description: Transicion elegida cuando varias llevan a la columna o ya se pidio su informacion.}
        input:
          type: object
          properties:
            fields: {type: object, additionalProperties: {type: string}}
            comment: {type: string}
            resolution_id: {type: string, format: uuid}
            assignee_id: {type: string, format: uuid}
    MoveBoardCardResult:
      type: object
      properties:
        issue_id: {type: string, format: uuid}
        column_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/BoardWorkflowStatus'}
        transition_id: {type: string}
        transitioned: {type: boolean}
        rank: {type: string, description: Nueva posicion; vacia si no se pidio reordenar.}
        wip:
          type: object
          description: Aviso del limite WIP de la columna destino (no bloquea el movimiento).
          properties:
            column_id: {type: string, format: uuid}
            count: {type: integer}
            min_issues: {type: integer, nullable: true}
            max_issues: {type: integer, nullable: true}
            state: {type: string, enum: [ok, below_min, at_max, over_max]}
            exceeded: {type: boolean}
    ProjectBoard:
      type: object
      required: [id, project_id, name, type, columns]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [kanban, scrum]
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
    BoardColumn:
      type: object
      required: [id, name, status, position, count, cards]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        position:
          type: integer
          minimum: 0
        wip_limit:
          type: integer
          minimum: 1
          nullable: true
        count:
          type: integer
          minimum: 0
        cards:
          type: array
          items:
            $ref: '#/components/schemas/BoardCard'
    BoardCard:
      type: object
      required: [id, type, summary, status, priority, rank]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task, bug, story, epic, subtask]
        summary:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        assignee_id:
          type: string
          format: uuid
          nullable: true
        assignee:
          type: string
          nullable: true
        story_points:
          type: number
          format: float
          nullable: true
        rank:
          type: string
          maxLength: 64
    PermissionGrant:
      type: object
      required: [permission, holders]
      properties:
        permission:
          type: string
          description: Nombre del permiso del catalogo (por ejemplo create_issue, edit_project).
          example: create_issue
        holders:
          type: array
          description: >-
            Titulares que tienen el permiso: lead, contributor, viewer, org_admin, o los titulares especiales
            reporter, assignee, watcher (solo aplican sobre una incidencia).
          items:
            type: string
            enum: [lead, contributor, viewer, org_admin, reporter, assignee, watcher]
          example: [lead, contributor]
    PermissionScheme:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        is_default:
          type: boolean
          description: true cuando el proyecto no tiene reglas propias y usa el esquema por defecto.
        grants:
          type: array
          description: Una entrada por cada permiso del catalogo, en orden de catalogo.
          items:
            $ref: '#/components/schemas/PermissionGrant'
    ReplacePermissionsRequest:
      type: object
      description: Esquema completo. Campos desconocidos se rechazan (422).
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
    EffectivePermissions:
      type: object
      properties:
        role:
          type: string
          description: Rol efectivo del usuario en el proyecto, o none si no tiene rol.
          enum: [lead, contributor, viewer, none]
          example: contributor
        permissions:
          type: array
          description: Permisos del catalogo que el usuario tiene (sin titulares especiales).
          items:
            type: string
          example: [browse_project, create_issue, comment_issue]
    ProjectMember:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [lead, contributor, viewer]
        effective_role:
          type: string
          enum: [lead, contributor, viewer]
        via_team:
          type: boolean
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        created_at:
          type: string
          format: date-time
          description: Absent for users reached only through a team.
    SetProjectTeamRoleRequest:
      type: object
      required: [team_id, role]
      properties:
        team_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [lead, contributor, viewer]
    ProjectTeamRole:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        role:
          type: string
          enum: [lead, contributor, viewer]
        created_at:
          type: string
          format: date-time
    AddProjectMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [lead, contributor, viewer]
    UpdateProjectMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [lead, contributor, viewer]
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [organization_id, key, name]
      properties:
        organization_id:
          type: string
          format: uuid
          description: Organizacion que es duena del proyecto.
        key:
          type: string
          minLength: 2
          maxLength: 10
          pattern: '^[A-Za-z][A-Za-z0-9]{1,9}$'
          description: >-
            Clave del proyecto. Se guarda en mayusculas. Empieza por letra y usa solo letras y numeros.
            Debe ser unica entre los proyectos activos de la organizacion.
          example: CORE
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Plataforma Core
        description:
          type: string
          maxLength: 5000
        template:
          $ref: '#/components/schemas/ProjectTemplate'
        type:
          type: string
          enum: [kanban, scrum]
          deprecated: true
          description: >-
            Campo legado. Se usa solo cuando falta template: scrum crea una plantilla scrum y kanban una
            plantilla kanban.
        visibility:
          type: string
          enum: [private, open]
          description: >-
            Opcional. Si falta se aplica el valor por defecto de la organizacion. El valor legado team se acepta
            y se guarda como open.
        color:
          type: string
          maxLength: 20
          example: blue
        icon:
          type: string
          maxLength: 40
          example: rocket
        default_assignee_policy:
          type: string
          enum: [unassigned, lead]
          description: Responsable por defecto de las incidencias nuevas. Por defecto unassigned.
        member_ids:
          type: array
          maxItems: 100
          description: Usuarios que se anaden como contributor. El creador siempre es lider.
          items:
            type: string
            format: uuid
        team_ids:
          type: array
          maxItems: 100
          description: Equipos que reciben el rol contributor en el proyecto. Deben pertenecer a la organizacion.
          items:
            type: string
            format: uuid
    UpdateProjectRequest:
      type: object
      required: [name, type, lead_id, visibility]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum: [kanban, scrum]
        lead_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [private, open]
          description: El valor legado team se acepta y se guarda como open.
        color:
          type: string
          maxLength: 20
          description: Si falta se conserva el valor actual.
        icon:
          type: string
          maxLength: 40
          description: Si falta se conserva el valor actual.
        default_assignee_policy:
          type: string
          enum: [unassigned, lead]
          description: Si falta se conserva el valor actual.
    IssueActivityEntry:
      type: object
      required: [id, type, created_at, actor]
      properties:
        id:
          type: string
          format: uuid
          description: Id del comentario, o del lote de cambios (todos los cambios de un PATCH comparten id).
        type:
          type: string
          enum: [comment, history]
        created_at:
          type: string
          format: date-time
        actor:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              description: Nombre actual, o "Usuario eliminado".
        comment:
          type: object
          description: Presente cuando type es comment.
          properties:
            id:
              type: string
              format: uuid
            body:
              type: string
            updated_at:
              type: string
              format: date-time
            edited:
              type: boolean
        changes:
          type: array
          description: Presente cuando type es history. Cambios del lote en orden.
          items:
            type: object
            required: [action, field, label]
            properties:
              action:
                type: string
                enum: [field_changed, assignee_changed, link_added, link_removed]
              field:
                type: string
                description: Nombre interno del campo.
              label:
                type: string
                description: Nombre del campo en español.
              from:
                type: string
                nullable: true
                description: Valor anterior legible (nombres en lugar de ids).
              to:
                type: string
                nullable: true
                description: Valor nuevo legible (nombres en lugar de ids).
    UpdateProjectLabelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          description: Clave de la paleta gray, red, orange, amber, green, teal, blue, indigo, purple o pink.
          enum: [gray, red, orange, amber, green, teal, blue, indigo, purple, pink]
    CreateProjectLabelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          maxLength: 20
    CreateProjectComponentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 5000
    FavoriteItem:
      type: object
      description: Elemento marcado con estrella. Para proyectos incluye nombre, clave y color.
      required: [type, id, name, key, color, created_at]
      properties:
        type:
          type: string
          example: project
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plataforma web
        key:
          type: string
          example: WEB
        color:
          type: string
          example: blue
        created_at:
          type: string
          format: date-time
          description: Momento en que se marco la estrella
    RecentItem:
      type: object
      description: Elemento visto recientemente. created_at es la fecha de creación del elemento.
      required: [type, id, name, key, color, created_at, viewed_at]
      properties:
        type:
          type: string
          example: project
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Plataforma web
        key:
          type: string
          example: WEB
        color:
          type: string
          example: blue
        created_at:
          type: string
          format: date-time
        viewed_at:
          type: string
          format: date-time
          description: Momento de la última visita
    AuthSession:
      type: object
      properties:
        token:
          type: string
          description: A signed JWT access token, valid for the duration configured by JWT_EXPIRATION on the server.
        user:
          $ref: '#/components/schemas/User'
    Note:
      type: object
      required: [id, title, body, color, pinned, tags, issue_id, project_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 20000
        color:
          type: string
          enum: [yellow, blue, green, pink, purple, orange, red, gray]
        pinned:
          type: boolean
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        issue_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NoteInput:
      type: object
      additionalProperties: false
      description: Campos de una nota nueva. Las etiquetas se normalizan (recortadas, en minusculas, sin repetir) y no pueden ser mas de 10.
      properties:
        title:
          type: string
          maxLength: 120
          description: Opcional
        body:
          type: string
          maxLength: 20000
          description: Opcional
        color:
          type: string
          enum: [yellow, blue, green, pink, purple, orange, red, gray]
          default: yellow
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
