    post:
      tags: [organizations]
      summary: Create an organization
      description: >-
        The caller becomes the owner. A user may own at most 5 organizations (code org.limit_reached). When slug is
        omitted it is derived from the name.
      operationId: createOrganization
      requestBody:
        required: true
