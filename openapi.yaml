      operationId: updateDashboard
      summary: Cambiar nombre, descripcion, diseno o panel principal
      description: Requiere permiso de edicion; is_default solo lo cambia el propietario. Un diseno con menos columnas que las usadas por los gadgets se rechaza con dashboard.invalid.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardUpdateRequest'
      responses:
        '200':
          description: Panel actualizado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
