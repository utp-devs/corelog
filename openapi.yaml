          type: number
          format: double
          nullable: true
          description: Puntos de historia de 0 a 999.5 en pasos de 0.5 (issue.invalid_story_points).
        start_date:
          type: string
          format: date
          nullable: true
          description: Fecha de inicio (YYYY-MM-DD); no puede ser posterior al vencimiento (issue.invalid_dates).
