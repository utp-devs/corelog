      summary: Aplicar una accion a hasta 200 incidencias
      description: >-
        Cada incidencia se procesa en su propia transaccion y con los mismos permisos que su endpoint individual.
        Una incidencia que falla no detiene a las demas: la respuesta lista las que cambiaron en succeeded y las
        que no en failed, cada una con su codigo. Acciones: assign (params.assignee_id, null desasigna), set_priority
        (params.priority_id), set_labels (params.add y params.remove, listas de ids de etiquetas del proyecto de cada
        incidencia), set_field (params.fields con los mismos campos que PATCH, incluido custom), transition
        (params.transition_id, params.status_id o params.status; exactamente uno), move (params.project_id, params.issue_type_id, params.field_mapping), delete. Codigos de
        fallo por incidencia: issue.not_found, issue.forbidden, workflow.transition_not_allowed, workflow.validation_failed, issue.transition_unavailable, issue.status_conflict, issue.label_not_in_project,
        issue.move_mapping_required, issue.hierarchy_* y los de validacion del campo. La peticion se rechaza (422) si
        la accion no existe, faltan parametros, hay mas de 200 incidencias o ninguna.
      operationId: bulkChangeIssues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_ids, action]
              additionalProperties: false
              properties:
                issue_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    description: UUID o clave (CORE-12)
                action:
                  type: string
                  enum: [assign, set_priority, set_labels, set_field, transition, move, delete]
                params:
                  type: object
                  additionalProperties: false
              example:
                issue_ids: [CORE-12, CORE-13]
                action: set_priority
                params: {priority_id: 3f0c9b3e-6a53-4d0c-9a4e-2c1f5a7d8e90}
      responses:
        '200':
          description: Resultado por incidencia (succeeded y failed; puede haber ambas listas no vacias)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      succeeded:
                        type: array
                        items:
                          type: object
                          properties:
                            issue:
                              $ref: '#/components/schemas/Issue'
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            issue:
                              type: string
                              description: Referencia enviada (UUID o clave)
                            code:
                              type: string
                            message:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/export:
    get:
      tags: [issues]
      summary: Exportar incidencias visibles a CSV
      description: >-
        Mismos filtros que GET /issues (sin paginacion) y columns=key,summary,... (por defecto key, summary, type,
        status, priority, assignee, reporter, created, updated, due_date). El CSV va en UTF-8 con BOM, cabecera en
        espanol, y las celdas que empiezan por = + - @ llevan un apostrofo delante. Como maximo 10000 filas; si
        hay mas, la cabecera X-Export-Truncated vale true. Solo incluye incidencias de proyectos que el usuario puede
        ver. Columnas: key, project, summary, description, type, status, priority, resolution, assignee, reporter,
        created, updated, due_date, start_date, story_points, labels, votes, flagged.
      operationId: exportIssues
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: priority, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: issue_type, in: query, schema: {type: string}}
        - {name: label_id, in: query, schema: {type: string, format: uuid}}
        - {name: assignee_id, in: query, description: UUID o "unassigned", schema: {type: string}}
        - {name: due_from, in: query, schema: {type: string, format: date-time}}
        - {name: due_to, in: query, schema: {type: string, format: date-time}}
        - {name: columns, in: query, description: Columnas separadas por coma, en el orden de salida, schema: {type: string}}
      responses:
        '200':
          description: Archivo CSV (text/csv) con Content-Disposition attachment y nombre incidencias-AAAA-MM-DD.csv
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    post:
      tags: [issues]
      summary: Clonar una incidencia
      description: >-
        Crea una incidencia nueva con su propia clave del proyecto destino, reportada por quien clona. Copia los
        campos y los valores personalizados que el proyecto destino admite. Siempre deja un enlace clones hacia el
        original. include admite attachments (copia los archivos), links (copia los demas enlaces), subtasks (copia
        los hijos un nivel), watchers (copia los seguidores). Las etiquetas y componentes se copian cuando el destino
        es el mismo proyecto. Requiere create_issue en el proyecto destino.
      operationId: cloneIssue
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                summary: {type: string, maxLength: 255, description: Por defecto "Copia de <resumen original>"}
                project_id: {type: string, format: uuid}
                include:
                  type: array
                  items: {type: string, enum: [attachments, links, subtasks, watchers]}
      responses:
        '201':
          description: La incidencia clonada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/move:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    post:
      tags: [issues]
      summary: Mover una incidencia a otro proyecto
      description: >-
        Asigna una clave nueva del proyecto destino; la clave anterior sigue resolviendo a la incidencia. Los hijos se
        mueven con ella. Tipo, prioridad y estado se mapean: si el proyecto destino no admite un valor, field_mapping
        debe indicar su equivalente (field_mapping.issue_type y field_mapping.priority: id origen a id destino;
        field_mapping.status: estado origen a estado destino); si falta, responde 422 issue.move_mapping_required con
        un detalle por mapeo pendiente. Los campos personalizados que el destino no define se eliminan y se listan en
        warnings. Las etiquetas y componentes del origen se quitan y se avisa. Requiere edit_issue en el origen y
        create_issue en el destino.
      operationId: moveIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              additionalProperties: false
              properties:
                project_id: {type: string, format: uuid}
                issue_type_id: {type: string, format: uuid, description: Tipo de la incidencia movida en el destino}
                field_mapping:
                  type: object
                  additionalProperties: false
                  properties:
                    issue_type: {type: object, additionalProperties: {type: string, format: uuid}}
                    priority: {type: object, additionalProperties: {type: string, format: uuid}}
                    status: {type: object, additionalProperties: {type: string}}
      responses:
        '200':
          description: La incidencia movida con warnings y los cambios de clave (moved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Issue'
                      - type: object
                        properties:
                          warnings: {type: array, items: {type: string}}
                          moved:
                            type: array
                            items:
                              type: object
                              properties:
                                id: {type: string, format: uuid}
                                from_key: {type: string}
                                to_key: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/convert:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    post:
      tags: [issues]
      summary: Convertir el tipo de una incidencia
      description: >-
        Cambia el tipo aplicando las reglas de jerarquia (epica, estandar, subtarea). Una subtarea que pasa a otro tipo
        necesita un padre epica o ninguno: si su padre no es una epica, indica parent_id (null lo quita). Convertir a
        subtarea exige parent_id. Respuesta igual que PATCH, con los cambios. Requiere edit_issue.
      operationId: convertIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_type_id]
              additionalProperties: false
              properties:
                issue_type_id: {type: string, format: uuid}
                parent_id: {type: string, format: uuid, nullable: true}
      responses:
        '200':
          description: La incidencia convertida con sus cambios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    get:
      tags: [issues]
      summary: Get an issue by key or id
      description: >-
        {id} acepta el UUID o la clave legible (CORE-12). Codigos: issue.not_found (404, tambien para claves
        desconocidas o de proyectos no visibles), issue.key_ambiguous (409), issue.invalid_id (422).
      operationId: getIssue
      responses:
        '200':
          description: >-
            Vista completa de la incidencia: los campos de Issue mas permissions (permisos efectivos de quien consulta
            sobre esta incidencia), available_transitions, counts y breadcrumb.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssueView'
              example:
                data:
                  id: 3f0c9b3e-6a53-4d0c-9a4e-2c1f5a7d8e90
                  key: CORE-12
                  summary: Corregir el login
                  status: open
                  start_date: '2026-12-01'
                  due_date: '2026-12-15'
                  story_points: 3
                  original_estimate_seconds: 28800
                  remaining_estimate_seconds: 14400
                  flagged: false
                  permissions: [edit_issue, assign_issue, transition_issue, comment_issue, delete_issue]
                  available_transitions:
                    - id: start
                      name: Iniciar
                      to_status: in_progress
                      to: {id: 6f1b2c3d-0000-4000-8000-0000000000a2, name: En curso, category: in_progress}
                      required_fields: []
                      requires_comment: false
                      requires_resolution: false
                      requires_assignee: false
                      needs_screen: false
                  counts: {comments: 2, attachments: 0, children: 3, links: 0, watchers: 2, votes: 0}
                  breadcrumb:
                    project: {id: 00000000-0000-4000-8000-000000000001, key: CORE, name: CoreLog}
                    parent: {id: 7a1b2c3d-0000-4000-8000-000000000099, key: CORE-3, summary: Autenticacion, type: epic}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [issues]
      summary: Partially update an issue
      description: >-
        Cambia solo los campos presentes en el cuerpo; un null explicito borra los campos que lo admiten (descripcion,
        padre, persona asignada, estimaciones, fechas, puntos). summary, tipo, prioridad y flagged no admiten null
        (issue.field_not_clearable). Un campo desconocido responde 422 validation.failed. Permisos por campo: el resto
        de campos requieren edit_issue (o edit_own_issue si quien llama es el reporter) y assignee_id requiere
        assign_issue; el estado tiene su propio endpoint. Quien no ve la incidencia recibe 404; quien la ve sin permiso, 403.
        Todos los cambios de una peticion forman un lote de actividades (batch_id) y emiten un unico evento issue.updated con
        changes[]. Si se envia expected_updated_at y difiere del actual se responde 409 issue.stale. Reglas de jerarquia:
        una epica no tiene padre, una subtarea exige un padre que no sea epica ni subtarea del mismo proyecto, una incidencia
        estandar solo puede tener una epica como padre, sin ciclos (issue.hierarchy_*). Un cambio sin diferencias no escribe nada.
      operationId: patchIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIssueRequest'
            example:
              summary: Corregir el login con SSO
              assignee_id: null
              due_date: '2026-12-20'
              expected_updated_at: '2026-11-27T10:00:00.123456Z'
      responses:
        '200':
          description: La incidencia actualizada y los cambios aplicados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PatchIssueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      summary: Delete an issue (soft delete)
      description: >-
        Elimina la incidencia de forma logica: deja de aparecer en listas, busqueda, tablero, panel y calendario. Requiere
        delete_issue. Emite issue.deleted. Un proyecto archivado responde 409 project.archived.
      operationId: deleteIssue
      responses:
        '204':
          description: Incidencia eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /issues/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
    post:
      tags: [issues]
      summary: Restore a deleted issue
      description: >-
        Restaura una incidencia eliminada. Requiere delete_issue (lider del proyecto y administradores de la organizacion).
        Debe indicarse el UUID, porque una incidencia eliminada no se resuelve por clave.
      operationId: restoreIssue
      responses:
        '200':
          description: Incidencia restaurada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /issues/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    get:
      tags: [issues]
      summary: Transiciones disponibles de una incidencia
      description: >-
        Lista, en el orden del flujo de trabajo del proyecto, las transiciones que quien consulta puede ejecutar desde el
        estado actual de la incidencia (se evaluan sus condiciones). Cada una indica el estado destino y lo que el cliente
        debe pedir antes de ejecutarla (campos, comentario, resolucion, persona asignada). Requiere el permiso
        transition_issue; quien no puede ver la incidencia recibe 404.
      operationId: listIssueTransitions
      responses:
        '200':
          description: Transiciones que quien consulta puede ejecutar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueTransition'
              example:
                data:
                  - id: start
                    name: Iniciar
                    to_status: in_progress
                    to: {id: 6f1b2c3d-0000-4000-8000-0000000000a2, name: En curso, category: in_progress}
                    required_fields: []
                    requires_comment: false
                    requires_resolution: false
                    requires_assignee: false
                    needs_screen: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [issues]
      summary: Ejecutar una transicion de la incidencia
      description: >-
        Ejecuta una transicion del flujo de trabajo en una sola transaccion: comprueba permisos y condiciones, valida los
        campos, el comentario y la resolucion que pida la transicion, cambia el estado (y el valor legacy de status, que
        refleja la categoria del estado), aplica las post-funciones (resolucion, asignacion, campos, comentarios), guarda
        el historial de estados, un lote de actividad y el evento issue.transitioned. Si se envia expected_status_id y la
        incidencia ya no esta en ese estado, o si otra transicion se adelanta, responde 409 issue.status_conflict.
        Errores: 403 workflow.transition_not_allowed (la transicion no existe, no sale del estado actual o falla una
        condicion), 409 issue.status_conflict, 422 workflow.validation_failed con un detalle por requisito incumplido,
        422 issue.resolution_not_found.
      operationId: runIssueTransition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunIssueTransitionRequest'
            example:
              transition_id: complete
              comment: Verificado en produccion
              expected_status_id: 6f1b2c3d-0000-4000-8000-0000000000a2
      responses:
        '200':
          description: La incidencia con su nuevo estado y la transicion aplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Issue'
                      - type: object
                        properties:
                          transition:
                            $ref: '#/components/schemas/AppliedTransition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El estado de la incidencia cambio (issue.status_conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    patch:
      tags: [issues]
      summary: Asignar o desasignar una incidencia
      description: >-
        Asigna la incidencia a un usuario, o la desasigna si assignee_id es null. Asignar no
        cambia el estado de la incidencia, solo la persona asignada. La persona asignada debe pertenecer al mismo equipo que quien hace la peticion,
        si no responde 403, y se añade a los seguidores de la incidencia en la misma transaccion.
        Desasignar requiere el mismo permiso que asignar, no cambia el estado, no avisa a nadie y
        es idempotente: si la incidencia ya no tiene persona asignada responde 200 sin cambios.
      operationId: assignIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIssueRequest'
      responses:
        '200':
          description: The issue with its updated assignee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    get:
      tags: [issues]
      summary: Listar comentarios de una incidencia en hilos
      description: >-
        Devuelve los comentarios raiz con sus respuestas (replies) y reply_count, en paginas por cursor. Orden por
        fecha de creacion: asc por defecto, sort=desc para el mas reciente primero. Las respuestas cuelgan siempre de
        la raiz del hilo (un nivel). Los comentarios internos solo aparecen a quien tiene el rol minimo del comentario;
        quien no ve la incidencia recibe 404. Un comentario eliminado se muestra como marcador (deleted=true, body
        "Comentario eliminado") mientras tenga respuestas visibles; si no, desaparece del listado.
      operationId: listIssueComments
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Hilos de la pagina y datos de paginacion.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueCommentThread'
                  meta:
                    $ref: '#/components/schemas/CommentPageMeta'
              example:
                data:
                  - id: 9d2c1e4a-0000-4000-8000-0000000000c1
                    issue_id: 3f0c9b3e-6a53-4d0c-9a4e-2c1f5a7d8e90
                    parent_id: null
                    author_id: 6f1b2c3d-0000-4000-8000-0000000000a1
                    author: {id: 6f1b2c3d-0000-4000-8000-0000000000a1, name: Ana Torres}
                    body: Revisar con @[Luis Paredes](user:6f1b2c3d-0000-4000-8000-0000000000a2)
                    visibility: public
                    internal_role: null
                    mentions: [6f1b2c3d-0000-4000-8000-0000000000a2]
                    reactions: [{emoji: thumbs_up, count: 2, viewer_reacted: true}]
                    edited: false
                    edited_at: null
                    deleted: false
                    created_at: '2026-11-27T10:00:00Z'
                    updated_at: '2026-11-27T10:00:00Z'
                    reply_count: 1
                    replies:
                      - id: 9d2c1e4a-0000-4000-8000-0000000000c2
                        issue_id: 3f0c9b3e-6a53-4d0c-9a4e-2c1f5a7d8e90
                        parent_id: 9d2c1e4a-0000-4000-8000-0000000000c1
                        author_id: 6f1b2c3d-0000-4000-8000-0000000000a2
                        author: {id: 6f1b2c3d-0000-4000-8000-0000000000a2, name: Luis Paredes}
                        body: Hecho, lo reviso hoy.
                        visibility: public
                        internal_role: null
                        mentions: []
                        reactions: []
                        edited: false
                        edited_at: null
                        deleted: false
                        created_at: '2026-11-27T10:05:00Z'
                        updated_at: '2026-11-27T10:05:00Z'
                meta: {limit: 50, next_cursor: null}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [issues]
      summary: Crear un comentario o una respuesta
      description: >-
        Crea un comentario publico o interno. Con parent_id crea una respuesta en el hilo de la raiz (una respuesta a una
        respuesta se guarda en la raiz). Una respuesta a un comentario interno debe ser interna. Las menciones usan la
        sintaxis @[Nombre](user:UUID); solo cuentan las personas que pueden ver el proyecto (y, en comentarios internos,
        el rol minimo del comentario). Las menciones no validas se mantienen como texto y se devuelven en warnings. El
        autor sigue la incidencia en la misma transaccion. Quien no ve la incidencia recibe 404; quien la ve sin permiso
        de comentar recibe 403; un proyecto archivado responde 409.
      operationId: createIssueComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueCommentRequest'
      responses:
        '201':
          description: Comentario creado, con las advertencias de menciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssueCommentWrite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/comments/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [issues]
      summary: Editar un comentario (ruta heredada de /comments/{comment_id})
      description: Misma operacion que PATCH /comments/{comment_id}; el identificador de la incidencia se ignora.
      operationId: updateIssueComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueCommentRequest'
      responses:
        '200':
          description: Comentario editado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssueCommentWrite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      summary: Eliminar un comentario (ruta heredada de /comments/{comment_id})
      description: Misma operacion que DELETE /comments/{comment_id}.
      operationId: deleteIssueComment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Comentario eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /comments/{comment_id}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [issues]
      summary: Editar un comentario
      description: >-
        Solo el autor (edit_own_comment) o quien gestiona comentarios (manage_comments) puede editar. Cada edicion guarda
        el texto anterior como revision y marca edited_at. Solo se notifican las menciones nuevas. Un comentario eliminado
        responde 404. Quien no puede ver el comentario recibe 404; sin permiso, 403.
      operationId: updateComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueCommentRequest'
      responses:
        '200':
          description: Comentario editado, con las advertencias de menciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IssueCommentWrite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      summary: Eliminar un comentario
      description: >-
        Borrado logico para el autor (delete_own_comment) o quien gestiona comentarios (manage_comments). Si el comentario
        tiene respuestas visibles conserva su lugar como marcador; si no, desaparece. Se borran sus revisiones, reacciones
        y menciones.
      operationId: deleteComment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Comentario eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /comments/{comment_id}/revisions:
    parameters:
      - name: comment_id
        in: path
