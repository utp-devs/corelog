        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [issues]
      summary: Quitar la reaccion del usuario
      description: Quita la reaccion del usuario. Repetir la peticion deja el mismo estado.
      operationId: removeCommentReaction
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen de reacciones del comentario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommentReactions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/IssueRef'
      - $ref: '#/components/parameters/IssueOrganizationId'
    get:
      tags: [issues]
      summary: List issue activity feed
      description: Comentarios e historial de la incidencia mezclados, del mas reciente al mas antiguo. Cada PATCH aparece como una sola entrada de historial con sus cambios. Los nombres de campos y de valores (usuarios, prioridades, tipos, etiquetas) se devuelven como texto legible en el momento de la consulta.
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          description: all (por defecto), comments o history.
          schema:
            type: string
            enum: [all, comments, history]
        - name: cursor
          in: query
          required: false
          description: Cursor opaco devuelto en meta.next_cursor de la pagina anterior.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Entradas por pagina, entre 1 y 100 (por defecto 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Pagina de entradas de actividad
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueActivityEntry'
                  meta:
                    type: object
                    required: [limit, next_cursor]
                    properties:
                      limit:
                        type: integer
                      next_cursor:
                        type: string
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{id}/activities:
    parameters:
