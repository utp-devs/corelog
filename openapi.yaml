          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [organization_id, key, name]
      properties:
        organization_id:
          type: string
          format: uuid
          description: Organizacion que es duena del proyecto.
        key:
          type: string
          minLength: 2
          maxLength: 10
          pattern: '^[A-Za-z][A-Za-z0-9]{1,9}$'
          description: >-
            Clave del proyecto. Se guarda en mayusculas. Empieza por letra y usa solo letras y numeros.
            Debe ser unica entre los proyectos activos de la organizacion.
          example: CORE
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Plataforma Core
        description:
          type: string
          maxLength: 5000
        template:
          $ref: '#/components/schemas/ProjectTemplate'
        type:
          type: string
          enum: [kanban, scrum]
          deprecated: true
          description: >-
            Campo legado. Se usa solo cuando falta template: scrum crea una plantilla scrum y kanban una
            plantilla kanban.
        visibility:
          type: string
          enum: [private, open]
          description: >-
            Opcional. Si falta se aplica el valor por defecto de la organizacion. El valor legado team se acepta
            y se guarda como open.
        color:
          type: string
          maxLength: 20
          example: blue
        icon:
          type: string
          maxLength: 40
          example: rocket
        default_assignee_policy:
          type: string
          enum: [unassigned, lead]
          description: Responsable por defecto de las incidencias nuevas. Por defecto unassigned.
        member_ids:
          type: array
          maxItems: 100
          description: Usuarios que se anaden como contributor. El creador siempre es lider.
          items:
            type: string
            format: uuid
        team_ids:
          type: array
          maxItems: 100
          description: Equipos que reciben el rol contributor en el proyecto. Deben pertenecer a la organizacion.
          items:
            type: string
            format: uuid
    UpdateProjectRequest:
      type: object
      required: [name, type, lead_id, visibility]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum: [kanban, scrum]
        lead_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [private, open]
          description: El valor legado team se acepta y se guarda como open.
        color:
          type: string
          maxLength: 20
          description: Si falta se conserva el valor actual.
        icon:
          type: string
          maxLength: 40
          description: Si falta se conserva el valor actual.
        default_assignee_policy:
          type: string
          enum: [unassigned, lead]
          description: Si falta se conserva el valor actual.
    IssueActivityEntry:
      type: object
      required: [id, type, created_at, actor]
      properties:
        id:
          type: string
          format: uuid
          description: Id del comentario, o del lote de cambios (todos los cambios de un PATCH comparten id).
        type:
          type: string
          enum: [comment, history]
        created_at:
          type: string
          format: date-time
        actor:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              description: Nombre actual, o "Usuario eliminado".
        comment:
          type: object
          description: Presente cuando type es comment.
          properties:
            id:
              type: string
              format: uuid
            body:
              type: string
            updated_at:
              type: string
              format: date-time
            edited:
              type: boolean
        changes:
          type: array
          description: Presente cuando type es history. Cambios del lote en orden.
          items:
            type: object
            required: [action, field, label]
            properties:
              action:
                type: string
                enum: [field_changed, assignee_changed, link_added, link_removed]
              field:
                type: string
                description: Nombre interno del campo.
              label:
                type: string
                description: Nombre del campo en español.
              from:
                type: string
                nullable: true
                description: Valor anterior legible (nombres en lugar de ids).
              to:
                type: string
                nullable: true
                description: Valor nuevo legible (nombres en lugar de ids).
    UpdateProjectLabelRequest:
      type: object
