# Muchos 404 desde la misma IP = sondeo de rutas (formato de log propio de Nginx).
# fail2ban quita la fecha antes de aplicar la expresion, por eso quedan corchetes vacios: \[\]
[Definition]
failregex = ^<HOST> \[\] "(?:GET|POST|HEAD|PUT|DELETE|PATCH) [^"]*" 404 
ignoreregex = ^<HOST> \[\] "[A-Z]+ /(?:favicon\.ico|robots\.txt|apple-touch-icon[^ ]*|\.well-known/[^ ]*)[ ?]
