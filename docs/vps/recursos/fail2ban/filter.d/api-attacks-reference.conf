# Referencia: ataques conocidos a APIs vistos en el error.log de nginx (servidor anterior).
[Definition]
_pre = ^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[error\] \d+#\d+: \*\d+[ ]
failregex = %(_pre)s.*client: <HOST>,.*request: "GET /(?:\.env|[^" ]*phpunit|[^" ]*think[^" ]*invokefunction|owa/auth|[^" ]*eval-stdin\.php)
            %(_pre)s\[client <HOST>\].*\[uri "/(?:\.env|[^"]*phpunit|[^"]*invokefunction|owa/auth|[^"]*eval-stdin\.php)
ignoreregex =
datepattern = {^LN-BEG}%%Y/%%m/%%d %%H:%%M:%%S
