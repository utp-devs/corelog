# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;
    if ($is_blocked_country) { return 444; }
    include /etc/nginx/snippets/block-attacks.conf;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# Frontend (protegido por Anubis)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    if ($is_blocked_country) { return 444; }
    include /etc/nginx/snippets/block-attacks.conf;
    include /etc/nginx/snippets/anubis-gate.conf;
    include /etc/nginx/snippets/security-headers-app.conf;
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:18081;
    }
}

# Backend API (sin Anubis: la consume el navegador por fetch)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    if ($is_blocked_country) { return 444; }
    include /etc/nginx/snippets/block-attacks.conf;
    limit_req zone=api_limit burst=60 nodelay;
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:18080;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:18080;
    }
}
