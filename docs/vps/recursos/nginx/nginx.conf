user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
error_log stderr warn;

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    more_clear_headers Server;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 64;

    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_max_body_size 20m;
    large_client_header_buffers 4 8k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 10s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    log_format main "$remote_addr [$time_local] \"$request\" $status $body_bytes_sent country=\"$geoip2_country_code\" host=\"$host\" rt=$request_time urt=\"$upstream_response_time\" ua=\"$http_user_agent\"";
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req zone=req_limit_per_ip burst=100 nodelay;
    limit_conn conn_limit_per_ip 100;

    ##
    # ModSecurity (OWASP CRS)
    ##
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    ##
    # GeoIP2 - solo Peru (y redes privadas / sin dato)
    ##
    geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
        auto_reload 60m;
        $geoip2_country_code source=$remote_addr country iso_code;
    }
    map $geoip2_country_code $is_blocked_country {
        default 1;
        PE      0;
        ""      0;
    }
    log_format blocked_geo '$time_local BLOCKED ip=$remote_addr country=$geoip2_country_code "$request"';
    access_log /var/log/nginx/geo_blocked.log blocked_geo if=$is_blocked_country;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
