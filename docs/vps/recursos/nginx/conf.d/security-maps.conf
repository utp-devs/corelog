# Requests that target private resources / credentials / known scanners.
map $request_uri $attack_uri {
    default 0;
    ~*(^|/)\.(env|git|svn|hg|aws|ssh|docker|kube|npmrc|pypirc|htaccess|htpasswd|ds_store|bash_history|vscode|idea)(/|$|\?|\.) 1;
    ~*/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|wp-json) 1;
    ~*/(phpmyadmin|pma|adminer|myadmin|phpinfo|info\.php|server-status|server-info|cgi-bin|actuator|jmx-console|manager/html|vendor/phpunit|boaform|hnap1)(/|$|\?|\.) 1;
    ~*(etc/passwd|etc/shadow|proc/self|windows/win\.ini|boot\.ini) 1;
    ~*(\.\./|%2e%2e|%00) 1;
    ~*\.(sql|bak|backup|old|orig|swp|dump|tar|tgz|gz|zip|7z|rar|pem|key|p12|pfx|jks|ovpn|crt|cer|log|ini|conf|cfg|yml|yaml|toml|php|asp|aspx|jsp|cgi|sh|bash|py|rb|pl)(\?|$) 1;
    ~*/(id_rsa|id_ed25519|composer\.json|config\.json|docker-compose|dockerfile)(\?|$|\.) 1;
}
map $http_user_agent $attack_agent {
    default 0;
    ~*(sqlmap|nikto|dirbuster|gobuster|nessus|openvas|nmap|masscan|zgrab|wpscan|acunetix|havij|hydra|metasploit|nuclei|whatweb|ffuf|feroxbuster|jaeles|netsparker|appscan|w3af) 1;
}
map "$attack_uri$attack_agent" $is_attack {
    "00"    0;
    default 1;
}
log_format attack '$remote_addr [$time_local] "$request" $status host="$host" ua="$http_user_agent"';
access_log /var/log/nginx/attacks.log attack if=$is_attack;
